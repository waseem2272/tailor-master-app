<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Tailor Master</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
    <style>
        .form-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-xl-8 col-lg-9 col-md-10">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <!-- ========================= -->
                <!-- HEADER -->
                <!-- ========================= -->

                <div class="card-header bg-success text-white text-center py-4 border-0">

                    <div class="mb-2">
                        <i class="bi bi-person-plus-fill fs-1"></i>
                    </div>

                    <h3 class="fw-bold mb-1">
                        نیا اکاؤنٹ بنائیں
                    </h3>

                    <div class="small opacity-75">
                        اپنی دکان کی معلومات درج کریں
                    </div>

                </div>


                <!-- ========================= -->
                <!-- BODY -->
                <!-- ========================= -->

                <div class="card-body p-4 p-md-5">

                    <!-- Required fields alert -->
                    <div class="alert alert-warning border-0 rounded-3 d-flex align-items-center gap-2 mb-4"
                         role="alert">

                        <i class="bi bi-info-circle-fill fs-5"></i>

                        <span class="fw-semibold">
                            <span class="text-danger">*</span>
                            والے خانے لازمی ہیں
                        </span>

                    </div>


                    <form method="post"
                          th:action="@{/users/register}"
                          th:object="${user}"
                          enctype="multipart/form-data">


                        <!-- ========================= -->
                        <!-- ACCOUNT INFORMATION -->
                        <!-- ========================= -->

                        <div class="form-section mb-4">

                            <div class="section-heading mb-3">
                                <div>
                                    <h5 class="fw-bold mb-0">
                                        اکاؤنٹ کی معلومات
                                    </h5>

                                    <small class="text-muted">
                                        لاگ اِن کے لیے معلومات درج کریں
                                    </small>
                                </div>

                            </div>


                            <div class="row g-3">

                                <!-- Username -->
                                <div class="col-md-6">

                                    <label for="username"
                                           class="form-label fw-semibold">
                                        صارف نام
                                        <span class="text-danger">*</span>
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-person"></i>
                                        </span>

                                        <input type="text"
                                               class="form-control border-start-0"
                                               id="username"
                                               th:field="*{username}"
                                               placeholder="صارف نام درج کریں"
                                               required>

                                    </div>

                                </div>


                                <!-- Password -->
                                <div class="col-md-6">

                                    <label for="password"
                                           class="form-label fw-semibold">
                                        پاس ورڈ
                                        <span class="text-danger">*</span>
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-lock"></i>
                                        </span>

                                        <input type="password"
                                               class="form-control border-start-0"
                                               id="password"
                                               th:field="*{password}"
                                               placeholder="پاس ورڈ درج کریں"
                                               required>

                                    </div>

                                </div>

                            </div>

                        </div>


                        <hr class="my-4 opacity-25">


                        <!-- ========================= -->
                        <!-- PERSONAL INFORMATION -->
                        <!-- ========================= -->

                        <div class="form-section mb-4">

                            <div class="section-heading mb-3">

                                <div>
                                    <h5 class="fw-bold mb-0">
                                        ذاتی معلومات
                                    </h5>

                                    <small class="text-muted">
                                        اپنی بنیادی معلومات درج کریں
                                    </small>
                                </div>

                            </div>


                            <div class="row g-3">

                                <!-- Full Name -->
                                <div class="col-md-6">

                                    <label for="fullName"
                                           class="form-label fw-semibold">
                                        پورا نام
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="fullName"
                                           th:field="*{fullName}"
                                           placeholder="پورا نام درج کریں"
                                           required>

                                </div>


                                <!-- Phone 1 -->
                                <div class="col-md-6">

                                    <label for="phone1"
                                           class="form-label fw-semibold">
                                        فون نمبر 1
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="phone1"
                                           th:field="*{phone1}"
                                           placeholder="فون نمبر 1 درج کریں"
                                           required>

                                </div>


                                <!-- Phone 2 -->
                                <div class="col-md-6">

                                    <label for="phone2"
                                           class="form-label fw-semibold">
                                        فون نمبر 2
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="phone2"
                                           th:field="*{phone2}"
                                           placeholder="فون نمبر 2 درج کریں (اختیاری)">

                                </div>

                            </div>

                        </div>
                        <hr class="my-4 opacity-25">

                        <!-- ========================= -->
                        <!-- SHOP INFORMATION -->
                        <!-- ========================= -->

                        <div class="form-section mb-4">

                            <div class="section-heading mb-3">

                                <div>
                                    <h5 class="fw-bold mb-0">
                                        دکان کی معلومات
                                    </h5>

                                    <small class="text-muted">
                                        اپنی دکان کی معلومات درج کریں
                                    </small>
                                </div>

                            </div>


                            <div class="row g-3">

                                <!-- Shop Name -->
                                <div class="col-md-6">

                                    <label for="shopName"
                                           class="form-label fw-semibold">
                                        دکان کا نام
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="shopName"
                                           th:field="*{shopName}"
                                           placeholder="دکان کا نام درج کریں"
                                           required>

                                </div>


                                <!-- Proprietor Name -->
                                <div class="col-md-6">

                                    <label for="proprietorName"
                                           class="form-label fw-semibold">
                                        مالک کا نام
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="proprietorName"
                                           th:field="*{proprietorName}"
                                           placeholder="مالک کا نام درج کریں"
                                           required>

                                </div>


                                <!-- Shop Address -->
                                <div class="col-12">

                                    <label for="shopAddress"
                                           class="form-label fw-semibold">
                                        دکان کا پتہ
                                        <span class="text-danger">*</span>
                                    </label>

                                    <textarea class="form-control"
                                              id="shopAddress"
                                              th:field="*{shopAddress}"
                                              rows="3"
                                              placeholder="دکان کا پتہ درج کریں"
                                              required></textarea>

                                </div>

                            </div>

                        </div>
                        <hr class="my-4 opacity-25">

                        <!-- ========================= -->
                        <!-- SHOP LOGO -->
                        <!-- ========================= -->

                        <div class="form-section mb-4">

                            <div class="logo-upload-box">

                                <label for="logo"
                                       class="form-label fw-semibold">

                                    دکان کا لوگو

                                    <span class="text-muted small">
                                        (PNG, JPG, JPEG)
                                    </span>

                                </label>


                                <input type="file"
                                       class="form-control"
                                       id="logo"
                                       name="logo"
                                       accept="image/png, image/jpeg, image/jpg">

                            </div>

                        </div>
                        <hr class="my-4 opacity-25">

                        <!-- ========================= -->
                        <!-- SUBMIT BUTTON -->
                        <!-- ========================= -->

                        <div class="d-grid mt-4">

                            <button type="submit"
                                    class="btn btn-success btn-lg rounded-pill shadow">

                                <i class="bi bi-person-plus-fill me-2"></i>

                                اکاؤنٹ بنائیں

                            </button>

                        </div>

                    </form>

                </div>


                <!-- ========================= -->
                <!-- FOOTER -->
                <!-- ========================= -->

                <div class="card-footer bg-light border-0 text-center py-3">

                    <span class="text-muted">
                        کیا پہلے سے اکاؤنٹ موجود ہے؟
                    </span>

                    <a th:href="@{/login}"
                       class="text-success fw-bold text-decoration-none ms-1">
                        لاگ اِن کریں
                        <i class="bi bi-box-arrow-in-left ms-1"></i>

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
