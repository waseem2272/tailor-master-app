<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Product</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content container-fluid">
        <div class="row justify-content-center mt-4">
            <div class="col-lg-8">
                <div class="card border-success border-bottom border-3 shadow rounded-4 p-4">
                    <h2 class="text-center mb-3">Update Product</h2>
                    <hr class="mb-4"/>

                    <!-- Error Alert (consistent style) -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3" role="alert">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>
                        <button type="button" class="btn-close bg-light" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <p class="text-danger fw-bold">Fields marked with * are required.</p>

                    <form id="updateProductForm" th:action="@{/products/update}" th:object="${product}" method="post" onsubmit="return validateForm()">
                        <input type="hidden" name="encryptedProductId"
                               th:if="${thymeleafUtil != null}"
                               th:value="${thymeleafUtil.encryptId(product.id)}"/>

                        <div class="mb-3">
                            <label for="name" class="form-label">Product Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" th:field="*{name}" class="form-control rounded-3 shadow-sm" required>
                            <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1">
                                <div th:each="error : ${#fields.errors('name')}" th:text="${error}"></div>
                            </div>
                            <div id="nameError" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label for="type" class="form-label">Product Type <span class="text-danger">*</span></label>
                            <select id="type" th:field="*{type}" class="form-select rounded-3 shadow-sm" required>
                                <option value="">Select Product Type</option>
                                <option th:each="productType : ${T(com.example.tailormaster.entity.product.ProductType).values()}"
                                        th:value="${productType}"
                                        th:text="${productType}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('type')}" class="text-danger small mt-1">
                                <div th:each="error : ${#fields.errors('type')}" th:text="${error}"></div>
                            </div>
                            <div id="typeError" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Price <span class="text-danger">*</span></label>
                            <input type="number" id="price" th:field="*{price}" class="form-control rounded-3 shadow-sm" step="0.01" required>
                            <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1">
                                <div th:each="error : ${#fields.errors('price')}" th:text="${error}"></div>
                            </div>
                            <div id="priceError" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control rounded-3 shadow-sm" rows="3"></textarea>
                            <div th:if="${#fields.hasErrors('description')}" class="text-danger small mt-1">
                                <div th:each="error : ${#fields.errors('description')}" th:text="${error}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="enabled" class="form-label">Status <span class="text-danger">*</span></label>
                            <select id="enabled" th:field="*{enabled}" class="form-select rounded-3 shadow-sm" required>
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </div>

                        <div class="text-center mt-3">
                            <button type="button" class="btn btn-success shadow rounded-pill px-4" id="openModal">
                                <i class="bi bi-check-circle"></i> Update
                            </button>
                            <a th:href="@{/products}" class="btn btn-secondary shadow rounded-pill px-4">
                                <i class="bi bi-x-circle me-1"></i> Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmModalLabel">Confirm Update</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                Are you sure you want to update this product?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
                <button type="button" class="btn btn-success" id="confirmSubmit">
                    <i class="bi bi-check-circle"></i> Yes, Update
                </button>
            </div>

        </div>
    </div>
</div>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("openModal").addEventListener("click", function (event) {
            event.preventDefault();
            if (validateForm()) {
                new bootstrap.Modal(document.getElementById('confirmModal')).show();
            }
        });

        document.getElementById("confirmSubmit").addEventListener("click", function () {
            document.getElementById("updateProductForm").submit();
        });
    });

    function validateForm() {
        let isValid = true;
        const name = document.getElementById("name");
        const price = document.getElementById("price");
        const type = document.getElementById("type");

        document.querySelectorAll(".error-message").forEach(el => el.textContent = "");

        if (name.value.trim() === "") {
            showError(name, "Product name is required.");
            isValid = false;
        }
        if (price.value.trim() === "" || parseFloat(price.value) <= 0) {
            showError(price, "Price must be greater than 0.");
            isValid = false;
        }
        if (type.value.trim() === "") {
            showError(type, "Please select a product type.");
            isValid = false;
        }

        return isValid;
    }

    function showError(input, message) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "text-danger small error-message mt-1";
        errorDiv.textContent = message;
        input.parentNode.appendChild(errorDiv);
    }
</script>
</body>
</html>
