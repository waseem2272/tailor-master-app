<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Products</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">

    <div class="main-content container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="page-title d-flex align-items-center mb-4">
                <i class="bi bi-box-seam-fill me-2"></i>
                Products
            </h2>

            <a th:href="@{/products/create}"
               class="btn btn-success rounded-pill shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>
                Create New Product
            </a>

        </div>

        <!-- Success Message -->
        <div th:if="${successMessage}"
             class="row justify-content-center">

            <div class="alert alert-success alert-dismissible fade show shadow-sm rounded-3"
                 role="alert">

                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-2 fs-4"></i>
                    <span th:text="${successMessage}"></span>
                </div>

                <button type="button"
                        class="btn-close bg-light"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>

            </div>

        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}"
             class="row justify-content-center">

            <div class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3"
                 role="alert">

                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <button type="button"
                        class="btn-close bg-light"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>

            </div>

        </div>

        <div class="card shadow-sm border-success border-bottom border-3">

            <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                <i class="bi bi-box-seam me-2"></i>
                Product List
            </div>

            <div class="card-body">

                <table id="productsTable"
                       class="table table-bordered table-hover table-striped">

                    <thead class="table-success text-dark">
                    <tr>
                        <th>#</th>
                        <th>Product Name</th>
                        <th>Single Stitching</th>
                        <th>Double Stitching</th>
                        <th>Created Date</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="product, iterStat : ${products}">

                        <td th:text="${iterStat.index + 1}"></td>

                        <td th:text="${product.name}"></td>

                        <td class="format-amount"
                            th:text="${product.singleSilai}">
                        </td>

                        <td class="format-amount"
                            th:text="${product.doubleSilai}">
                        </td>

                        <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}">
                        </td>

                        <td>

                            <a th:href="@{'/products/update/' + ${thymeleafUtil.encryptId(product.id)}}"
                               class="btn btn-warning btn-sm rounded-pill shadow-sm"
                               title="Edit Product">

                                <i class="bi bi-pencil-square me-1"></i>
                                Edit

                            </a>

                            <a th:href="@{'/products/' + ${thymeleafUtil.encryptId(product.id)} + '/measurements'}"
                               class="btn btn-info btn-sm rounded-pill shadow-sm"
                               title="Manage Measurements">

                                <i class="bi bi-rulers me-1"></i>
                                Manage Measurements

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/notification-modal :: notification}"></div>

<!--
<div th:replace="~{fragments/footer :: footer}"></div>
-->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:src="@{/js/common.js}"></script>

<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>

<script>
    $(document).ready(function () {
        $('#productsTable').DataTable();
    });
</script>

</body>
</html>
