<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .alert {
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>
<body>
<!-- Include Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="text-center">Products</h2>
            <!-- Success Alert -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}"></span>
            </div>
            <a th:href="@{/products/create}" class="btn btn-success mb-3">Create New Product</a>
            <table id="productsTable" class="table table-bordered">
                <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Created Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product, iterStat : ${products}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.description}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.enabled} ? 'Active' : 'Non-Active'"></td>
                    <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}"></td>
                    <td>
                        <a th:href="@{'/products/update/' + ${thymeleafUtil.encryptId(product.id)}}" class="btn btn-sm btn-warning">Edit</a>
                        <!--<a th:href="@{'/products/delete/' + ${product.id}}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>-->
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script>
    $(document).ready(function () {
        $('#productsTable').DataTable();
    });
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
