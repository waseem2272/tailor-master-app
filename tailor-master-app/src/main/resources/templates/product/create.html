<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Product</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <form id="productForm" th:action="@{/products/create}" th:object="${product}" method="post" onsubmit="return validateForm()">
                <h2 class="page-title d-flex align-items-center mb-4">
                    <i class="bi bi-box-seam-fill me-2"></i> نیا پروڈکٹ بنائیں
                </h2>
                <p class="text-danger fw-bold">* والے خانے لازمی پر کریں</p>

                <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                    <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                        <i class="bi bi-info-circle me-2"></i> پروڈکٹ کی معلومات
                    </div>

                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">سلائی کی قسم <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" required>
                                <div id="nameError" class="text-danger error-message"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="singleSilai" class="form-label">سنگل سلائی <span class="text-danger">*</span></label>
                                <input type="number" id="singleSilai" th:field="*{singleSilai}" class="form-control" step="0.01" required>
                                <div id="singleSilaiError" class="text-danger error-message"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="doubleSilai" class="form-label">ڈبل سلائی <span class="text-danger">*</span></label>
                                <input type="number" id="doubleSilai" th:field="*{doubleSilai}" class="form-control" step="0.01" required>
                                <div id="doubleSilaiError" class="text-danger error-message"></div>
                            </div>

                            <div class="text-center">
                                <button type="button" class="btn btn-success rounded-pill shadow-sm" id="openModal">
                                    <i class="bi bi-check-circle"></i> محفوظ کریں
                                </button>
                                <a th:href="@{/products}" class="btn btn-secondary rounded-pill shadow-sm">
                                    <i class="bi bi-x-circle"></i> منسوخ کریں
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow pickup-modal">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmModalLabel">پروڈکٹ کی تصدیق</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                کیا آپ واقعی یہ پروڈکٹ محفوظ کرنا چاہتے ہیں؟
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">منسوخ کریں</button>
                <button type="button" class="btn btn-success rounded-pill" id="confirmSubmit">
                    <i class="bi bi-check-circle"></i> جی ہاں، محفوظ کریں
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/notification-modal :: notification}"></div>
<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("openModal").addEventListener("click", function (event) {
            event.preventDefault();
            if (validateForm()) {
                var confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
                confirmModal.show();
            }
        });
        document.getElementById("confirmSubmit").addEventListener("click", function () {
            document.getElementById("productForm").submit();
        });
    });

    function validateForm() {
        let isValid = true;
        document.querySelectorAll(".error-message").forEach(el => el.textContent = "");

        const name = document.getElementById("name");
        const singleSilai = document.getElementById("singleSilai");
        const doubleSilai = document.getElementById("doubleSilai");

        if (name.value.trim() === "") {
            showError(name, "Product name is required.");
            isValid = false;
        }
        if (singleSilai.value.trim() === "" || parseFloat(singleSilai.value) <= 0) {
            showError(singleSilai, "Single Silai must be greater than 0.");
            isValid = false;
        }
        if (doubleSilai.value.trim() === "" || parseFloat(doubleSilai.value) <= 0) {
            showError(doubleSilai, "Double Silai must be greater than 0.");
            isValid = false;
        }
        return isValid;
    }

    function showError(input, message) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "text-danger error-message";
        errorDiv.textContent = message;
        input.parentNode.appendChild(errorDiv);
    }
</script>
</body>
</html>
