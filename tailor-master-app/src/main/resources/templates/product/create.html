<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Product</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-success border-bottom border-3 shadow rounded-4 p-3">
                    <h2 class="text-center mb-3">Create New Product</h2>
                    <hr>
                    <p class="text-danger fw-bold">Fields marked with * are required.</p>

                    <form id="productForm" th:action="@{/products/create}" th:object="${product}" method="post" onsubmit="return validateForm()">
                        <div class="mb-3">
                            <label for="name" class="form-label">Product Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" required>
                            <div th:if="${#fields.hasErrors('name')}" class="text-danger error-message">
                                <div th:each="error : ${#fields.errors('name')}" th:text="${error}"></div>
                            </div>
                            <div id="nameError" class="text-danger error-message"></div>
                        </div>

                        <div class="mb-3">
                            <label for="type" class="form-label">Product Type <span class="text-danger">*</span></label>
                            <select id="type" th:field="*{type}" class="form-select" required>
                                <option value="">Select Product Type</option>
                                <option th:each="productType : ${T(com.example.tailormaster.entity.product.ProductType).values()}"
                                        th:value="${productType}" th:text="${productType}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('type')}" class="text-danger error-message">
                                <div th:each="error : ${#fields.errors('type')}" th:text="${error}"></div>
                            </div>
                            <div id="typeError" class="text-danger error-message"></div>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Price <span class="text-danger">*</span></label>
                            <input type="number" id="price" th:field="*{price}" class="form-control" step="0.01" required>
                            <div th:if="${#fields.hasErrors('price')}" class="text-danger error-message">
                                <div th:each="error : ${#fields.errors('price')}" th:text="${error}"></div>
                            </div>
                            <div id="priceError" class="text-danger error-message"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                            <div th:if="${#fields.hasErrors('description')}" class="text-danger error-message">
                                <div th:each="error : ${#fields.errors('description')}" th:text="${error}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="enabled" class="form-label">Status <span class="text-danger">*</span></label>
                            <select id="enabled" th:field="*{enabled}" class="form-select" required>
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </div>

                        <div class="text-center">
                            <button type="button" class="btn btn-success rounded-pill shadow-sm" id="openModal">
                                <i class="bi bi-check-circle"></i> Create
                            </button>
                            <a th:href="@{/products}" class="btn btn-secondary rounded-pill shadow-sm">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmModalLabel">Confirm Product Creation</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to create this product?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success rounded-pill" id="confirmSubmit">
                    <i class="bi bi-check-circle"></i> Yes, Create
                </button>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>
<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("openModal").addEventListener("click", function (event) {
            event.preventDefault();
            if (validateForm()) {
                var confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
                confirmModal.show();
            }
        });
        document.getElementById("confirmSubmit").addEventListener("click", function () {
            document.getElementById("productForm").submit();
        });
    });

    function validateForm() {
        let isValid = true;
        document.querySelectorAll(".error-message").forEach(el => el.textContent = "");

        const name = document.getElementById("name");
        const price = document.getElementById("price");
        const type = document.getElementById("type");

        if (name.value.trim() === "") {
            showError(name, "Product name is required.");
            isValid = false;
        }
        if (price.value.trim() === "" || parseFloat(price.value) <= 0) {
            showError(price, "Price must be greater than 0.");
            isValid = false;
        }
        if (type.value.trim() === "") {
            showError(type, "Please select a product type.");
            isValid = false;
        }
        return isValid;
    }

    function showError(input, message) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "text-danger error-message";
        errorDiv.textContent = message;
        input.parentNode.appendChild(errorDiv);
    }
</script>
</body>
</html>
