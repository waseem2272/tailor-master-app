
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{product.measurement.details}">Product Measurement</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <h2 class="page-title d-flex align-items-center mb-4 flex-wrap">
                <i class="bi bi-box-seam-fill me-2"></i>
                <span th:text="${product.name} + ' ' + #{product.measurement.titleSuffix}"></span>
            </h2>

            <div th:if="${successMessage}" class="row justify-content-center">
                <div class="alert alert-success alert-dismissible fade show shadow-sm rounded-3" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2 fs-4"></i>
                        <span th:text="${successMessage}"></span>
                    </div>
                    <button type="button"
                            class="btn-close bg-light"
                            data-bs-dismiss="alert"
                            th:attr="aria-label=#{button.close}">
                    </button>
                </div>
            </div>

            <div th:if="${errorMessage}" class="row justify-content-center">
                <div class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <button type="button"
                            class="btn-close bg-light"
                            data-bs-dismiss="alert"
                            th:attr="aria-label=#{button.close}">
                    </button>
                </div>
            </div>

            <div class="card border-success border-bottom border-3 shadow-sm mt-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-clock-history me-2"></i>
                    <span th:text="#{product.measurement.details}">Measurement Details</span>
                </div>

                <div class="card-body">

                    <!-- No measurements -->
                    <div th:if="${#lists.isEmpty(fields)} and !${editMode}">
                        <p class="text-muted" th:text="#{product.measurement.noneFound}">
                            No measurements were found for this product.
                        </p>

                        <a th:href="@{'/products/' + ${thymeleafUtil.encryptId(product.id)} + '/measurements?edit=true'}"
                           class="btn btn-success rounded-pill shadow-sm">
                            <i class="bi bi-plus-circle me-1"></i>
                            <span th:text="#{product.measurement.create}">Create Measurement</span>
                        </a>
                    </div>

                    <!-- View measurements -->
                    <div th:if="!${#lists.isEmpty(fields)} and !${editMode}">
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped">
                                <thead class="table-success">
                                <tr>
                                    <th th:text="#{product.measurement.name}">Measurement Name</th>
                                    <th th:text="#{product.measurement.type}">Measurement Type</th>
                                    <th th:text="#{product.measurement.action}">Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="field : ${fields}">
                                    <td th:text="${field.fieldName}"></td>
                                    <td th:text="${field.fieldType}"></td>
                                    <td>
                                        <span th:if="${field.fieldType == 'DROPDOWN'}"
                                              th:each="opt : ${field.options}">
                                            <span class="badge bg-secondary me-1" th:text="${opt}"></span>
                                        </span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="text-center">
                            <a th:href="@{'/products/' + ${thymeleafUtil.encryptId(product.id)} + '/measurements?edit=true'}"
                               class="btn btn-warning shadow rounded-pill px-4">
                                <i class="bi bi-pencil me-1"></i>
                                <span th:text="#{product.measurement.edit}">Edit</span>
                            </a>

                            <a th:href="@{/products}"
                               class="btn btn-secondary shadow rounded-pill px-4">
                                <i class="bi bi-x-circle me-1"></i>
                                <span th:text="#{button.cancel}">Cancel</span>
                            </a>
                        </div>
                    </div>

                    <!-- Create/Edit measurements -->
                    <div th:if="${editMode}">
                        <form id="measurementForm"
                              th:action="@{'/products/' + ${thymeleafUtil.encryptId(product.id)} + '/measurements'}"
                              method="post"
                              class="needs-validation"
                              novalidate>

                            <div class="table-responsive">
                                <table class="table table-bordered table-hover table-striped">
                                    <thead class="table-success text-dark">
                                    <tr>
                                        <th th:text="#{product.measurement.name}">Measurement Name</th>
                                        <th th:text="#{product.measurement.type}">Measurement Type</th>
                                        <th th:text="#{product.measurement.options}">Options (if Dropdown)</th>
                                        <th th:text="#{product.measurement.action}">Action</th>
                                    </tr>
                                    </thead>

                                    <tbody id="measurementFieldsBody">
                                    <tr th:each="field, iterStat : ${fields}">
                                        <td>
                                            <input type="hidden"
                                                   th:name="|fields[${iterStat.index}].id|"
                                                   th:value="${field.id}"/>

                                            <input type="text"
                                                   class="form-control field-name"
                                                   th:value="${field.fieldName}"
                                                   th:name="|fields[${iterStat.index}].fieldName|"
                                                   th:attr="placeholder=#{product.measurement.enterMeasurement}"
                                                   required>
                                        </td>

                                        <td>
                                            <select class="form-select field-type"
                                                    th:name="|fields[${iterStat.index}].fieldType|"
                                                    required>
                                                <option value="TEXT"
                                                        th:selected="${field.fieldType == 'TEXT'}"
                                                        th:text="#{product.measurement.text}">Text</option>
                                                <option value="DROPDOWN"
                                                        th:selected="${field.fieldType == 'DROPDOWN'}"
                                                        th:text="#{product.measurement.dropdown}">Dropdown</option>
                                            </select>
                                        </td>

                                        <td class="options-cell">
                                            <div th:if="${field.fieldType == 'DROPDOWN'}">
                                                <div class="dropdown-options-container">
                                                    <div th:each="opt, optStat : ${field.options}"
                                                         class="input-group mb-2">
                                                        <input type="text"
                                                               class="form-control dropdown-input"
                                                               th:value="${opt}"
                                                               th:name="|fields[${iterStat.index}].options[${optStat.index}]|"
                                                               th:attr="placeholder=#{product.measurement.enterOption}"
                                                               required>

                                                        <button type="button"
                                                                class="btn btn-outline-danger remove-option"
                                                                th:attr="aria-label=#{product.measurement.remove}">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </div>
                                                </div>

                                                <button type="button" class="btn btn-sm btn-success add-option">
                                                    <i class="bi bi-plus-circle me-1"></i>
                                                    <span th:text="#{product.measurement.addOption}">Add New Option</span>
                                                </button>
                                            </div>
                                        </td>

                                        <td class="text-center">
                                            <button type="button" class="btn btn-danger btn-sm remove-row">
                                                <i class="bi bi-trash me-1"></i>
                                                <span th:text="#{product.measurement.remove}">Remove</span>
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="p-3">
                                <button type="button" id="addRowBtn" class="btn btn-secondary btn-sm mb-3">
                                    <i class="bi bi-plus-circle me-1"></i>
                                    <span th:text="#{product.measurement.addNew}">Add New Measurement</span>
                                </button>

                                <div class="text-center">
                                    <button type="button" id="saveBtn"
                                            class="btn btn-success shadow rounded-pill px-4">
                                        <i class="bi bi-check-circle me-1"></i>
                                        <span th:text="#{button.save}">Save</span>
                                    </button>

                                    <a th:href="@{/products}"
                                       class="btn btn-secondary shadow rounded-pill px-4">
                                        <i class="bi bi-x-circle me-1"></i>
                                        <span th:text="#{button.cancel}">Cancel</span>
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1"
     aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmModalLabel"
                    th:text="#{product.measurement.confirmation}">
                    Confirm Save Measurement
                </h5>
                <button type="button" class="btn-close bg-light"
                        data-bs-dismiss="modal"
                        th:attr="aria-label=#{button.close}">
                </button>
            </div>

            <div class="modal-body" th:text="#{product.measurement.confirmMessage}">
                Are you sure you want to save this measurement?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>
                    <span th:text="#{button.cancel}">Cancel</span>
                </button>

                <button type="button" class="btn btn-success rounded-pill" id="confirmSubmit">
                    <i class="bi bi-check-circle me-1"></i>
                    <span th:text="#{product.measurement.yesSave}">Yes, Save</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/notification-modal :: notification}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>

<script th:inline="javascript">
    var contextPath = [[@{/}]];

    const measurementLabels = {
        enterMeasurement: [[#{product.measurement.enterMeasurement}]],
    text: [[#{product.measurement.text}]],
    dropdown: [[#{product.measurement.dropdown}]],
    enterOption: [[#{product.measurement.enterOption}]],
    addOption: [[#{product.measurement.addOption}]],
    remove: [[#{product.measurement.remove}]]
    };
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("measurementForm");
        const saveBtn = document.getElementById("saveBtn");
        const confirmBtn = document.getElementById("confirmSubmit");
        const modalElement = document.getElementById("confirmModal");
        const confirmModal = modalElement ? new bootstrap.Modal(modalElement) : null;

        if (form && saveBtn && confirmBtn && confirmModal) {
            saveBtn.addEventListener("click", function () {
                if (form.checkValidity()) {
                    confirmModal.show();
                } else {
                    form.classList.add("was-validated");
                }
            });

            confirmBtn.addEventListener("click", function () {
                form.submit();
            });
        }

        const addRowBtn = document.getElementById("addRowBtn");
        if (addRowBtn) {
            addRowBtn.addEventListener("click", function () {
                const tbody = document.getElementById("measurementFieldsBody");
                if (!tbody) return;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>
                        <input type="text" class="form-control field-name"
                               placeholder="${measurementLabels.enterMeasurement}" required>
                    </td>
                    <td>
                        <select class="form-select field-type" required>
                            <option value="TEXT">${measurementLabels.text}</option>
                            <option value="DROPDOWN">${measurementLabels.dropdown}</option>
                        </select>
                    </td>
                    <td class="options-cell"></td>
                    <td class="text-center">
                        <button type="button" class="btn btn-danger btn-sm remove-row">
                            <i class="bi bi-trash me-1"></i>${measurementLabels.remove}
                        </button>
                    </td>`;

                tbody.appendChild(row);
                reindexFields();
            });
        }
    });

    function reindexFields() {
        document.querySelectorAll("#measurementFieldsBody tr").forEach(function (row, index) {
            const nameInput = row.querySelector(".field-name");
            const typeInput = row.querySelector(".field-type");

            if (nameInput) nameInput.name = `fields[${index}].fieldName`;
            if (typeInput) typeInput.name = `fields[${index}].fieldType`;

            row.querySelectorAll(".dropdown-input").forEach(function (input, optIndex) {
                input.name = `fields[${index}].options[${optIndex}]`;
            });
        });
    }

    function addDropdownOption(container) {
        if (!container) return;

        const optionRow = document.createElement("div");
        optionRow.classList.add("input-group", "mb-2");

        const input = document.createElement("input");
        input.type = "text";
        input.className = "form-control dropdown-input";
        input.placeholder = measurementLabels.enterOption;
        input.required = true;

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "btn btn-outline-danger remove-option";
        removeButton.setAttribute("aria-label", measurementLabels.remove);
        removeButton.innerHTML = '<i class="bi bi-trash"></i>';

        optionRow.appendChild(input);
        optionRow.appendChild(removeButton);
        container.appendChild(optionRow);

        reindexFields();
    }

    document.addEventListener("click", function (e) {
        const removeRowButton = e.target.closest(".remove-row");
        if (removeRowButton) {
            removeRowButton.closest("tr").remove();
            reindexFields();
            return;
        }

        const removeOptionButton = e.target.closest(".remove-option");
        if (removeOptionButton) {
            removeOptionButton.closest(".input-group").remove();
            reindexFields();
            return;
        }

        const addOptionButton = e.target.closest(".add-option");
        if (addOptionButton) {
            const cell = addOptionButton.closest(".options-cell");
            const container = cell ? cell.querySelector(".dropdown-options-container") : null;
            addDropdownOption(container);
        }
    });

    document.addEventListener("change", function (e) {
        if (!e.target.classList.contains("field-type")) return;

        const row = e.target.closest("tr");
        const optionsCell = row.querySelector(".options-cell");
        if (!optionsCell) return;

        if (e.target.value === "DROPDOWN") {
            optionsCell.innerHTML = `
                <div class="dropdown-options-container"></div>
                <button type="button" class="btn btn-sm btn-success add-option">
                    <i class="bi bi-plus-circle me-1"></i>${measurementLabels.addOption}
                </button>`;

            addDropdownOption(optionsCell.querySelector(".dropdown-options-container"));
        } else {
            optionsCell.innerHTML = "";
        }

        reindexFields();
    });
</script>

</body>
</html>
