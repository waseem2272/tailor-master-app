<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Product Measurement</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="page-title d-flex align-items-center mb-4 flex-wrap">
                <i class="bi bi-box-seam-fill me-2"></i>
                <span th:utext="${product.name} + ' کی پیمائش'"></span>
            </h2>

            <!-- Success Alert -->
            <div th:if="${successMessage}" class="row justify-content-center">
                <div class="alert alert-success alert-dismissible fade show shadow-sm rounded-3" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2 fs-4"></i>
                        <span th:text="${successMessage}"></span>
                    </div>
                    <button type="button" class="btn-close bg-light" data-bs-dismiss="alert"
                            aria-label="Close"></button>
                </div>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="row justify-content-center">
                <div class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <button type="button" class="btn-close bg-light" data-bs-dismiss="alert"
                            aria-label="Close"></button>
                </div>
            </div>

            <div class="card border-success border-bottom border-3 shadow-sm mt-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-clock-history me-2"></i> پیمائش کی تفصیل
                </div>
                <div class="card-body">

                    <!-- CASE 1: No measurements -->
                    <div th:if="${#lists.isEmpty(fields)} and !${editMode}">
                        <p class="text-muted">اس پروڈکٹ کے لیے کوئی پیمائش نہیں ملی۔</p>
                        <a th:href="@{'/products/' + ${thymeleafUtil.encryptId(product.id)} + '/measurements?edit=true'}"
                           class="btn btn-success rounded-pill shadow-sm">
                            <i class="bi bi-plus-circle"></i> پیمائش بنائیں
                        </a>
                    </div>

                    <!-- CASE 2: Show measurements in view mode -->
                    <div th:if="!${#lists.isEmpty(fields)} and !${editMode}">
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped">
                                <thead class="table-success">
                                <tr>
                                    <th>ناپ کا نام</th>
                                    <th>ناپ کی قسم</th>
                                    <th>کاروائی</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="field : ${fields}">
                                    <td th:text="${field.fieldName}"></td>
                                    <td th:text="${field.fieldType}"></td>
                                    <td>
                                <span th:if="${field.fieldType == 'DROPDOWN'}"
                                      th:each="opt : ${field.options}">
                                    <span class="badge bg-secondary me-1" th:text="${opt}"></span>
                                </span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Edit / Cancel buttons -->
                        <div class="text-center">
                            <a th:href="@{'/products/' + ${thymeleafUtil.encryptId(product.id)} + '/measurements?edit=true'}"
                               class="btn btn-warning me-2">
                                <i class="bi bi-pencil"></i> بدلیں
                            </a>
                            <a th:href="@{/products}" class="btn btn-secondary">
                                <i class="bi bi-x-circle me-2"></i>واپس جائیں
                            </a>
                        </div>
                    </div>

                    <!-- CASE 3: Edit/Create mode (your existing form goes here) -->
                    <div th:if="${editMode}">
                        <form id="measurementForm"
                              th:action="@{'/products/' +${thymeleafUtil.encryptId(product.id)} + '/measurements'}"
                              method="post"
                              class="needs-validation"
                              novalidate>

                            <div class="table-responsive">
                                <table class="table table-bordered table-hover table-striped">
                                    <thead class="table-success text-dark">
                                    <tr>
                                        <th>ناپ کا نام</th>           <!-- Field Name -->
                                        <th>ناپ کی قسم</th>           <!-- Field Type -->
                                        <th>اختیارات (اگر ڈراپ ڈاؤن ہو)</th> <!-- Options -->
                                        <th>کاروائی</th>              <!-- Action -->
                                    </tr>
                                    </thead>
                                    <tbody id="measurementFieldsBody">
                                    <!-- Render existing fields -->
                                    <tr th:each="field, iterStat : ${fields}">
                                        <td>
                                            <!-- Hidden field for ID -->
                                            <input type="hidden" th:name="|fields[${iterStat.index}].id|"
                                                   th:value="${field.id}" />
                                            <input type="text"
                                                   class="form-control field-name"
                                                   th:value="${field.fieldName}"
                                                   th:name="|fields[${iterStat.index}].fieldName|"
                                                   placeholder="ناپ درج کریں"
                                                   required>
                                        </td>
                                        <td>
                                            <select class="form-select field-type"
                                                    th:name="|fields[${iterStat.index}].fieldType|"
                                                    required>
                                                <option value="TEXT"
                                                        th:selected="${field.fieldType == 'TEXT'}">لکھائی
                                                </option>
                                                <option value="NUMBER"
                                                        th:selected="${field.fieldType == 'NUMBER'}">نمبر
                                                </option>
                                                <option value="DROPDOWN"
                                                        th:selected="${field.fieldType == 'DROPDOWN'}">انتخاب
                                                </option>
                                            </select>
                                        </td>
                                        <td class="options-cell">
                                            <div th:if="${field.fieldType == 'DROPDOWN'}">
                                                <div class="dropdown-options-container">
                                                    <div th:each="opt, optStat : ${field.options}"
                                                         class="input-group mb-2">
                                                        <input type="text"
                                                               class="form-control dropdown-input"
                                                               th:value="${opt}"
                                                               th:name="|fields[${iterStat.index}].options[${optStat.index}]|"
                                                               placeholder="انتخاب درج کریں"
                                                               required>
                                                        <button type="button"
                                                                class="btn btn-outline-danger remove-option">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                                <button type="button"
                                                        class="btn btn-sm btn-primary add-option">
                                                    <i class="bi bi-plus-circle"></i> نیا انتخاب شامل کریں
                                                </button>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <button type="button"
                                                    class="btn btn-danger btn-sm remove-row">
                                                <i class="bi bi-trash"></i> ہٹائیں
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="p-3">
                                <button type="button" id="addRowBtn" class="btn btn-secondary btn-sm mb-3">
                                    <i class="bi bi-plus-circle"></i> نیا ناپ شامل کریں
                                </button>
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" id="saveBtn" class="btn btn-success">
                                        <i class="bi bi-save"></i> محفوظ کریں
                                    </button>
                                    <a th:href="@{/products}" class="btn btn-secondary">
                                        <i class="bi bi-x-circle"></i> منسوخ کریں
                                    </a>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow pickup-modal">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmModalLabel">ناپ محفوظ کرنے کی تصدیق</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="بند کریں"></button>
            </div>
            <div class="modal-body">
                کیا آپ واقعی یہ ناپ محفوظ کرنا چاہتے ہیں؟
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> منسوخ کریں
                </button>
                <button type="button" class="btn btn-success rounded-pill" id="confirmSubmit">
                    <i class="bi bi-check-circle"></i> جی ہاں، محفوظ کریں
                </button>
            </div>
        </div>
    </div>
</div>


<div th:replace="~{fragments/notification-modal :: notification}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script>

    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("measurementForm");
        const saveBtn = document.getElementById("saveBtn");
        const confirmBtn = document.getElementById("confirmSubmit");

        const confirmModal = new bootstrap.Modal(document.getElementById("confirmModal"));
        // Save click → validate form first
        saveBtn.addEventListener("click", function () {
            if (form.checkValidity()) {
                // ✅ form valid → open modal
                confirmModal.show();
            } else {
                // ❌ invalid → show error styles
                form.classList.add("was-validated");
            }
        });

        // Confirm in modal → actually submit
        confirmBtn.addEventListener("click", function () {
            form.submit();
        });
    });

    function reindexFields() {
        document.querySelectorAll('#measurementFieldsBody tr').forEach((row, index) => {
            row.querySelector('.field-name').name = `fields[${index}].fieldName`;
            row.querySelector('.field-type').name = `fields[${index}].fieldType`;

            const optionInputs = row.querySelectorAll('.dropdown-input');
            optionInputs.forEach((input, optIndex) => {
                input.name = `fields[${index}].options[${optIndex}]`;
            });
        });
    }

    document.getElementById('addRowBtn').addEventListener('click', function () {
        const tbody = document.getElementById('measurementFieldsBody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td><input type="text" class="form-control field-name" required></td>
            <td>
                <select class="form-select field-type" required>
                    <option value="TEXT">لکھائی</option>
                    <option value="NUMBER">نمبر</option>
                    <option value="DROPDOWN">انتخاب</option>
                </select>

            </td>
            <td class="options-cell"></td>
            <td class="text-center">
                <button type="button" class="btn btn-danger btn-sm remove-row">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        `;

        tbody.appendChild(row);
        reindexFields();
    });

    // Remove row
    document.addEventListener('click', function (e) {
        if (e.target.closest('.remove-row')) {
            e.target.closest('tr').remove();
            reindexFields();
        }
    });

    // Handle dropdown type change (new rows)
    document.addEventListener('change', function (e) {
        if (e.target.classList.contains('field-type')) {
            const row = e.target.closest('tr');
            const optionsCell = row.querySelector('.options-cell');
            if (e.target.value === 'DROPDOWN') {
                optionsCell.innerHTML = `
                    <div class="dropdown-options-container"></div>
                    <button type="button" class="btn btn-sm btn-primary add-option">
                        <i class="bi bi-plus-circle"></i> نیا انتخاب شامل کریں
                    </button>
                `;
                const container = optionsCell.querySelector(".dropdown-options-container");
                addDropdownOption(container); // add first option by default
            } else {
                optionsCell.innerHTML = "";
            }
            reindexFields();
        }
    });

    // Add dropdown option
    function addDropdownOption(container) {
        const optionRow = document.createElement("div");
        optionRow.classList.add("input-group", "mb-2");
        optionRow.innerHTML = `
            <input type="text" class="form-control dropdown-input" required>
            <button type="button" class="btn btn-outline-danger remove-option"><i class="bi bi-trash"></i></button>
        `;
        optionRow.querySelector(".remove-option").addEventListener("click", () => {
            optionRow.remove();
            reindexFields();
        });
        container.appendChild(optionRow);
        reindexFields();
    }

    // ✅ Fix: attach "Add Option" handler for existing rows rendered by Thymeleaf
    // ✅ Use event delegation for Add Option
    document.addEventListener("click", function (e) {
        if (e.target.closest(".add-option")) {
            const container = e.target.closest("td").querySelector(".dropdown-options-container");
            addDropdownOption(container);
        }

        if (e.target.closest(".remove-option")) {
            e.target.closest(".input-group").remove();
            reindexFields();
        }
    });

</script>


</body>
</html>
