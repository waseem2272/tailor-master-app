<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Tailor Master</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
    <style>
        .dashboard-card {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.35rem 1rem rgba(0, 0, 0, 0.12);
        }
        .badge-completed {
            background-color: #6f42c1 !important;
        }

        .text-gray-800 {
            color: #5a5c69 !important;
        }

        .fa-2x {
            font-size: 2rem;
        }

        .border-left-primary {
            border-left: 4px solid #4e73df !important;
        }

        .border-left-success {
            border-left: 4px solid #1cc88a !important;
        }

        .border-left-danger {
            border-left: 4px solid #e74a3b !important;
        }

        .border-left-warning {
            border-left: 4px solid #f6c23e !important;
        }

        .border-left-info {
            border-left: 4px solid #36b9cc !important;
        }

        .border-left-dark {
            border-left: 4px solid #343a40 !important;
        }
        .card.custom-shadow {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15),
            0 6px 20px rgba(0, 0, 0, 0.1);
        }

    </style>
</head>
<body>
<!-- Include Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="page-title d-flex align-items-center mb-4">
                <i class="bi bi-speedometer2 me-2"></i> ڈیش بورڈ
            </h2>

            <div class="row">
                <!-- کل گاہک -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-primary custom-shadow h-100 py-2 dashboard-card"
                         onclick="window.location.href=contextPath + 'customers'">

                        <div class="card-body">
                            <div class="row no-gutters align-items-center">

                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                        کل گاہک
                                    </div>

                                    <div class="h5 mb-0 font-weight-bold text-gray-800"
                                         id="totalCustomers">
                                        0
                                    </div>
                                </div>

                                <div class="col-auto">
                                    <i class="bi bi-people-fill fa-2x text-gray-300"></i>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>

                <!-- کل آرڈرز -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-success custom-shadow h-100 py-2 dashboard-card"
                         onclick="window.location.href=contextPath + 'orders'">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                        کل آرڈرز
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" id="totalOrders">0</div>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-cart-fill fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- بقیہ ادائیگیاں -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-danger custom-shadow h-100 py-2 dashboard-card"
                         onclick="window.location.href=contextPath + 'orders/pending-payments'">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">

                                <div class="col mr-2">

                                    <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">
                                        بقیہ ادائیگیاں
                                    </div>

                                    <div class="h5 mb-0 font-weight-bold text-gray-800">
                                        (<span id="pendingPaymentAmount">0.00</span>)
                                        <span id="pendingPaymentCount">0</span>
                                    </div>

                                </div>

                                <div class="col-auto">
                                    <i class="bi bi-exclamation-circle-fill fa-2x text-gray-300"></i>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- اس ماہ کی آمدنی -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-dark custom-shadow h-100 py-2 dashboard-card">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-dark text-uppercase mb-1">
                                        اس ماہ کی آمدنی
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" id="revenueThisMonth">0</div>
                                </div>
                                <div class="col-auto">
                                    <i class="bi bi-cash-stack fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-2">
                <!-- آمدنی کا گراف -->
                <div class="col-md-8 d-flex">
                    <div class="card shadow border-success border-bottom border-3 w-100 h-100 d-flex flex-column">
                        <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                            <i class="bi bi-activity me-2"></i> پچھلے 6 ماہ کی آمدنی
                        </div>
                        <div class="card-body flex-grow-1">
                            <div style="height: 300px; max-height: 300px;">
                                <canvas id="revenueChart" style="height: 100%; width: 100%;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- آرڈر کی صورتحال -->
                <div class="col-md-4 d-flex mt-2">
                    <div class="card shadow border-success border-bottom border-3 w-100 h-100 d-flex flex-column">
                        <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                            <i class="bi bi-pie-chart me-2"></i> آرڈرز کی تقسیم
                        </div>
                        <div class="card-body flex-grow-1">
                            <div style="height: 300px; max-height: 300px;">
                                <canvas id="orderStatusChart" style="height: 100%; width: 100%;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- حالیہ آرڈرز -->
            <div class="card border-success border-bottom border-3 shadow-sm mt-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-clock-history me-2"></i> حالیہ آرڈرز
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover table-striped">
                            <thead class="table-success text-dark">
                            <tr>
                                <th>#</th>
                                <th>آرڈر نمبر</th>
                                <th>گاہک</th>
                                <th>تاریخ</th>
                                <th>صورتحال</th>
                                <th>کل رقم</th>
                            </tr>
                            </thead>
                            <tbody id="recentOrdersBody">
                            <tr><td colspan="6" class="text-center">لوڈ ہو رہا ہے...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- بہترین گاہک -->
            <div class="card border-success border-bottom border-3 shadow-sm mt-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-star-fill me-2"></i> بہترین گاہک
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover table-striped" id="topCustomersTable">
                            <thead class="table-success text-dark">
                            <tr>
                                <th>#</th>
                                <th>نام</th>
                                <th>فون نمبر</th>
                                <th>کل آرڈرز</th>
                                <th>کل ادائیگی</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Rows will be inserted via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/notification-modal :: notification}"></div>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/chart.umd.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        // کل گاہک لوڈ کریں
        fetch(contextPath + "dashboard/total-customers")
            .then(response => response.json())
            .then(data => {
                document.getElementById("totalCustomers").innerText = formatNumber(data);
            })
            .catch(error => console.error("کل گاہک لوڈ کرنے میں مسئلہ:", error));

        // کل آرڈرز لوڈ کریں
        fetch(contextPath + "dashboard/total-orders")
            .then(response => response.json())
            .then(data => {
                document.getElementById("totalOrders").innerText = formatNumber(data);
            })
            .catch(error => console.error("کل آرڈرز لوڈ کرنے میں مسئلہ:", error));

        // بقیہ ادائیگیاں لوڈ کریں
        fetch(contextPath + "dashboard/pending-payments-summary")
            .then(response => response.json())
            .then(data => {

                document.getElementById("pendingPaymentAmount").innerText =
                    "Rs. " + formatAmount(data.amount);

                document.getElementById("pendingPaymentCount").innerText =
                    formatNumber(data.count);

            })
            .catch(error =>
                console.error("بقیہ ادائیگیاں لوڈ کرنے میں مسئلہ:", error)
            );

        // اس ماہ کی آمدنی
        fetch(contextPath + "dashboard/revenue-this-month")
            .then(response => response.json())
            .then(data => {
                document.getElementById("revenueThisMonth").innerText = formatAmount(data);
            })
            .catch(error => console.error("اس ماہ کی آمدنی لوڈ کرنے میں مسئلہ:", error));


        // ماہانہ آمدنی کا رجحان
        fetch(contextPath + 'dashboard/monthly-revenue-trends')
            .then(response => response.json())
            .then(data => {
                const labels = data.map(item => item.month);
                const revenueData = data.map(item => item.revenue);

                const ctx = document.getElementById('revenueChart').getContext('2d');
                const revenueChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'ماہانہ آمدنی (PKR)',
                            data: revenueData,
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 2,
                            fill: false
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value, index, values) {
                                        return 'PKR ' + value;
                                    }
                                }
                            }
                        },
                        plugins: {
                            title: {
                                display: true,
                                text: 'ماہانہ آمدنی کا رجحان (گزشتہ 6 ماہ)'
                            }
                        }
                    }
                });
            });

        // آرڈرز کی صورتحال
        fetch(contextPath + 'dashboard/order-status-counts')
            .then(response => response.json())
            .then(data => {

                const labels = Object.keys(data);
                const counts = Object.values(data);

                // Dynamic total
                const totalOrders = counts.reduce((sum, count) => sum + count, 0);

                const backgroundColors = [
                    'rgba(220, 53, 69, 0.75)',   // cancelled
                    'rgba(108, 117, 125, 0.75)', // pending
                    'rgba(13, 110, 253, 0.75)',  // in_progress
                    'rgba(111, 66, 193, 0.75)',  // completed
                    'rgba(40, 167, 69, 0.8)',    // delivered
                ];

                const borderColors = [
                    'rgba(220, 53, 69, 1)',
                    'rgba(108, 117, 125, 1)',
                    'rgba(13, 110, 253, 1)',
                    'rgba(111, 66, 193, 1)',
                    'rgba(40, 167, 69, 1)',
                ];

                // Center text plugin
                const centerTextPlugin = {
                    id: 'centerText',

                    afterDraw(chart) {
                        const { ctx } = chart;
                        const meta = chart.getDatasetMeta(0);

                        if (!meta.data || !meta.data.length) {
                            return;
                        }

                        const centerX = meta.data[0].x;
                        const centerY = meta.data[0].y;

                        ctx.save();

                        // Dynamic font size based on total digits
                        let fontSize = 32;

                        if (totalOrders >= 1000) {
                            fontSize = 24;
                        } else if (totalOrders >= 100) {
                            fontSize = 28;
                        } else if (totalOrders >= 10) {
                            fontSize = 32;
                        }

                        // Total
                        ctx.font = `bold ${fontSize}px Arial`;
                        ctx.fillStyle = '#212529';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        ctx.fillText(totalOrders, centerX, centerY - 8);

                        // Label
                        ctx.font = '13px Arial';
                        ctx.fillStyle = '#6c757d';

                        ctx.fillText('کل آرڈرز', centerX, centerY + 18);

                        ctx.restore();
                    }
                };

                const ctx = document
                    .getElementById('orderStatusChart')
                    .getContext('2d');

                const orderStatusChart = new Chart(ctx, {
                    type: 'doughnut',

                    data: {
                        labels: labels,

                        datasets: [{
                            label: 'آرڈرز کی صورتحال',
                            data: counts,
                            backgroundColor: backgroundColors,
                            borderColor: borderColors,
                            borderWidth: 1
                        }]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                position: 'bottom'
                            },

                            title: {
                                display: true,
                                text: 'آرڈرز کی صورتحال کی تقسیم'
                            }
                        }
                    },

                    plugins: [centerTextPlugin]
                });
            });

        // حالیہ آرڈرز
        fetch('dashboard/recent-orders')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('recentOrdersBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">کوئی حالیہ آرڈر نہیں ملا۔</td></tr>';
                    return;
                }

                data.forEach((order, index) => {
                    let badgeClass = "badge bg-secondary";
                    if (order.status === "PENDING") {
                        badgeClass = "badge bg-secondary"; // زیر التواء
                    } else if (order.status === "IN_PROGRESS") {
                        badgeClass = "badge bg-primary";   // جاری
                    } else if (order.status === "COMPLETED") {
                        badgeClass = "badge badge-completed";   // مکمل
                    } else if (order.status === "DELIVERED") {
                        badgeClass = "badge bg-success";   // مکمل
                    } else if (order.status === "CANCELLED") {
                        badgeClass = "badge bg-danger";    // منسوخ
                    }
                    const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${order.orderId}</td>
                        <td>${order.customer}</td>
                        <td>${(() => {
                        const date = new Date(order.orderDate);
                        const day = String(date.getDate()).padStart(2, '0');
                        const month = date.toLocaleString('en-US', { month: 'short' });
                        const year = date.getFullYear();

                        return `${day}-${month}-${year}`;
                    })()}</td>

                        <td><span class="${badgeClass}">${order.status}</span></td>
                        <td>${formatAmount(order.totalAmount)}</td>
                    </tr>
                `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            })
            .catch(err => {
                document.getElementById('recentOrdersBody').innerHTML =
                    '<tr><td colspan="6" class="text-danger text-center">آرڈرز لوڈ کرنے میں ناکام۔</td></tr>';
            });

        // بہترین گاہک
        fetch(contextPath + 'dashboard/customers/top')
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#topCustomersTable tbody');
                tbody.innerHTML = '';

                data.forEach((cust, index) => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                <td>${index + 1}</td>
                <td>
                        ${cust.name}
                </td>
                <td>
                        ${cust.phone}
                </td>
                <td>
                        ${formatNumber(cust.totalOrders)}
                </td>
                <td>
                    ${formatAmount(cust.totalPaid)}
                </td>
            `;

                    tbody.appendChild(row);
                });

                // Bootstrap Tooltips فعال کریں
                const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                tooltipTriggerList.forEach(el => new bootstrap.Tooltip(el));
            });


    });
</script>


</body>
</html>
