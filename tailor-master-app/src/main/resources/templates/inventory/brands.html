<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands | Tailor Master</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title mb-0">
                    <i class="bi bi-tags text-success me-2"></i> Brands
                </h2>
                <a th:href="@{/inventory/brands/add}"
                   class="btn btn-success shadow rounded-pill px-4">
                    <i class="bi bi-plus-lg me-1"></i> Add Brand
                </a>
            </div>

            <div th:if="${successMessage != null}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMessage}">Brand saved successfully.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${errorMessage != null}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}">Unable to process brand.</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-success border-bottom border-3 shadow-sm mb-4 rounded-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center justify-content-between rounded-top-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-tags me-2"></i>
                        Inventory Brands
                    </div>
                    <span class="small">
                        Total Brands:
                        <strong th:text="${brands != null ? brands.size() : 0}">0</strong>
                    </span>
                </div>

                <div class="card-body">
                    <div class="alert alert-success d-flex align-items-start" role="alert">
                        <i class="bi bi-info-circle-fill me-2 mt-1"></i>
                        <div>
                            <strong>Brand Management</strong>
                            <div class="small mt-1">
                                Manage the brands available for your inventory items.
                            </div>
                        </div>
                    </div>

                    <div th:if="${brands != null and !brands.isEmpty()}"
                         class="table-responsive">
                        <table id="brandsTable"
                               class="table table-bordered table-hover table-striped">
                            <thead class="table-success text-dark">
                            <tr>
                                <th style="width: 70px;">#</th>
                                <th>Brand Name</th>
                                <th class="text-center" style="width: 120px;">Status</th>
                                <th class="text-end" style="width: 180px;">Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="brand, stat : ${brands}">
                                <td th:text="${stat.count}">1</td>

                                <td>
                                    <span class="fw-semibold"
                                          th:text="${brand.name}">
                                        Gul Ahmed
                                    </span>
                                </td>

                                <td class="text-center">
                                    <span th:if="${brand.active}"
                                          class="badge bg-success-subtle text-success rounded-pill px-3">
                                        Active
                                    </span>

                                    <span th:unless="${brand.active}"
                                          class="badge bg-secondary-subtle text-secondary rounded-pill px-3">
                                        Inactive
                                    </span>
                                </td>

                                <td>
                                    <div class="d-flex gap-1 justify-content-center">

                                        <a th:href="@{/inventory/brands/edit/{id}(id=${brand.id})}"
                                           class="btn btn-warning btn-sm"
                                           title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <form th:if="${brand.active}"
                                              th:action="@{/inventory/brands/deactivate/{id}(id=${brand.id})}"
                                              method="post"
                                              class="d-inline"
                                              onsubmit="return confirm('Are you sure you want to deactivate this brand?');">
                                            <button type="submit"
                                                    class="btn btn-danger btn-sm"
                                                    title="Deactivate">
                                                <i class="bi bi-x-circle"></i>
                                            </button>
                                        </form>

                                        <form th:unless="${brand.active}"
                                              th:action="@{/inventory/brands/activate/{id}(id=${brand.id})}"
                                              method="post"
                                              class="d-inline">
                                            <button type="submit"
                                                    class="btn btn-success btn-sm"
                                                    title="Activate">
                                                <i class="bi bi-check-circle"></i>
                                            </button>
                                        </form>

                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div th:if="${brands == null or brands.isEmpty()}"
                         class="text-center py-5">
                        <div class="mb-3">
                            <i class="bi bi-tags text-muted"
                               style="font-size: 48px;"></i>
                        </div>

                        <h5 class="fw-semibold">No Brands Found</h5>

                        <p class="text-muted mb-3">
                            No brands have been added yet.
                        </p>

                        <a th:href="@{/inventory/brands/add}"
                           class="btn btn-success shadow rounded-pill px-4">
                            <i class="bi bi-plus-lg me-1"></i>
                            Add Your First Brand
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:src="@{/js/common.js}"></script>

<script>
    $(document).ready(function () {
        $('#brandsTable').DataTable();
    });
</script>
</body>
</html>
