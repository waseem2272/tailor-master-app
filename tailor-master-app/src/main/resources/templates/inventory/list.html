<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">

    <style>
        #inventoryTable th,
        #inventoryTable td {
            vertical-align: middle;
        }

        #inventoryTable td:nth-child(9) {
            min-width: 170px;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title d-flex align-items-center mb-4">
                    <i class="bi bi-box-seam me-2"></i> Inventory
                </h2>

                <div class="d-flex gap-2">
                    <a th:href="@{/inventory/stock-in}" class="btn btn-success shadow rounded-pill px-3">
                        <i class="bi bi-box-arrow-in-down me-1"></i> Stock In
                    </a>

                    <a th:href="@{/inventory/stock-out}" class="btn btn-success shadow rounded-pill px-3">
                        <i class="bi bi-box-arrow-up me-1"></i> Stock Out
                    </a>

                    <a th:href="@{/inventory/stock-adjustment}" class="btn btn-success shadow rounded-pill px-3">
                        <i class="bi bi-sliders me-1"></i> Adjustment
                    </a>

                    <a th:href="@{/inventory/movements}" class="btn btn-success shadow rounded-pill px-3">
                        <i class="bi bi-clock-history me-1"></i> History
                    </a>

                    <a th:href="@{/inventory/add}" class="btn btn-success shadow rounded-pill px-4">
                        <i class="bi bi-plus-circle me-1"></i> Add Item
                    </a>
                </div>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage != null}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">

                <i class="bi bi-check-circle me-2"></i>

                <span th:text="${successMessage}">
                    Stock added successfully.
                </span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage != null}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                <i class="bi bi-exclamation-triangle me-2"></i>

                <span th:text="${errorMessage}">
                    Unable to add stock.
                </span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

            <!-- Filters Card -->
            <div class="card border-success border-bottom border-3 shadow-sm mb-4 rounded-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center justify-content-between rounded-top-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-search me-2"></i> Filter Inventory
                    </div>

                    <button class="btn btn-light btn-sm rounded-pill shadow-sm"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#filterSection">
                        <i class="bi bi-funnel"></i> Toggle Filters
                    </button>
                </div>

                <div id="filterSection" class="collapse show">
                    <div class="card-body">
                        <form th:action="@{/inventory/search}" method="get">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Search Item</label>
                                    <input type="text"
                                           name="name"
                                           class="form-control rounded-pill"
                                           placeholder="Search by item name..."
                                           th:value="${param.name}">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Item Type</label>
                                    <select id="itemTypeFilter" class="form-select rounded-pill">
                                        <option value="">All Types</option>
                                        <option value="FABRIC">Fabric</option>
                                        <option value="STITCHED">Stitched</option>
                                        <option value="WAISTCOAT">Waistcoat</option>
                                        <option value="KURTA_PAJAMA">Kurta Pajama</option>
                                        <option value="OTHER">Other</option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Stock Status</label>
                                    <select id="stockFilter" class="form-select rounded-pill">
                                        <option value="">All Stock</option>
                                        <option value="available">In Stock</option>
                                        <option value="low">Low Stock</option>
                                        <option value="out">Out of Stock</option>
                                    </select>
                                </div>

                                <div class="col-md-2 d-flex align-items-end gap-2">
                                    <button type="submit" class="btn btn-success shadow rounded-pill w-100">
                                        <i class="bi bi-search"></i> Search
                                    </button>

                                    <a th:href="@{/inventory}" class="btn btn-secondary shadow rounded-pill">
                                        <i class="bi bi-x-circle"></i>
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Inventory Table -->
            <div class="card border-success border-bottom border-3 shadow-sm mt-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center justify-content-between rounded-top-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-box-seam me-2"></i> Inventory List
                    </div>

                </div>

                <div class="card-body">
                    <div class="table-responsive">
                        <table id="inventoryTable" class="table table-bordered table-hover table-striped">
                            <thead class="table-success text-dark">
                            <tr>
                                <th>#</th>
                                <th>Item Name</th>
                                <th>Type</th>
                                <th>Brand</th>
                                <th>Category</th>
                                <th>Color</th>
                                <th>Size</th>
                                <th>Unit</th>
                                <th>Stock</th>
                                <th>Purchase Price</th>
                                <th>Sale Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody></tbody>

                        </table>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/notification-modal :: notification}"></div>

<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    $(document).ready(function () {

        $('#inventoryTable').DataTable({
            "processing": true,
            "serverSide": true,
            "responsive": true,
            "autoWidth": false,
            "pageLength": 10,

            "ajax": {
                "url": contextPath + "inventory/datatable",
                "type": "GET",
                "data": function (d) {
                    d.name = $('input[name="name"]').val();
                    d.itemType = $('#itemTypeFilter').val();
                    d.stockStatus = $('#stockFilter').val();
                }
            },

            "columns": [
                {
                    "data": null,
                    "orderable": false,
                    "searchable": false,
                    "render": function (data, type, row, meta) {
                        return meta.row + meta.settings._iDisplayStart + 1;
                    }
                },
                {"data": "itemName"},
                {
                    "data": "type",
                    "render": function (data) {
                        if (data === "FABRIC") {
                            return '<span class="badge bg-success">Fabric</span>';
                        }
                        if (data === "STITCHED") {
                            return '<span class="badge bg-primary">Stitched</span>';
                        }
                        if (data === "WAISTCOAT") {
                            return '<span class="badge bg-secondary">Waistcoat</span>';
                        }
                        if (data === "KURTA PAJAMA") {
                            return '<span class="badge bg-warning text-dark">Kurta Pajama</span>';
                        }
                        if (data === "OTHER") {
                            return '<span class="badge bg-dark">Other</span>';
                        }
                        return '<span class="text-muted">—</span>';
                    }
                },
                {"data": "brand"},
                {"data": "category"},
                {"data": "color"},
                {"data": "size"},
                {"data": "unit"},
                {
                    "data": null,
                    "orderable": false,
                    "render": function (data, type, row) {
                        return '<div class="d-flex flex-column gap-1">'
                            + '<div class="small">'
                            + '<span class="text-muted">Physical:</span> '
                            + '<strong>' + row.physical + '</strong>'
                            + (row.unit ? ' <span class="text-muted">' + row.unit + '</span>' : '')
                            + '</div>'
                            + '<div class="small">'
                            + '<span class="text-muted">Reserved:</span> '
                            + '<strong>' + row.reserved + '</strong>'
                            + (row.unit ? ' <span class="text-muted">' + row.unit + '</span>' : '')
                            + '</div>'
                            + '<div class="small">'
                            + '<span class="text-muted">Available:</span> '
                            + '<strong>' + row.available + '</strong>'
                            + (row.unit ? ' <span class="text-muted">' + row.unit + '</span>' : '')
                            + '</div>'
                            + '</div>';
                    }
                },
                {
                    "data": "purchasePrice",
                    "render": function (data) {
                        return data !== null
                            ? data
                            : '<span class="text-muted">—</span>';
                    }
                },
                {
                    "data": "salePrice",
                    "render": function (data) {
                        return data !== null
                            ? data
                            : '<span class="text-muted">—</span>';
                    }
                },
                {
                    "data": "status",
                    "orderable": false,
                    "render": function (data) {
                        if (data === "Out of Stock") {
                            return '<span class="badge bg-danger">Out of Stock</span>';
                        }
                        if (data === "Reserved") {
                            return '<span class="badge bg-secondary">Reserved</span>';
                        }
                        if (data === "Low Stock") {
                            return '<span class="badge bg-warning text-dark">Low Stock</span>';
                        }
                        if (data === "Available") {
                            return '<span class="badge bg-success">Available</span>';
                        }
                        return '<span class="text-muted">—</span>';
                    }
                },
                {
                    "data": null,
                    "orderable": false,
                    "searchable": false,
                    "render": function (data, type, row) {

                        return `
            <div class="d-flex gap-1 justify-content-center">

                <a href="${contextPath}inventory/batches/${row.id}"
                   class="btn btn-info btn-sm text-white"
                   title="Manage Batches">
                    <i class="bi bi-layers"></i>
                </a>

                <a href="${contextPath}inventory/edit/${row.id}"
                   class="btn btn-warning btn-sm"
                   title="Edit">
                    <i class="bi bi-pencil"></i>
                </a>

                <a href="${contextPath}inventory/delete/${row.id}"
                   class="btn btn-danger btn-sm"
                   title="Delete"
                   onclick="return confirm('Are you sure you want to delete this item?');">
                    <i class="bi bi-trash"></i>
                </a>

            </div>
        `;
                    }
                }
            ]
        });

        $('form[action$="/inventory/search"]').on('submit', function (e) {
            e.preventDefault();

            $('#inventoryTable').DataTable().ajax.reload();
        });

        $('#itemTypeFilter, #stockFilter').on('change', function () {
            $('#inventoryTable').DataTable().ajax.reload();
        });

    });
</script>

<script>
    document.getElementById('itemTypeFilter')?.addEventListener('change', function () {
        const selectedType = this.value;
        const rows = document.querySelectorAll('#inventoryTable tbody tr');

        rows.forEach(row => {
            if (!row.children[2]) return;

            if (!selectedType) {
                row.style.display = '';
                return;
            }

            const typeText = row.children[2].innerText.trim().toUpperCase();
            const normalizedType = typeText.replace(/\s+/g, '_');
            row.style.display = normalizedType === selectedType ? '' : 'none';
        });
    });

    document.getElementById('stockFilter')?.addEventListener('change', function () {
        const selectedStatus = this.value;
        const rows = document.querySelectorAll('#inventoryTable tbody tr');

        rows.forEach(row => {
            if (!row.children[11]) return;

            const statusText = row.children[11].innerText.trim().toLowerCase();

            if (!selectedStatus) {
                row.style.display = '';
            } else if (
                (selectedStatus === 'available' && statusText === 'available') ||
                (selectedStatus === 'low' && statusText === 'low stock') ||
                (selectedStatus === 'out' && statusText === 'out of stock')
            ) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    });
</script>

</body>
</html>
