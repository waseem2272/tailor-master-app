<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Movement History | Tailor Master</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title mb-0"><i class="bi bi-clock-history text-success me-2"></i>Stock Movement History
                </h2>
                <div class="d-flex gap-2">
                    <a th:href="@{/inventory/stock-in}" class="btn btn-success shadow rounded-pill px-4"><i
                            class="bi bi-box-arrow-in-down me-1"></i>Stock In</a>
                    <a th:href="@{/inventory/stock-out}" class="btn btn-success shadow rounded-pill px-4"><i
                            class="bi bi-box-arrow-up me-1"></i>Stock Out</a>
                    <a th:href="@{/inventory}" class="btn btn-secondary shadow rounded-pill px-4"><i
                            class="bi bi-arrow-left me-1"></i>Back</a>
                </div>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-success border-bottom border-3 shadow-sm mb-4 rounded-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center justify-content-between rounded-top-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-funnel me-2"></i>Filter Movements
                    </div>
                </div>
                <div class="card-body">
                    <form th:action="@{/inventory/movements}" method="get">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-5">
                                <label for="itemId" class="form-label fw-semibold">Inventory Item</label>
                                <select name="itemId" id="itemId" class="form-select rounded-pill">
                                    <option value="">All Items</option>
                                    <option th:each="item : ${inventoryItems}" th:value="${item.id}"
                                            th:selected="${selectedItemId != null and selectedItemId == item.id}"
                                            th:text="${item.name}">Cotton
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="movementType" class="form-label fw-semibold">Movement Type</label>
                                <select name="movementType" id="movementType" class="form-select rounded-pill">
                                    <option value="">All Movements</option>
                                    <option th:each="type : ${movementTypes}" th:value="${type.name()}"
                                            th:selected="${selectedMovementType != null and selectedMovementType.name() == type.name()}"
                                            th:text="${type.name()}">IN
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-success shadow rounded-pill px-4 flex-grow-1">
                                        <i class="bi bi-funnel me-1"></i>Filter
                                    </button>
                                    <a th:href="@{/inventory/movements}"
                                       class="btn btn-secondary shadow rounded-pill px-4"><i
                                            class="bi bi-x-lg me-1"></i>Clear</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-success border-bottom border-3 shadow-sm mb-4 rounded-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center justify-content-between rounded-top-4">
                    <div class="d-flex align-items-center">
                        <span><i class="bi bi-list-ul me-2"></i>Movement List</span>
                    </div>
                    <span class="small">Total Movements: <strong id="totalMovements">0</strong></span>

                </div>

                <div class="table-responsive">
                    <table id="movementsTable" class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-success">
                        <tr>
                            <th>#</th>
                            <th>Date & Time</th>
                            <th>Item</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Unit Price</th>
                            <th>Reason</th>
                            <th>Notes</th>
                        </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>

<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script>
    $(document).ready(function () {

        var table = $('#movementsTable').DataTable({
            "processing": true,
            "serverSide": true,
            "responsive": true,
            "autoWidth": false,
            "pageLength": 10,

            "ajax": {
                "url": contextPath + "inventory/movements/datatable",
                "type": "GET",
                "data": function (d) {
                    d.itemId = $('#itemId').val();
                    d.movementType = $('#movementType').val();
                },
                "dataSrc": function (json) {
                    $('#totalMovements').text(json.recordsFiltered);
                    return json.data;
                }
            },

            "columns": [
                {
                    "data": null,
                    "orderable": false,
                    "searchable": false,
                    "render": function (data, type, row, meta) {
                        return meta.row + meta.settings._iDisplayStart + 1;
                    }
                },
                {
                    "data": "createdAt",
                    "render": function (data) {
                        if (!data) {
                            return '<span class="text-muted">—</span>';
                        }

                        var date = new Date(data);

                        var day = String(date.getDate()).padStart(2, '0');
                        var month = String(date.getMonth() + 1).padStart(2, '0');
                        var year = date.getFullYear();

                        var hours = String(date.getHours()).padStart(2, '0');
                        var minutes = String(date.getMinutes()).padStart(2, '0');

                        return day + '-' + month + '-' + year
                            + ' ' + hours + ':' + minutes;
                    }
                },
                {
                    "data": "inventoryItem",
                    "render": function (data) {
                        return data && data.name
                            ? '<strong>' + data.name + '</strong>'
                            : '<span class="text-muted">—</span>';
                    }
                },
                {
                    "data": "movementType",
                    "render": function (data) {

                        if (data === "IN") {
                            return '<span class="badge bg-success rounded-pill px-3 py-2">'
                                + '<i class="bi bi-arrow-down-circle me-1"></i>Stock In'
                                + '</span>';
                        }

                        if (data === "OUT") {
                            return '<span class="badge bg-danger rounded-pill px-3 py-2">'
                                + '<i class="bi bi-arrow-up-circle me-1"></i>Stock Out'
                                + '</span>';
                        }

                        if (data === "ADJUSTMENT") {
                            return '<span class="badge bg-warning text-dark rounded-pill px-3 py-2">'
                                + '<i class="bi bi-sliders me-1"></i>Adjustment'
                                + '</span>';
                        }

                        return '<span class="text-muted">—</span>';
                    }
                },
                {
                    "data": "quantity",
                    "render": function (data, type, row) {

                        if (data === null || data === undefined) {
                            return '<span class="text-muted">—</span>';
                        }

                        var quantity = parseFloat(data)
                            .toString();

                        if (row.movementType === "IN") {
                            return '<span class="text-success fw-bold">'
                                + quantity
                                + '</span>';
                        }

                        if (row.movementType === "OUT") {
                            return '<span class="text-danger fw-bold">'
                                + quantity
                                + '</span>';
                        }

                        if (row.movementType === "ADJUSTMENT") {
                            return '<span class="text-warning fw-bold">'
                                + quantity
                                + '</span>';
                        }

                        return quantity;
                    }
                },
                {
                    "data": "inventoryItem",
                    "render": function (data) {

                        if (data && data.unit) {
                            return data.unit.replace(/_/g, ' ');
                        }

                        return '<span class="text-muted">—</span>';
                    }
                },
                {
                    "data": "unitPrice",
                    "render": function (data) {
                        if (data === null || data === undefined) {
                            return '<span class="text-muted">—</span>';
                        }

                        return parseFloat(data).toString();
                    }
                },
                {
                    "data": "reason",
                    "render": function (data) {
                        return data
                            ? data
                            : '<span class="text-muted">—</span>';
                    }
                },
                {
                    "data": "notes",
                    "render": function (data) {
                        return data
                            ? data
                            : '<span class="text-muted">—</span>';
                    }
                }
            ]
        });

        $('form[action$="/inventory/movements"]').on('submit', function (e) {
            e.preventDefault();
            table.ajax.reload();
        });

        $('#itemId, #movementType').on('change', function () {
            table.ajax.reload();
        });
    });
</script>
</body>
</html>
