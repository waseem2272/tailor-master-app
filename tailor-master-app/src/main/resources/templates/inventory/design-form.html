<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${design.id == null ? 'Add Design | Tailor Master' : 'Edit Design | Tailor Master'}">Design | Tailor
        Master</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid"> <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div><h2 class="page-title mb-1"><i class="bi bi-grid-3x3-gap me-2"></i> <span
                        th:text="${design.id == null ? 'Add Design' : 'Edit Design'}"> Add Design </span></h2>
                    <p class="text-muted mb-0"><span
                            th:text="${design.id == null ? 'Add a new design to your inventory master data.' : 'Update the selected inventory design.'}"> Add a new design to your inventory master data. </span>
                    </p></div>
                <a th:href="@{/inventory/designs}" class="btn btn-success rounded-pill shadow-sm px-4"> <i
                        class="bi bi-arrow-left me-1"></i> Back </a></div> <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm"
                 role="alert"><i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div> <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div> <!-- Design Card -->
            <div class="card border-success border-bottom border-3 shadow-sm mb-4 rounded-4">
                <div class="card-header bg-success text-white fw-bold py-3 rounded-top-4"><i
                        class="bi bi-grid-3x3-gap me-2"></i> <span
                        th:text="${design.id == null ? 'Design Information' : 'Edit Design Information'}"> Design Information </span>
                </div>
                <div class="card-body p-4"> <!-- Information -->
                    <div class="alert alert-success d-flex align-items-start mb-4"><i
                            class="bi bi-info-circle-fill me-2 mt-1"></i>
                        <div><strong>Design Master Data</strong>
                            <div class="small mt-1"> Add designs that can be selected when creating or managing
                                inventory items.
                            </div>
                        </div>
                    </div> <!-- Form -->
                    <form th:action="@{/inventory/designs/save}" th:object="${design}" method="post"
                          class="needs-validation" novalidate><input type="hidden" th:field="*{id}">
                        <div class="row g-4"> <!-- Design Name -->
                            <div class="col-md-8"><label for="name" class="form-label fw-semibold"> Design Name <span
                                    class="text-danger">*</span> </label>
                                <div class="input-group"><span class="input-group-text bg-success text-white"> <i
                                        class="bi bi-grid-3x3-gap"></i> </span> <input type="text"
                                                                                       class="form-control rounded-end-pill"
                                                                                       id="name" th:field="*{name}"
                                                                                       placeholder="e.g. Plain, Striped, Check, Embroidered"
                                                                                       maxlength="100" required>
                                    <div class="invalid-feedback"> Please enter a design name.</div>
                                </div>
                            </div>
                        </div> <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top"><a
                                th:href="@{/inventory/designs}" class="btn btn-secondary rounded-pill shadow-sm px-4">
                            <i class="bi bi-x-circle me-1"></i> Cancel </a>
                            <button type="submit" class="btn btn-success rounded-pill shadow-sm px-4"><i
                                    class="bi bi-check-circle me-1"></i> <span
                                    th:text="${design.id == null ? 'Save Design' : 'Update Design'}"> Save Design </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>

<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script> document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector(".needs-validation");
    if (form) {
        form.addEventListener("submit", function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add("was-validated");
        });
    }
}); </script>
</body>
</html>
