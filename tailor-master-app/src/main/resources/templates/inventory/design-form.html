<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${design.id == null ? #messages.msg('designs.addTitle') : #messages.msg('designs.editTitle')}">
        Design | Tailor Master
    </title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<script th:src="@{/js/language-direction.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="page-title mb-1">
                        <i class="bi bi-grid-3x3-gap me-2"></i>
                        <span th:text="${design.id == null ? #messages.msg('designs.addTitle') : #messages.msg('designs.editTitle')}">
                            Add Design
                        </span>
                    </h2>
                    <p class="text-muted mb-0"
                       th:text="${design.id == null ? #messages.msg('designs.addDescription') : #messages.msg('designs.editDescription')}">
                        Add a new design to your inventory master data.
                    </p>
                </div>

                <a th:href="@{/inventory/designs}"
                   class="btn btn-success rounded-pill shadow-sm px-4">
                    <i class="bi bi-arrow-left me-1"></i>
                    <span th:text="#{brands.back}">Back</span>
                </a>
            </div>
            <div class="alert alert-warning border-0 rounded-3 d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-info-circle-fill fs-5"></i>
                <span class="fw-semibold"><span class="text-danger" th:text="#{user.create.requiredFields}"></span></span>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}"
                 class="alert alert-success alert-dismissible fade show shadow-sm"
                 role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible fade show shadow-sm"
                 role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Design Card -->
            <div class="card border-success border-bottom border-3 shadow-sm mb-4 rounded-4">
                <div class="card-header bg-success text-white fw-bold py-3 rounded-top-4">
                    <i class="bi bi-grid-3x3-gap me-2"></i>
                    <span th:text="${design.id == null ? #messages.msg('designs.information') : #messages.msg('designs.editInformation')}">
                        Design Information
                    </span>
                </div>

                <div class="card-body p-4">

                    <!-- Information -->
                    <div class="alert alert-success d-flex align-items-start mb-4">
                        <i class="bi bi-info-circle-fill me-2 mt-1"></i>
                        <div>
                            <strong th:text="#{designs.masterData}">Design Master Data</strong>
                            <div class="small mt-1" th:text="#{designs.formDescription}">
                                Add designs that can be selected when creating or managing inventory items.
                            </div>
                        </div>
                    </div>

                    <!-- Form -->
                    <form id="designForm"
                          th:action="@{/inventory/designs/save}"
                          th:object="${design}"
                          method="post"
                          class="needs-validation"
                          novalidate>

                        <input type="hidden" th:field="*{id}">

                        <div class="row g-4">

                            <!-- Design Name -->
                            <div class="col-md-8">
                                <label for="name" class="form-label fw-semibold">
                                    <span th:text="#{designs.name}">Design Name</span>
                                    <span class="text-danger">*</span>
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text bg-success text-white">
                                        <i class="bi bi-grid-3x3-gap"></i>
                                    </span>

                                    <input type="text"
                                           class="form-control rounded-end-pill"
                                           id="name"
                                           th:field="*{name}"
                                           th:placeholder="#{designs.namePlaceholder}"
                                           maxlength="100"
                                           required>

                                    <div class="invalid-feedback"
                                         th:text="#{designs.nameRequired}">
                                        Please enter a design name.
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-center gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/inventory/designs}"
                               class="btn btn-secondary rounded-pill shadow-sm px-4">
                                <i class="bi bi-x-circle me-1"></i>
                                <span th:text="#{inventory.cancel}">Cancel</span>
                            </a>

                            <button type="submit"
                                    class="btn btn-success rounded-pill shadow-sm px-4">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${design.id == null ? #messages.msg('designs.save') : #messages.msg('designs.update')}">
                                    Save Design
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Confirm Save/Update Modal -->
<div class="modal fade" id="confirmDesignModal" tabindex="-1"
     aria-labelledby="confirmDesignModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="confirmDesignModalLabel">
                    <i class="bi bi-question-circle me-2"></i>
                    <span th:text="${design.id == null ? #messages.msg('brands.confirmSaveTitle') : #messages.msg('brands.confirmUpdateTitle')}">
                        Confirm Design
                    </span>
                </h5>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <span th:text="${design.id == null ? #messages.msg('designs.confirmSaveMessage') : #messages.msg('designs.confirmUpdateMessage')}">
                    Are you sure you want to save this design?
                </span>
            </div>

            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-secondary rounded-pill px-4"
                        data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>
                    <span th:text="#{inventory.cancel}">Cancel</span>
                </button>

                <button type="button" class="btn btn-success rounded-pill px-4"
                        id="confirmDesignSubmit">
                    <i class="bi bi-check-circle me-1"></i>
                    <span th:text="${design.id == null ? #messages.msg('brands.confirmSave') : #messages.msg('brands.confirmUpdate')}">
                        Confirm
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/notification-modal :: notification}"></div>

<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>

<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>

<!--<script th:src="@{/js/dashboard-notifications.js}"></script>-->
<script th:src="@{/js/common.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("designForm");
        const modalElement = document.getElementById("confirmDesignModal");
        const confirmButton = document.getElementById("confirmDesignSubmit");
        const confirmationModal = new bootstrap.Modal(modalElement);

        if (form) {
            form.addEventListener("submit", function (event) {
                event.preventDefault();

                if (!form.checkValidity()) {
                    event.stopPropagation();
                    form.classList.add("was-validated");
                    return;
                }

                form.classList.add("was-validated");
                confirmationModal.show();
            });
        }

        if (confirmButton && form) {
            confirmButton.addEventListener("click", function () {
                confirmButton.disabled = true;
                form.submit();
            });
        }
    });
</script>

</body>
</html>
