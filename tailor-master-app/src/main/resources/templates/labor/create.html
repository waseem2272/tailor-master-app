<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{labor.create.title}">Create Labor</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<script th:src="@{/js/language-direction.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

                <form th:action="@{/labors/save}" th:object="${labor}" method="post" id="laborForm" class="needs-validation" novalidate>
                    <h2 class="page-title d-flex align-items-center mb-4">
                        <i class="bi bi-person-workspace me-2"></i>
                        <span th:text="#{labor.create.title}">Create Labor</span>
                    </h2>

                    <div class="alert alert-warning border-0 rounded-3 d-flex align-items-center gap-2 mb-4" role="alert">
                        <i class="bi bi-info-circle-fill fs-5"></i>
                        <span class="fw-semibold"><span class="text-danger" th:text="#{user.create.requiredFields}"></span></span>
                    </div>

                    <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                        <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                            <i class="bi bi-info-circle me-2"></i>
                            <span th:text="#{labor.create.information}">Labor Information</span>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">

                                <!-- Name -->
                                <div class="col-md-6">
                                    <label for="name" class="form-label">
                                        <i class="bi bi-person me-1"></i>
                                        <span th:text="#{labor.name}">Name</span>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           id="name"
                                           th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           class="form-control"
                                           placeholder="Enter labor name"
                                           th:placeholder="#{labor.create.namePlaceholder}"
                                           required>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('name')}"
                                         th:errors="*{name}">
                                        <span th:text="#{labor.create.invalidName}">Invalid Name.</span>
                                    </div>
                                </div>

                                <!-- Contact -->
                                <div class="col-md-6">
                                    <label for="contact" class="form-label">
                                        <i class="bi bi-telephone me-1"></i> <span th:text="#{labor.contact}">Contact</span>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           id="contact"
                                           th:field="*{contact}"
                                           pattern="^03[0-9]{9}$"
                                           th:classappend="${#fields.hasErrors('contact')} ? 'is-invalid'"
                                           class="form-control"
                                           placeholder="e.g., 03001234567"
                                           th:placeholder="#{labor.create.contactPlaceholder}"
                                           required>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('contact')}"
                                         th:errors="*{contact}">
                                        <span th:text="#{labor.create.invalidContact}">Invalid contact.</span>
                                    </div>
                                </div>

                                <!-- Skills -->
                                <div class="col-md-6">
                                    <label for="skills" class="form-label">
                                        <i class="bi bi-tools me-1"></i> <span th:text="#{labor.create.skills}">Skills</span>
                                    </label>
                                    <input type="text"
                                           id="skills"
                                           th:field="*{skills}"
                                           class="form-control"
                                           placeholder="e.g., Shalwar Kameez, Pant, Coat"
                                           th:placeholder="#{labor.create.skillsPlaceholder}">
                                </div>

                                <!-- Join Date -->
                                <div class="col-md-6">
                                    <label for="joinDate" class="form-label">
                                        <i class="bi bi-calendar-check me-1"></i> <span th:text="#{labor.joinDate}">Join Date</span>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="date"
                                           id="joinDate"
                                           th:field="*{joinDate}"
                                           class="form-control"
                                           required>
                                </div>

                                <!-- Status -->
                                <div class="col-md-6">
                                    <label for="status" class="form-label">
                                        <i class="bi bi-toggle-on me-1"></i> <span th:text="#{labor.create.status}">Status</span>
                                    </label>
                                    <select id="status"
                                            th:field="*{status}"
                                            class="form-select">
                                        <option th:each="s : ${labor.status?.values()}"
                                                th:value="${s}"
                                                th:text="${s}">
                                            Active
                                        </option>
                                    </select>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="button" class="btn btn-success" id="openConfirmationModal">
                            <i class="bi bi-check-circle me-1"></i>
                            <span th:text="#{button.save}">Create</span>
                        </button>
                        <a th:href="@{/labors}" class="btn btn-secondary">
                            <i class="bi bi-x-circle me-1"></i>
                            <span th:text="#{button.cancel}">Cancel</span>
                        </a>
                    </div>
                </form>

        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmationModalLabel" th:text="#{labor.create.confirmTitle}">
                    Confirm Submission
                </h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" th:text="#{labor.create.confirmMessage}">
                Are you sure you want to create this Labor with the provided details?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>
                    <span th:text="#{button.cancel}">Cancel</span></button>
                <button type="button" class="btn btn-success" id="confirmSubmit">
                    <i class="bi bi-check-circle me-1"></i>
                    <span th:text="#{customer.create.confirm.yesSave}">Yes, Submit</span>
                </button>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/create-customer.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const openModalBtn = document.getElementById("openConfirmationModal");
        const confirmBtn = document.getElementById("confirmSubmit");
        const form = document.getElementById("laborForm");

        const confirmationModal = new bootstrap.Modal(document.getElementById('confirmationModal'));

        openModalBtn.addEventListener("click", function () {
            // Trigger HTML5 validation
            if (form.checkValidity()) {
                confirmationModal.show();
            } else {
                form.classList.add('was-validated');
            }
        });

        confirmBtn.addEventListener("click", function () {
            form.submit();
        });
    });

    // Keep your validation script for actual form submission safety
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>

</body>
</html>
