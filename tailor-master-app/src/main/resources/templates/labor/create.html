<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Labor</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <form th:action="@{/labors/save}"
                  th:object="${labor}"
                  method="post"
                  id="laborForm"
                  class="needs-validation"
                  novalidate>

                <h2 class="page-title d-flex align-items-center mb-4">
                    <i class="bi bi-person-workspace me-2"></i>
                    نیا کاریگر بنائیں
                </h2>

                <p class="text-danger fw-bold">
                    * والے خانے لازمی ہیں
                </p>


                <div class="card border-success border-bottom border-3 shadow-sm mb-4">

                    <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                        <i class="bi bi-info-circle me-2"></i>
                        کاریگر کی معلومات
                    </div>

                    <div class="card-body">

                        <div class="row">

                            <!-- Name -->
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">
                                    نام <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                       id="name"
                                       name="name"
                                       th:field="*{name}"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                       class="form-control"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('name')}"
                                     th:errors="*{name}">
                                    نام درست درج کریں۔
                                </div>
                            </div>


                            <!-- Contact -->
                            <div class="col-md-6 mb-3">
                                <label for="contact" class="form-label">
                                    رابطہ نمبر <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                       id="contact"
                                       name="contact"
                                       th:field="*{contact}"
                                       pattern="^03[0-9]{9}$"
                                       th:classappend="${#fields.hasErrors('contact')} ? 'is-invalid'"
                                       class="form-control"
                                       placeholder="مثال: 03001234567"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('contact')}"
                                     th:errors="*{contact}">
                                    رابطہ نمبر درست درج کریں۔
                                </div>
                            </div>


                            <!-- Skills -->
                            <div class="col-md-6 mb-3">
                                <label for="skills" class="form-label">
                                    مہارت
                                </label>

                                <input type="text"
                                       id="skills"
                                       name="skills"
                                       th:field="*{skills}"
                                       class="form-control">
                            </div>


                            <!-- Join Date -->
                            <div class="col-md-6 mb-3">
                                <label for="joinDate" class="form-label">
                                    شمولیت کی تاریخ <span class="text-danger">*</span>
                                </label>

                                <input type="date"
                                       id="joinDate"
                                       name="joinDate"
                                       th:field="*{joinDate}"
                                       class="form-control">
                            </div>


                            <!-- Status -->
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">
                                    حیثیت
                                </label>

                                <select id="status"
                                        name="status"
                                        th:field="*{status}"
                                        class="form-select">

                                    <option th:each="s : ${labor.status?.values()}"
                                            th:value="${s}"
                                            th:text="${s == 'ACTIVE' ? 'فعال' : s == 'INACTIVE' ? 'غیر فعال' : s}">
                                        فعال
                                    </option>

                                </select>
                            </div>

                        </div>

                    </div>
                </div>


                <!-- Buttons -->
                <div class="text-center mt-4">

                    <button type="button"
                            class="btn btn-success"
                            id="openConfirmationModal">
                        <i class="bi bi-check-circle me-1"></i>
                        بنائیں
                    </button>

                    <a th:href="@{/labors}"
                       class="btn btn-secondary">
                        <i class="bi bi-x-circle me-1"></i>
                        واپس جائیں
                    </a>

                </div>

            </form>

        </div>
    </div>
</div>


<!-- Confirmation Modal -->
<div class="modal fade"
     id="confirmationModal"
     tabindex="-1"
     aria-labelledby="confirmationModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content rounded-4 shadow pickup-modal"
             dir="rtl">

            <div class="modal-header bg-success text-white rounded-top-4">

                <h5 class="modal-title"
                    id="confirmationModalLabel">
                    محفوظ کرنے کی تصدیق
                </h5>

                <button type="button"
                        class="btn-close bg-light"
                        data-bs-dismiss="modal"
                        aria-label="بند کریں">
                </button>

            </div>

            <div class="modal-body">
                کیا آپ واقعی دی گئی معلومات کے ساتھ یہ نیا کاریگر بنانا چاہتے ہیں؟
            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-1"></i>
                    واپس جائیں
                </button>

                <button type="button"
                        class="btn btn-success"
                        id="confirmSubmit">
                    <i class="bi bi-check-circle me-1"></i>
                    ہاں، محفوظ کریں
                </button>

            </div>

        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/create-customer.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const openModalBtn = document.getElementById("openConfirmationModal");
        const confirmBtn = document.getElementById("confirmSubmit");
        const form = document.getElementById("laborForm");

        const confirmationModal = new bootstrap.Modal(document.getElementById('confirmationModal'));

        openModalBtn.addEventListener("click", function () {
            // Trigger HTML5 validation
            if (form.checkValidity()) {
                confirmationModal.show();
            } else {
                form.classList.add('was-validated');
            }
        });

        confirmBtn.addEventListener("click", function () {
            form.submit();
        });
    });

    // Keep your validation script for actual form submission safety
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>

</body>
</html>
