<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Order</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .measurement-card {
            transition: opacity 0.3s ease-in-out;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <form th:action="@{/orders/create}" th:object="${orderDto}" method="post">
                <h2 class="text-center">Create Order</h2>

                <!-- Customer Information -->
                <p class="text-danger fw-bold">Fields marked as * are required</p>
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">Customer Information</div>
                    <div class="card-body">
                        <input type="hidden" name="encryptedCustomerId"
                               th:value="${thymeleafUtil.encryptId(customer.id)}">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="fw-bold">Full Name</label>
                                <input type="text" th:value="${customer.fullName}" class="form-control bg-light"
                                       readonly/>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold">Phone Number</label>
                                <input type="text" th:value="${customer.phoneNumber}" class="form-control bg-light"
                                       readonly/>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products Selection -->
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">Products and Descriptions</div>
                    <div class="card-body">
                        <h5>Select Products <span class="text-danger">*</span></h5>

                        <div class="row">
                            <div th:each="product : ${products}" class="col-md-4">
                                <div class="form-check form-switch">
                                    <input type="checkbox" class="form-check-input product-checkbox"
                                           th:value="${product.id}"
                                           th:data-price="${product.price}"
                                           th:id="'product_' + ${product.id}" />
                                    <label class="form-check-label fs-5 fw-bold"
                                           th:for="'product_' + ${product.id}"
                                           th:text="${product.name}"></label>
                                </div>
                            </div>
                        </div>

                        <!-- Display validation error if no product is selected -->
                        <!--<div th:if="${#fields.hasErrors('orderProducts')}" class="text-danger error-message">
                            <span th:errors="*{orderProducts}"></span>
                        </div>-->

                        <!-- Hidden Fields for Backend Validation -->
                        <div id="selectedProductsHiddenContainer">
                            <div th:each="product, iterStat : ${orderDto.orderProducts}">
                                <!-- Hidden Product ID -->
                                <input type="hidden" th:name="'orderProducts[' + ${iterStat.index} + '].id'" th:value="${product.id}">
                                <input type="hidden" th:name="'orderProducts[' + ${iterStat.index} + '].name'" th:value="${product.name}">
                                <input type="hidden" th:name="'orderProducts[' + ${iterStat.index} + '].price'" th:value="${product.price}">
                                <!-- Quantity Field -->
<!--                                <input type="number" class="form-control quantity-input"-->
<!--                                       th:name="'orderProducts[' + ${iterStat.index} + '].quantity'"-->
<!--                                       th:value="${product.quantity}" min="1">-->

                                <!-- Error Message for Quantity -->
                                <div class="text-danger error-message"
                                     th:if="${#fields.hasErrors('orderProducts[' + iterStat.index + '].quantity')}"
                                     th:errors="*{orderProducts[__${iterStat.index}__].quantity}">
                                </div>
                            </div>
                        </div>

                        <!-- Selected Products (Dynamic UI) -->
                        <h5 class="mt-4">Product Details</h5>
                        <div id="selectedProductsContainer" class="row"></div>
                    </div>
                </div>

                <!-- Order Details -->
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">Order Details</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="orderDate" class="fw-bold">Order Date <span
                                        class="text-danger">*</span></label>
                                <input type="date" id="orderDate" name="orderDate" class="form-control"
                                       th:value="${orderDto != null ? #temporals.format(orderDto.orderDate, 'yyyy-MM-dd') : ''}" required />
                                <span class="text-danger error-message" th:if="${#fields.hasErrors('orderDate')}"
                                      th:errors="*{orderDate}"></span>
                            </div>
                            <div class="col-md-6">
                                <label for="deliveryDate" class="fw-bold">Delivery Date <span
                                        class="text-danger">*</span></label>
                                <input type="date" id="deliveryDate" name="deliveryDate" class="form-control"
                                       th:value="${orderDto != null ? #temporals.format(orderDto.deliveryDate, 'yyyy-MM-dd') : ''}" required />
                                <span class="text-danger error-message" th:if="${#fields.hasErrors('deliveryDate')}"
                                      th:errors="*{deliveryDate}"></span>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label for="advancePayment" class="fw-bold">Advance Payment</label>
                                <input type="number" step="0.01" class="form-control" id="advancePayment"
                                       name="advancePayment" value="0">
                            </div>
                            <div class="col-md-6">
                                <label for="duePayment" class="fw-bold">Due Payment <span
                                        class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="duePayment"
                                       name="duePayment"
                                       th:field="*{duePayment}"
                                       readonly>
                                <span class="text-danger error-message" th:if="${#fields.hasErrors('duePayment')}"
                                      th:errors="*{duePayment}"></span>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label for="totalProductAmount" class="fw-bold">Total Product Amount <span
                                        class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="totalProductAmount"
                                       name="totalProductAmount"
                                       th:field="*{totalProductAmount}" readonly />
                                <span class="text-danger error-message" th:if="${#fields.hasErrors('totalProductAmount')}"
                                      th:errors="*{totalProductAmount}"></span>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Buttons -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success">Save Order</button>
                    <a th:href="@{/orders}" class="btn btn-danger">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        let selectedProductsContainer = document.getElementById("selectedProductsContainer");
        let selectedProductsHiddenContainer = document.getElementById("selectedProductsHiddenContainer");
        let advancePaymentInput = document.getElementById("advancePayment");
        let duePaymentInput = document.getElementById("duePayment");
        let totalProductAmountInput = document.getElementById("totalProductAmount");
        let form = document.querySelector("form");

        function updateTotal() {
            let subtotal = 0;
            document.querySelectorAll(".product-subtotal").forEach(subtotalField => {
                subtotal += parseFloat(subtotalField.innerText || 0);
            });

            totalProductAmountInput.value = subtotal.toFixed(2);

            let advancePayment = parseFloat(advancePaymentInput.value || 0);
            duePaymentInput.value = (subtotal - advancePayment).toFixed(2);
        }

        // ✅ Handle advance payment updates
        advancePaymentInput.addEventListener("input", function () {
            let advancePayment = parseFloat(advancePaymentInput.value || 0);

            document.querySelectorAll(".error-message").forEach(el => el.remove());

            if (advancePayment < 0) {
                advancePaymentInput.value = "0";
                showError(advancePaymentInput, "Advance payment cannot be negative.");
            }
            if (advancePayment > parseFloat(duePaymentInput.value || 0)) {
                advancePaymentInput.value = "0";
                showError(advancePaymentInput, "Advance payment cannot be more than due payment.");
            }

            updateTotal();
        });

        // ✅ Handle product checkbox selection (Thymeleaf-generated products)
        document.querySelectorAll(".product-checkbox").forEach((checkbox) => {
            checkbox.addEventListener("change", function () {

                let selectedProducts = document.querySelectorAll(".product-checkbox:checked");

                // ✅ Remove error message if at least one product is selected
                if (selectedProducts.length > 0) {
                    document.querySelectorAll(".error-message").forEach(el => el.remove());
                }

                let productId = this.value;
                let productName = this.nextElementSibling.innerText;
                let productPrice = parseFloat(this.dataset.price || 0);

                let existingProduct = document.getElementById("product_card_" + productId);

                if (this.checked) {
                    if (!existingProduct) {
                        // Create product detail card
                        let productCard = document.createElement("div");
                        productCard.classList.add("col-md-6");
                        productCard.id = "product_card_" + productId;
                        productCard.innerHTML = `
                        <div class="card p-3 border-success shadow-sm">
                            <div class="card-header bg-secondary text-white fw-bold">${productName} Details</div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-6"><strong>Price:</strong> <span class="product-price">${productPrice}</span></div>
                                    <div class="col-6">
                                        <strong>Quantity:</strong>
                                        <input type="number" value="1" class="form-control product-quantity" data-product-id="${productId}">
                                    </div>
                                </div>
                                <div class="row mt-2">
                                    <div class="col-12"><strong>Subtotal:</strong> <span class="product-subtotal">${productPrice.toFixed(2)}</span></div>
                                </div>
                            </div>
                        </div>
                    `;

                        selectedProductsContainer.appendChild(productCard);

                        // Create hidden fields for backend validation
                        let inputProductId = document.createElement("input");
                        inputProductId.type = "hidden";
                        inputProductId.name = `orderProducts[${document.querySelectorAll(".product-checkbox:checked").length - 1}].id`;
                        inputProductId.value = productId;
                        inputProductId.id = `hidden_product_${productId}`;
                        selectedProductsHiddenContainer.appendChild(inputProductId);

                        let inputQuantity = document.createElement("input");
                        inputQuantity.type = "hidden";
                        inputQuantity.name = `orderProducts[${document.querySelectorAll(".product-checkbox:checked").length - 1}].quantity`;
                        inputQuantity.value = "1";
                        inputQuantity.id = `hidden_quantity_${productId}`;
                        selectedProductsHiddenContainer.appendChild(inputQuantity);

                        let inputName = document.createElement("input");
                        inputName.type = "hidden";
                        inputName.name = `orderProducts[${document.querySelectorAll(".product-checkbox:checked").length - 1}].name`;
                        inputName.value = productName;
                        inputName.id = `hidden_name_${productId}`;
                        selectedProductsHiddenContainer.appendChild(inputName);

                        let inputPrice = document.createElement("input");
                        inputPrice.type = "hidden";
                        inputPrice.name = `orderProducts[${document.querySelectorAll(".product-checkbox:checked").length - 1}].price`;
                        inputPrice.value = productPrice;
                        inputPrice.id = `hidden_price_${productId}`;
                        selectedProductsHiddenContainer.appendChild(inputPrice);


                        // Update subtotal on quantity change
                        productCard.querySelector(".product-quantity").addEventListener("input", function () {
                            let quantity = parseInt(this.value || 1);
                            let subtotalField = productCard.querySelector(".product-subtotal");
                            subtotalField.innerText = (productPrice * quantity).toFixed(2);

                            // Update hidden field
                            document.getElementById(`hidden_quantity_${productId}`).value = quantity;
                            updateTotal();
                        });
                        updateTotal();
                    }
                } else {
                    // Remove product details and hidden fields if unchecked
                    if (existingProduct) {
                        existingProduct.remove();
                        document.getElementById(`hidden_product_${productId}`)?.remove();
                        document.getElementById(`hidden_quantity_${productId}`)?.remove();
                        updateTotal();
                    }
                }
            });
        });

        advancePaymentInput.addEventListener("input", updateTotal);

        // ✅ Ensure form validation
        function validateForm(event) {
            let isValid = true;

            document.querySelectorAll(".error-message").forEach(el => el.remove());

            // Ensure at least one product is selected
            // if (document.querySelectorAll(".product-checkbox:checked").length === 0) {
            //     showError(document.querySelector(".product-checkbox").closest(".row"), "Please select at least one product.");
            //     isValid = false;
            // }

            if (!isValid) {
                event.preventDefault();
            }
        }

        function showError(element, message) {
            let errorDiv = document.createElement("div");
            errorDiv.className = "text-danger error-message";
            errorDiv.innerText = message;
            element.appendChild(errorDiv);
        }

        form.addEventListener("submit", validateForm);
    });


</script>



</body>
</html>
