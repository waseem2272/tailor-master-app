<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Order</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .measurement-card {
            transition: opacity 0.3s ease-in-out;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <form th:action="@{/orders/create}" method="post">
                <h2 class="text-center">Create Order</h2>

                <!-- Customer Information -->
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">Customer Information</div>
                    <div class="card-body">
                        <input type="hidden" name="customerId" th:value="${customer.id}">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="fw-bold">Full Name</label>
                                <input type="text" th:field="*{customer.fullName}" class="form-control bg-light"
                                       readonly/>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold">Phone Number</label>
                                <input type="text" th:field="*{customer.phoneNumber}" class="form-control bg-light"
                                       readonly/>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products and Descriptions -->
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">Products and Descriptions</div>
                    <div class="card-body">
                        <h5>Select Products</h5>
                        <div class="row">
                            <div th:each="product : ${products}" class="col-md-4">
                                <div class="form-check form-switch">
                                    <input type="checkbox" class="form-check-input product-checkbox"
                                           th:value="${product.id}"
                                           th:data-price="${product.price}"
                                           th:id="'product_' + ${product.id}"/>
                                    <label class="form-check-label fs-5 fw-bold"
                                           th:for="'product_' + ${product.id}"
                                           th:text="${product.name}"></label>
                                </div>
                            </div>
                        </div>

                        <!-- Selected Products Table -->
                        <h5 class="mt-4">Product Details</h5>
                        <div id="selectedProductsContainer" class="row"></div>
                    </div>
                </div>


                <!-- Order Details -->
                <div class="card mt-3">
                    <div class="card-header bg-success text-white">Order Details</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="fw-bold">Order Date</label>
                                <input type="date" name="orderDate" class="form-control"
                                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold">Delivery Date</label>
                                <input type="date" name="deliveryDate" class="form-control"
                                       th:value="${#temporals.format(#temporals.createNow().plusDays(7), 'yyyy-MM-dd')}"
                                       required/>
                            </div>
                        </div>

                        <!--<div class="row mt-3">
                            <div class="col-md-6">
                                <label for="status">Order Status</label>
                                <select class="form-control" id="status" name="status">
                                    <option value="PENDING">Pending</option>
                                    <option value="IN_PROGRESS">In Progress</option>
                                    <option value="COMPLETED">Completed</option>
                                    <option value="CANCELLED">Cancelled</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="extraCharges">Extra Charges</label>
                                <input type="number" step="0.01" class="form-control" id="extraCharges"
                                       name="extraCharges" value="0">
                            </div>
                        </div>-->

                        <!--<div class="row mt-3">
                            <div class="col-md-12">
                                <label for="extraChargesDesc">Extra Charges Description</label>
                                <textarea class="form-control" id="extraChargesDesc" name="extraChargesDesc"
                                          rows="2"></textarea>
                            </div>
                        </div>-->

                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label for="advancePayment">Advance Payment</label>
                                <input type="number" step="0.01" class="form-control" id="advancePayment"
                                       name="advancePayment" value="0">
                            </div>
                            <div class="col-md-6">
                                <label for="totalPayment">Total Payment</label>
                                <input type="number" step="0.01" class="form-control" id="totalPayment"
                                       name="totalPayment" readonly>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Buttons -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success">Save Order</button>
                    <a href="/orders" class="btn btn-danger">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script>
    /*document.addEventListener("DOMContentLoaded", function () {
        const checkboxes = document.querySelectorAll(".product-checkbox");

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener("change", function () {
                const measurementCard = document.getElementById("measurement_card_" + this.value);

                if (this.checked) {
                    measurementCard.classList.remove("d-none");
                    measurementCard.classList.add("fade-in");
                } else {
                    measurementCard.classList.add("fade-out");
                    setTimeout(() => measurementCard.classList.add("d-none"), 300);
                }
            });
        });
    });*/

    document.addEventListener("DOMContentLoaded", function () {
        let selectedProductsContainer = document.getElementById("selectedProductsContainer");
        // let extraChargesInput = document.getElementById("extraCharges");
        let advancePaymentInput = document.getElementById("advancePayment");
        let totalPaymentInput = document.getElementById("totalPayment");

        function updateTotal() {
            let subtotal = 0;
            document.querySelectorAll(".product-subtotal").forEach(subtotalField => {
                subtotal += parseFloat(subtotalField.innerText || 0);
            });

            let advancePayment = parseFloat(advancePaymentInput.value || 0);
            let total = subtotal - advancePayment; // Removed extraCharges
            totalPaymentInput.value = total.toFixed(2);
        }

        document.querySelectorAll(".product-checkbox").forEach(checkbox => {
            checkbox.addEventListener("change", function () {
                let productId = this.value;
                let productName = this.nextElementSibling.innerText;
                let productPrice = parseFloat(this.dataset.price || 0);

                let existingProduct = document.getElementById("product_card_" + productId);
                let container = document.getElementById("selectedProductsContainer");

                if (this.checked) {
                    if (!existingProduct) {
                        // ✅ Create Product Card
                        let productCard = document.createElement("div");
                        productCard.classList.add("col-md-6");
                        productCard.id = "product_card_" + productId;
                        productCard.innerHTML = `
                    <div class="card p-3 border-success shadow-sm">
                        <div class="card-header bg-secondary text-white fw-bold">${productName} Details</div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6"><strong>Price:</strong> <span class="product-price">${productPrice}</span></div>
                                <div class="col-6">
                                    <strong>Quantity:</strong>
                                    <input type="number" min="1" value="1" class="form-control product-quantity" data-product-id="${productId}">
                                </div>
                            </div>
                            <div class="row mt-2">
                                <div class="col-12"><strong>Subtotal:</strong> $<span class="product-subtotal">${productPrice.toFixed(2)}</span></div>
                            </div>
                        </div>
                    </div>
                `;

                        selectedProductsContainer.appendChild(productCard);

                        // ✅ Create Hidden Inputs for Backend Submission
                        let inputProductId = document.createElement("input");
                        inputProductId.type = "hidden";
                        inputProductId.name = `orderProducts[${productId}].productId`;
                        inputProductId.value = productId;
                        inputProductId.id = `hidden_product_${productId}`;
                        container.appendChild(inputProductId);

                        let inputQuantity = document.createElement("input");
                        inputQuantity.type = "hidden";
                        inputQuantity.name = `orderProducts[${productId}].quantity`;
                        inputQuantity.value = "1"; // Default quantity
                        inputQuantity.id = `hidden_quantity_${productId}`;
                        container.appendChild(inputQuantity);

                        // ✅ Update Subtotal on Quantity Change
                        productCard.querySelector(".product-quantity").addEventListener("input", function () {
                            let quantity = parseInt(this.value || 1);
                            let subtotalField = productCard.querySelector(".product-subtotal");
                            subtotalField.innerText = (productPrice * quantity).toFixed(2);

                            // Update hidden input for quantity
                            document.getElementById(`hidden_quantity_${productId}`).value = quantity;

                            updateTotal();
                        });

                        updateTotal();
                    }
                } else {
                    if (existingProduct) {
                        existingProduct.remove();
                        document.getElementById(`hidden_product_${productId}`)?.remove();
                        document.getElementById(`hidden_quantity_${productId}`)?.remove();
                        updateTotal();
                    }
                }
            });
        });


        // extraChargesInput.addEventListener("input", updateTotal);
        advancePaymentInput.addEventListener("input", updateTotal);
    });


</script>

</body>
</html>
