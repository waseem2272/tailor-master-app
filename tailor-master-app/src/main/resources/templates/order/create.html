<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Order</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .card {
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .section-header {
            background-color: #f8f9fa;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            background-color: #fdfdfd;
        }

        .remove-product {
            float: right;
            cursor: pointer;
            color: #dc3545;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="container">
    <form th:action="@{/orders/create}" method="post">
        <div class="card">
            <h2 class="text-center">Create Order</h2>

            <!-- Customer Information -->
            <div class="mt-4">
                <div class="section-header">Customer Information</div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" th:field="*{customer.fullName}" class="form-control" placeholder="Enter full name" required />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phoneNumber">Phone Number</label>
                            <input type="text" id="phoneNumber" th:field="*{customer.phoneNumber}" class="form-control" placeholder="Enter phone number" required />
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="orderDate">Order Date</label>
                            <input type="date" id="orderDate" name="orderDate" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="deliveryDate">Delivery Date</label>
                            <input type="date" id="deliveryDate" name="deliveryDate" class="form-control" th:value="${#temporals.format(#temporals.createNow().plusDays(7), 'yyyy-MM-dd')}" required />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Product Information -->
            <div class="mt-4">
                <div class="section-header">Products</div>
                <div class="row align-items-end mt-3">
                    <div class="col-md-4">
                        <label for="products" class="form-label">Product</label>
                        <select id="products" class="form-select" name="productId">
                            <option value="">Select Product</option>
                            <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="button" id="addProduct" class="btn btn-primary w-100">Add Product</button>
                    </div>
                </div>
            </div>





            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success">Save Order</button>
                <a href="/orders" class="btn btn-secondary">Cancel</a>
            </div>
        </div>
    </form>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const products = /*[[${products}]]*/ [];
    /*]]>*/
</script>

<script>
    const productTemplate = `
    <div class="product-card">
        <span class="remove-product" onclick="removeProduct(this)">✖ Remove</span>
        <div class="form-group mt-3">
            <label for="product">Product</label>
            <select name="products[][id]" class="form-control product-select">
                <option value="">Select Product</option>
                ${products.map(product => `
                    <option value="${product.id}">${product.name}</option>
                `).join('')}
            </select>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group mt-3">
                    <label for="quantity">Quantity</label>
                    <input type="number" name="products[][quantity]" class="form-control" min="1" required />
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group mt-3">
                    <label for="price">Price</label>
                    <input type="text" name="products[][price]" class="form-control" readonly />
                </div>
            </div>
        </div>
        <!-- Measurements -->
        <div class="row">
            <div class="col-md-6">
                <div class="form-group mt-3">
                    <label for="qameezLength">Qameez Length</label>
                    <input type="text" name="products[][qameezLength]" class="form-control" placeholder="Enter qameez length" />
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group mt-3">
                    <label for="sleeveLength">Sleeve Length</label>
                    <input type="text" name="products[][sleeveLength]" class="form-control" placeholder="Enter sleeve length" />
                </div>
            </div>
        </div>
    </div>`;

    document.getElementById("addProduct").addEventListener("click", function () {
        const container = document.getElementById("productsContainer");
        container.insertAdjacentHTML("beforeend", productTemplate);
    });

    function removeProduct(element) {
        element.closest(".product-card").remove();
    }

</script>
</body>
</html>
