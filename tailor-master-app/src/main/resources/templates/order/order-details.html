<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Details</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        @media (max-width: 768px) {
            .d-flex.flex-wrap {
                flex-direction: column;
                align-items: flex-start;
            }

            .w-auto {
                width: 100% !important;
            }
        }
    </style>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <h2 class="text-center">Order Details</h2>

            <!-- Customer Information -->
            <div class="card mb-3">
                <div class="card-header bg-success text-white">Customer Information</div>
                <div class="card-body">
                    <p><strong>Name:</strong> <span th:text="${order.customer.fullName}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${order.customer.phoneNumber}"></span></p>
                </div>
            </div>

            <!-- Order Details -->
            <div class="card mb-3">
                <div class="card-header bg-success text-white">Order Details</div>
                <div class="card-body">
                    <input type="hidden" id="orderId" th:field="*{order.id}" />
                    <p><strong>Order Date:</strong> <span th:text="${order.orderDate}"></span></p>
                    <p><strong>Delivery Date:</strong> <span th:text="${order.deliveryDate}"></span></p>

                    <div class="row align-items-end">
                        <div class="col-md-6 col-sm-12 d-flex flex-wrap align-items-center gap-2">
                            <label for="orderStatus" class="fw-bold me-2">Order Status</label>

                            <!-- Status Badge (Completed / Cancelled) -->
                            <span th:if="${order.status == T(com.example.tailormaster.entity.OrderStatus).COMPLETED}"
                                  class="badge bg-success" th:text="${order.status}"></span>

                            <span th:if="${order.status == T(com.example.tailormaster.entity.OrderStatus).CANCELLED}"
                                  class="badge bg-danger" th:text="${order.status}"></span>

                            <!-- Dropdown & Cabinet No (Visible only when not Completed or Cancelled) -->
                            <div class="d-flex flex-wrap align-items-center gap-2"
                                 th:if="${order.status != T(com.example.tailormaster.entity.OrderStatus).COMPLETED and
                     order.status != T(com.example.tailormaster.entity.OrderStatus).CANCELLED}">

                                <!-- Status Dropdown -->
                                <select id="orderStatus" name="status" class="form-select w-auto">
                                    <option th:each="status : ${T(com.example.tailormaster.entity.OrderStatus).values()}"
                                            th:value="${status}" th:text="${status}"
                                            th:selected="${order.status == status}">
                                    </option>
                                </select>

                                <!-- Cabinet No Field (Only shown when COMPLETED is selected) -->
                                <input type="text" id="cabinetNo" name="cabinetNo" class="form-control w-auto d-none"
                                       placeholder="Cabinet No" th:value="${order.cabinetNo != null ? order.cabinetNo : ''}"/>

                                <!-- Update Button -->
                                <button type="button" id="updateOrderStatusBtn" class="btn btn-success btn-sm">Update</button>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div id="orderStatusMessage"></div> <!-- Alert will be inserted here -->
                        </div>
                    </div>

                </div>
            </div>

            <!-- Product Details -->
            <div class="card">
                <div class="card-header bg-success text-white">Product Details</div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Total</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item, i : ${order.orderProducts}">
                                <td th:text="${i.count}"></td>
                                <td th:text="${item.product.name}"></td>
                                <td th:text="${item.quantity}"></td>
                                <td th:text="${item.product.price}"></td>
                                <td th:text="${item.quantity * item.product.price}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Generate Receipt Button -->
            <div class="text-center mt-4">
                <a th:href="@{/orders/generate-receipt/{id}(id=${order.id}, type='customer')}" class="btn btn-success">
                    View Customer Receipt
                </a>
                <a th:href="@{/orders/generate-receipt/{id}(id=${order.id}, type='tailor')}" class="btn btn-success">
                    View Tailor Receipt
                </a>
                <a th:href="@{/orders}" class="btn btn-secondary">Back to Order List</a>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>

<script>
    function toggleCabinetField() {
        let selectedStatus = $("#orderStatus").val();
        if (selectedStatus === "COMPLETED") {
            $("#cabinetNo").removeClass("d-none");
        } else {
            $("#cabinetNo").addClass("d-none");
        }
    }

    function updateOrderStatus() {
        var csrfToken = $("meta[name='_csrf']").attr("content");
        var csrfHeader = $("meta[name='_csrf_header']").attr("content");

        let orderId = $("#orderId").val();
        let status = $("#orderStatus").val();
        let cabinetNo = $("#cabinetNo").val();

        $.ajax({
            url: contextPath + "orders/update-order-status",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                orderId: orderId,
                status: status,
                cabinetNo: status === "COMPLETED" ? cabinetNo : null
            }),
            beforeSend: function (xhr) {
                xhr.setRequestHeader(csrfHeader, csrfToken);
            },
            success: function (response) {
                showAlert("success", "Order status updated successfully!");
                setTimeout(() => location.reload(), 5000); // Reload after 5 seconds
            },
            error: function () {
                showAlert("danger", "Error updating order status. Please try again.");
            }
        });
    }

    function showAlert(type, message) {
        let alertHtml = `<div class="alert alert-${type} alert-dismissible fade show mt-2" role="alert">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                     </div>`;
        $("#orderStatusMessage").html(alertHtml);
    }

    // Attach event listeners
    $(function () {
        toggleCabinetField(); // Run on initial load

        $("#orderStatus").change(toggleCabinetField);
        $("#updateOrderStatusBtn").click(updateOrderStatus);
    });
</script>


</body>
</html>
