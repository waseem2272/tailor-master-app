<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{pendingPayments.title}">Pending Payments</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<script th:src="@{/js/language-direction.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title d-flex align-items-center mb-4">
                <i class="bi bi-cash-coin me-2"></i>
                <span th:text="#{pendingPayments.title}">Pending Payments</span>
            </h2>
        </div>

        <!-- Success Alert -->
        <div th:if="${successMessage}" class="row justify-content-center">
            <div class="alert alert-success alert-dismissible fade show shadow-sm rounded-3" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-2 fs-4"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="row justify-content-center">
            <div class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
                    <span th:text="${errorMessage}"></span>
                </div>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <div class="card shadow-sm border-success border-bottom border-3">
            <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                <i class="bi bi-cash-coin me-2"></i>
                <span th:text="#{pendingPayments.list}">Pending Payments List</span>
            </div>
            <div class="card-body">
                <table id="pendingPaymentsTable" class="table table-bordered table-hover table-striped">
                    <thead class="table-success text-dark">
                    <tr>
                        <th th:text="#{orders.table.orderId}">Order ID</th>
                        <th th:text="#{orders.table.customer}">Customer</th>
                        <th th:text="#{orders.table.orderDate}">Order Date</th>
                        <th th:text="#{pendingPayments.pickupDate}">Pickup Date</th>
                        <th th:text="#{orders.create.totalAmount}">Total Amount</th>
                        <th th:text="#{orders.create.advancePayment}">Advance Payment</th>
                        <th th:text="#{pendingPayments.paidAmount}">Paid Amount</th>
                        <th th:text="#{pendingPayments.outstandingDue}">Outstanding Due</th>
                        <th th:text="#{pendingPayments.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${pendingPayments}">
                        <td th:text="${order.orderId}"></td>
                        <td>
                            <span th:text="${order.customer.fullName}"></span> <br>
                            <small class="text-muted" th:text="${order.customer.phoneNumber}"></small>
                        </td>

<!--                        <td th:text="${order.duePayment}"></td>-->
                        <td th:text="${#temporals.format(order.orderDate, 'dd-MMM-yyyy', T(java.util.Locale).ENGLISH)}"></td>
                        <td th:text="${#temporals.format(order.pickupDate, 'dd-MMM-yyyy', T(java.util.Locale).ENGLISH)}"></td>
                        <td class="format-amount" th:text="${order.totalProductAmount}"></td>
                        <td class="format-amount" th:text="${order.advancePayment}"></td>
                        <td class="format-amount" th:text="${order.paidAmount}"></td>
                        <td class="text-danger fw-bold format-amount" th:text="${order.outstandingDueAmount}"></td>
                        <td>
                            <button class="btn btn-success btn-sm pay-btn"
                                    th:data-order-id="${thymeleafUtil.encryptId(order.id)}"
                                    th:data-outstanding-due="${order.outstandingDueAmount}">
                                <i class="bi bi-cash-coin"></i>
                                <span th:text="#{pendingPayments.payNow}">Pay Now</span>
                            </button>

                            <a th:href="@{'/orders/details/' + ${thymeleafUtil.encryptId(order.id)}}"
                               class="btn btn-info btn-sm">
                                <i class="bi bi-eye"></i>
                                <span th:text="#{pendingPayments.details}">Details</span>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="paymentModalLabel"
                    th:text="#{pendingPayments.makePayment}">Make Payment</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="orderId">
                <p>
                    <strong th:text="#{pendingPayments.outstandingDue}">Outstanding Due:</strong>
                    <span id="modalOutstandingDue" class="text-danger fw-bold"></span>
                </p>
                <label for="paymentAmount" class="form-label"
                       th:text="#{pendingPayments.enterAmount}">Enter Payment Amount</label>
                <input type="number" id="paymentAmount" class="form-control" min="1">
                <div id="paymentError" class="text-danger mt-1"></div> <!-- Error message appears here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i>
                    <span th:text="#{pendingPayments.cancel}">Cancel</span>
                </button>

                <button type="button" class="btn btn-success" id="confirmPayment">
                    <i class="bi bi-check-circle"></i>
                    <span th:text="#{pendingPayments.confirmPayment}">Confirm Payment</span>
                </button>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>
<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/sweetalert2.all.min.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script th:inline="javascript">
    const pendingPaymentMessages = {
        invalidAmount: /*[[#{pendingPayments.invalidAmount}]]*/ 'Invalid Amount',
        amountInvalid: /*[[#{pendingPayments.paymentAmountInvalid}]]*/ 'Payment amount must be greater than 0.',
        exceedsDue: /*[[#{pendingPayments.exceedsDueAmount}]]*/ 'Exceeds Due Amount',
        amountExceedsDue: /*[[#{pendingPayments.paymentAmountExceedsDue}]]*/ 'Payment amount cannot be more than outstanding due.',
        paymentFailed: /*[[#{pendingPayments.paymentFailed}]]*/ 'Payment Failed',
        paymentSuccessful: /*[[#{pendingPayments.paymentSuccessful}]]*/ 'Payment Successful',
        processing: /*[[#{pendingPayments.processing}]]*/ 'Processing...',
        somethingWentWrong: /*[[#{pendingPayments.somethingWentWrong}]]*/ 'Something went wrong!',
        paymentCouldNotProcess: /*[[#{pendingPayments.paymentCouldNotProcess}]]*/ 'Payment could not be processed. Please try again.',
        confirmPayment: /*[[#{pendingPayments.confirmPayment}]]*/ 'Confirm Payment'
    };
</script>
<script>
    $(document).ready(function () {
        $('#pendingPaymentsTable').DataTable();
    });

    document.addEventListener("DOMContentLoaded", function () {
        const paymentModal = new bootstrap.Modal(document.getElementById("paymentModal"));

        document.querySelectorAll(".pay-btn").forEach(button => {
            button.addEventListener("click", function () {
                const orderId = this.getAttribute("data-order-id");
                const outstandingDue = parseFloat(this.getAttribute("data-outstanding-due"));

                document.getElementById("orderId").value = orderId;
                document.getElementById("modalOutstandingDue").innerText = outstandingDue.toFixed(2);
                document.getElementById("paymentAmount").value = "";
                document.getElementById("paymentAmount").setAttribute("max", outstandingDue.toFixed(2));
                document.getElementById("paymentAmount").setAttribute("min", 1);
                document.getElementById("paymentError").innerText = ""; // Clear previous errors
                $('#paymentAmount').val(outstandingDue.toFixed(2));

                paymentModal.show();
            });
        });

        document.getElementById("paymentAmount").addEventListener("input", function () {
            const paymentAmount = parseFloat(this.value);
            const outstandingDue = parseFloat(document.getElementById("modalOutstandingDue").innerText);
            const errorElement = document.getElementById("paymentError");

            if (isNaN(paymentAmount) || paymentAmount <= 0) {
                errorElement.innerText = pendingPaymentMessages.amountInvalid;
            } else if (paymentAmount > outstandingDue) {
                errorElement.innerText = pendingPaymentMessages.amountExceedsDue;
            } else {
                errorElement.innerText = ""; // No errors
            }
        });

        document.getElementById("confirmPayment").addEventListener("click", function () {
            const confirmBtn = this;
            const orderId = document.getElementById("orderId").value;
            const paymentAmount = parseFloat(document.getElementById("paymentAmount").value);
            const outstandingDue = parseFloat(document.getElementById("modalOutstandingDue").innerText);
            const errorElement = document.getElementById("paymentError");

            var csrfToken = $("meta[name='_csrf']").attr("content");
            var csrfHeader = $("meta[name='_csrf_header']").attr("content");

            // 🔹 Validation
            if (isNaN(paymentAmount) || paymentAmount <= 0) {
                Swal.fire({
                    icon: "error",
                    title: pendingPaymentMessages.invalidAmount,
                    text: pendingPaymentMessages.amountInvalid,
                });
                return;
            }
            if (paymentAmount > outstandingDue) {
                Swal.fire({
                    icon: "error",
                    title: pendingPaymentMessages.exceedsDue,
                    text: pendingPaymentMessages.amountExceedsDue,
                });
                return;
            }

            // 🔹 Disable button to prevent double click
            confirmBtn.disabled = true;
            confirmBtn.innerText = pendingPaymentMessages.processing;

            // 🔹 AJAX Request
            fetch(contextPath + `orders/pending-payments/pay`, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken  // ✅ Send CSRF token
                },
                body: JSON.stringify({ orderId, paymentAmount })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        Swal.fire({
                            icon: "error",
                            title: pendingPaymentMessages.paymentFailed,
                            text: data.error,
                        });
                    } else {
                        Swal.fire({
                            icon: "success",
                            title: pendingPaymentMessages.paymentSuccessful,
                            text: data.message,
                            timer: 2000,
                            showConfirmButton: false
                        }).then(() => {
                            location.reload(); // Reload page after success
                        });
                    }
                })
                .catch(error => {
                    console.error("Payment Error:", error);
                    Swal.fire({
                        icon: "error",
                        title: pendingPaymentMessages.somethingWentWrong,
                        text: pendingPaymentMessages.paymentCouldNotProcess,
                    });
                    confirmBtn.disabled = false;
                    confirmBtn.innerText = pendingPaymentMessages.confirmPayment;
                });
        });

    });


</script>
</body>
</html>
