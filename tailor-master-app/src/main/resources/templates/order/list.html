<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Details</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Include Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"/>
<div class="container mt-5">
    <h2 class="text-center">Order Details</h2>
    <a th:href="@{/orders/create}" class="btn btn-success mb-3">Create New Order</a>
    <table id="ordersTable" class="table table-bordered">
        <thead>
        <tr>
            <th>#</th>
            <th>Order Type</th>
            <th>Order Date</th>
            <th>Delivery Date</th>
            <th>Price</th>
            <th>Customer</th>
            <th>Assigned Staff</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order, iterStat : ${orders}">
            <td th:text="${iterStat.index + 1}">1</td>
            <td th:text="${order.orderType}">Suit</td>
            <td th:text="${order.orderDate}">2025-01-01</td>
            <td th:text="${order.deliveryDate}">2025-01-10</td>
            <td th:text="${order.price}">100.00</td>
            <td th:text="${order.customer.firstName + ' ' + order.customer.lastName}">John Doe</td>
            <td th:if="${order.user != null}" th:text="${order.user.firstName + ' ' + order.user.lastName}">Jane Smith</td>
            <td th:if="${order.user == null}">Not Assigned</td>
            <td>
                <a th:href="@{'/orders/assign/' + ${order.id}}" class="btn btn-sm btn-primary">Assign</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script>
    $(document).ready(function () {
        $('#ordersTable').DataTable();
    });
</script>
<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
