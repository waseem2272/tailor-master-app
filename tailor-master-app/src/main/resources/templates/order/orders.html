<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .alert {
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>
<body>
<!-- Include Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="text-center">Orders</h2>

            <!-- Success Message Alert with Order Details Link -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <a th:if="${orderId}" th:href="@{'/orders/details/' + ${thymeleafUtil.encryptId(orderId)}}"
                   class="btn btn-light btn-sm ms-2">
                    View Order Details
                </a>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <table id="ordersTable" class="table table-bordered">
                <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Order Date</th>
                    <th>Delivery Date</th>
                    <th>Status</th>
                    <th>Cabinet No</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order, i : ${orders}">
                    <td th:text="${i.count}"></td>
                    <td th:text="${order.orderId}"></td>
                    <td th:text="${order.customer.fullName + ' ' + order.customer.phoneNumber}"></td>
                    <td th:text="${order.orderDate}"></td>
                    <td th:text="${order.deliveryDate}"></td>
                    <td>
    <span th:classappend="${
        order.status == T(com.example.tailormaster.entity.OrderStatus).PENDING ? 'badge bg-secondary' :
        order.status == T(com.example.tailormaster.entity.OrderStatus).IN_PROGRESS ? 'badge bg-primary' :
        order.status == T(com.example.tailormaster.entity.OrderStatus).COMPLETED ? 'badge bg-success' :
        order.status == T(com.example.tailormaster.entity.OrderStatus).CANCELLED ? 'badge bg-danger' : ''
    }"
          th:text="${order.status}">
    </span>
                    </td>

                    <td th:text="${order.cabinetNo}"></td>
                    <td>
                        <a th:href="@{'/orders/details/' + ${thymeleafUtil.encryptId(order.id)}}"
                           class="btn btn-info btn-sm">
                            View Details
                        </a>
                        <!-- Show Edit button only if the order is NOT Completed or Cancelled -->
                        <a th:if="${order.status != T(com.example.tailormaster.entity.OrderStatus).COMPLETED
               and order.status != T(com.example.tailormaster.entity.OrderStatus).CANCELLED}"
                           th:href="@{'/orders/edit/' + ${thymeleafUtil.encryptId(order.id)}}"
                           class="btn btn-sm btn-warning">
                            Edit
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script>
    $(document).ready(function () {
        $('#ordersTable').DataTable();
    });
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
