
<div th:fragment="navbar">
    <div th:if="${trialMessage}" class="bg-warning text-dark py-2">
        <div class="d-flex justify-content-center align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${trialMessage}" class="fw-semibold"></span>
        </div>
    </div>
    <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
        <!--Sidebar Toggle (Topbar)-->
        <!--<button id="toggleSidebarBtn" class="btn btn-link d-md-none rounded-circle me-3">
            <i class="bi bi-list fs-4"></i>
        </button>-->

        <button id="toggleSidebarBtn" class="btn btn-success rounded-circle me-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
            <i class="bi bi-list text-white fs-4"></i>
        </button>

        <!--Topbar Navbar-->
        <ul class="navbar-nav ms-auto">

            <!-- Notification Bell -->
            <li class="nav-item dropdown no-arrow mx-1 position-relative">
                <a class="nav-link dropdown-toggle no-arrow-dropdown" href="#" id="notificationsDropdown"
                   role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i class="bi bi-bell-fill fa-fw"></i>
                    <span class="badge badge-danger badge-counter" id="notificationCount">0</span>
                </a>
                <div class="dropdown-list dropdown-menu dropdown-menu-end shadow animated--grow-in"
                     aria-labelledby="notificationsDropdown" id="notificationDropdownList">
                    <div id="notificationList" class="p-0"></div>
                </div>
            </li>


            <!-- Divider -->
            <div class="topbar-divider d-none d-sm-block"></div>

            <!--User Information-->
            <li class="nav-item dropdown no-arrow">
                <span class="me-2 d-none d-lg-inline fw-bold text-dark"
                      style="font-size: 1rem; font-family: 'Noto Nastaliq Urdu', serif;"
                      th:text="'خوش آمدید، ' + ${#authentication.name}"></span>
            </li>
        </ul>
    </nav>
</div>
