<div th:fragment="navbar">
    <div th:if="${trialMessage}" class="trial-banner">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${trialMessage}"></span>
    </div>

    <nav class="navbar navbar-expand navbar-light bg-white topbar shadow-sm px-3">
        <button id="toggleSidebarBtn"
                type="button"
                class="sidebar-toggle-btn btn btn-success rounded-circle d-flex align-items-center justify-content-center shadow-sm">
            <i class="bi bi-list text-white fs-4"></i>
        </button>

        <ul class="navbar-nav ms-auto align-items-center">


            <li class="nav-item mx-2">
                <form method="get" class="d-flex align-items-center">
                    <select name="lang"
                            class="form-select form-select-sm"
                            aria-label="Select language"
                            onchange="this.form.submit()">
                        <option value="en"
                                th:selected="${#locale.language == 'en'}">
                            English
                        </option>
                        <option value="ur"
                                th:selected="${#locale.language == 'ur'}">
                            اردو
                        </option>
                    </select>
                </form>
            </li>

            <li class="nav-item dropdown mx-2 position-relative">
                <a class="nav-link position-relative p-2" href="#" id="notificationsDropdown"
                   role="button" data-bs-toggle="dropdown" aria-expanded="false" title="Notifications">
                    <i class="bi bi-bell-fill fs-5 text-secondary"></i>
                    <span id="notificationCount" class="notification-count">0</span>
                </a>

                <div class="dropdown-menu dropdown-menu-end notification-dropdown shadow border-0 rounded-3 p-0"
                     aria-labelledby="notificationsDropdown" id="notificationDropdownList">
                    <div id="notificationList"></div>
                </div>
            </li>

            <li class="nav-item d-none d-sm-block">
                <div class="vr mx-2 text-muted"></div>
            </li>

            <li class="nav-item">
                <span class="d-flex align-items-center fw-semibold text-dark">
                    <i class="bi bi-person-circle text-success fs-5 me-2"></i>
                    <span>
                        Welcome, <span th:text="${fullName}"></span>
                    </span>
                </span>
            </li>
        </ul>
    </nav>
</div>
