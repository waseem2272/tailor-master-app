<div th:fragment="navbar">
    <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
        <!--Sidebar Toggle (Topbar)-->
        <button id="toggleSidebarBtn" class="btn btn-link d-md-none rounded-circle me-3">
            <i class="bi bi-list fs-4"></i>
        </button>


        <!--Topbar Navbar-->
        <ul class="navbar-nav ms-auto">
            <!--Notification Icon-->
            <li class="nav-item">
                <a class="nav-link" th:href="@{#}">
                    <i class="bi bi-bell-fill"></i>
                </a>
            </li>

            <!--User Information-->
            <li class="nav-item dropdown no-arrow">
                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <span class="me-2 d-none d-lg-inline text-gray-600 small" th:text="${#authentication.name}"></span>
                    <i class="bi bi-person-circle"></i>
                </a>
                <!--Dropdown Menu-->
                <div class="dropdown-menu dropdown-menu-end shadow animated grow-in" aria-labelledby="userDropdown">
                    <a class="dropdown-item" th:href="@{/users/profile}">
                        <i class="bi bi-person-fill text-gray-400"></i> Profile
                    </a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right text-gray-400"></i> Logout
                    </a>
