<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="sidebar">
    <div class="sidebar" id="sidebar">

        <!-- Logo -->
        <div class="sidebar-brand py-3 px-2 mb-3">
            <img th:src="@{/images/jinan-tailor-sidebar-logo.png}"
                 alt="Logo"
                 style="max-height: 90px;">
        </div>

        <div class="mx-3 mb-3"
             style="height: 1px; background: linear-gradient(to right, #ffffff, #ffffff);">
        </div>

        <!-- Dashboard -->
        <a th:href="@{/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="bi bi-speedometer2 me-2"></i>
            Dashboard
        </a>

        <!-- Products -->
        <a th:href="@{/products}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'products'} ? 'active'">
            <i class="bi bi-box-seam me-2"></i>
            Products
        </a>

        <!-- Customers -->
        <a th:href="@{/customers}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'customers'} ? 'active'">
            <i class="bi bi-people me-2"></i>
            Customers
        </a>

        <!-- Orders -->
        <a th:href="@{/orders}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders'} ? 'active'">
            <i class="bi bi-bag-check me-2"></i>
            Orders
        </a>

        <!-- Pending Payments -->
        <a th:href="@{/orders/pending-payments}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders/pending-payments'} ? 'active'">
            <i class="bi bi-cash-stack me-2"></i>
            Pending Payments
        </a>

        <!-- Inventory -->
        <!-- Inventory -->
        <a href="#inventory-submenu"
           data-bs-toggle="collapse"
           role="button"
           aria-expanded="false"
           aria-controls="inventory-submenu"
           sec:authorize="hasRole('ROLE_ADMIN')">

            <i class="bi bi-boxes me-2"></i>
            Inventory

            <i class="bi bi-chevron-down float-end"></i>
        </a>

        <!-- Inventory Submenu -->
        <div id="inventory-submenu"
             class="collapse"
             th:classappend="${activePage != null and activePage.startsWith('inventory')} ? ' show' : ''"
             sec:authorize="hasRole('ROLE_ADMIN')">

            <a th:href="@{/inventory}">
                <i class="bi bi-list-ul me-2"></i>
                Inventory List
            </a>

            <a th:href="@{/inventory/add}">
                <i class="bi bi-plus-circle me-2"></i>
                Add Item
            </a>

            <a th:href="@{/inventory/stock-in}">
                <i class="bi bi-box-arrow-in-down me-2"></i>
                Stock In
            </a>

            <a th:href="@{/inventory/stock-out}">
                <i class="bi bi-box-arrow-up me-2"></i>
                Stock Out
            </a>

            <a th:href="@{/inventory/stock-adjustment}">
                <i class="bi bi-arrow-repeat me-2"></i>
                Stock Adjustment
            </a>

            <a th:href="@{/inventory/movements}">
                <i class="bi bi-clock-history me-2"></i>
                Stock History
            </a>

        </div>

        <!-- Labour Management -->
        <a th:href="@{/labors}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'labors'} ? 'active'">
            <i class="bi bi-person-workspace me-2"></i>
            Labour Management
        </a>

        <!-- Profile -->
        <a th:href="@{/users/profile}"
           th:classappend="${activePage == 'profile'} ? 'active'"
           class="nav-link">
            <i class="bi bi-person-circle me-2"></i>
            My Profile
        </a>

        <!-- Logout -->
        <a th:href="@{/logout}" class="nav-link">
            <i class="bi bi-box-arrow-right me-2"></i>
            Logout
        </a>

    </div>
</div>

<script>
    function toggleInventoryMenu() {

        const submenu = document.getElementById("inventory-submenu");
        const arrow = document.getElementById("inventory-toggle-arrow");

        if (!submenu) {
            return;
        }

        if (submenu.classList.contains("show")) {

            submenu.classList.remove("show");

            if (arrow) {
                arrow.classList.remove("bi-chevron-up");
                arrow.classList.add("bi-chevron-down");
            }

        } else {

            submenu.classList.add("show");

            if (arrow) {
                arrow.classList.remove("bi-chevron-down");
                arrow.classList.add("bi-chevron-up");
            }
        }
    }
</script>

</html>
