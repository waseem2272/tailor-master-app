
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="sidebar">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand py-3 px-2 mb-3"></div>
        <div class="sidebar-divider mx-3 mb-3"></div>

        <a th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="bi bi-speedometer2 me-2"></i><span th:text="#{nav.dashboard}">Dashboard</span>
        </a>

        <a th:href="@{/products}" sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'products'} ? ' active'">
            <i class="bi bi-box-seam me-2"></i><span th:text="#{nav.products}">Products</span>
        </a>

        <a th:href="@{/customers}" sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'customers'} ? ' active'">
            <i class="bi bi-people me-2"></i><span th:text="#{nav.customers}">Customers</span>
        </a>

        <a th:href="@{/orders}" sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders'} ? ' active'">
            <i class="bi bi-bag-check me-2"></i><span th:text="#{nav.orders}">Orders</span>
        </a>

        <a th:href="@{/orders/pending-payments}" sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders/pending-payments'} ? ' active'">
            <i class="bi bi-cash-stack me-2"></i><span th:text="#{nav.pendingPayments}">Pending Payments</span>
        </a>

        <a id="inventory-toggle" href="#inventory-submenu" data-bs-toggle="collapse" role="button"
           th:aria-expanded="${activePage != null and activePage.startsWith('inventory')}"
           aria-controls="inventory-submenu" sec:authorize="hasRole('ROLE_ADMIN')">
            <i class="bi bi-boxes me-2"></i><span th:text="#{nav.inventory}">Inventory</span>
            <i id="inventory-toggle-arrow" class="inventory-arrow bi bi-chevron-down float-end"></i>
        </a>

        <div id="inventory-submenu" class="collapse"
             th:classappend="${activePage != null and activePage.startsWith('inventory')} ? ' show'"
             sec:authorize="hasRole('ROLE_ADMIN')">

            <a th:href="@{/inventory}" th:classappend="${activePage == 'inventory'} ? ' active'">
                <i class="bi bi-list-ul me-2"></i><span th:text="#{nav.inventoryList}">Inventory List</span>
            </a>
            <a th:href="@{/inventory/add}" th:classappend="${activePage == 'inventory/add'} ? ' active'">
                <i class="bi bi-plus-circle me-2"></i><span th:text="#{nav.addItem}">Add Item</span>
            </a>
            <a th:href="@{/inventory/stock-in}" th:classappend="${activePage == 'inventory/stock-in'} ? ' active'">
                <i class="bi bi-box-arrow-in-down me-2"></i><span th:text="#{nav.stockIn}">Stock In</span>
            </a>
            <a th:href="@{/inventory/stock-out}" th:classappend="${activePage == 'inventory/stock-out'} ? ' active'">
                <i class="bi bi-box-arrow-up me-2"></i><span th:text="#{nav.stockOut}">Stock Out</span>
            </a>
            <a th:href="@{/inventory/stock-adjustment}"
               th:classappend="${activePage == 'inventory/stock-adjustment'} ? ' active'">
                <i class="bi bi-arrow-repeat me-2"></i><span th:text="#{nav.stockAdjustment}">Stock Adjustment</span>
            </a>
            <a th:href="@{/inventory/movements}" th:classappend="${activePage == 'inventory/movements'} ? ' active'">
                <i class="bi bi-clock-history me-2"></i><span th:text="#{nav.stockHistory}">Stock History</span>
            </a>
            <a th:href="@{/inventory/brands}" th:classappend="${activePage == 'inventory/brands'} ? ' active'">
                <i class="bi bi-tags me-2"></i><span th:text="#{nav.brands}">Brands</span>
            </a>
            <a th:href="@{/inventory/categories}" th:classappend="${activePage == 'inventory/categories'} ? ' active'">
                <i class="bi bi-diagram-3 me-2"></i><span th:text="#{nav.categories}">Categories</span>
            </a>
            <a th:href="@{/inventory/colors}" th:classappend="${activePage == 'inventory/colors'} ? ' active'">
                <i class="bi bi-palette me-2"></i><span th:text="#{nav.colors}">Colors</span>
            </a>
            <a th:href="@{/inventory/designs}" th:classappend="${activePage == 'inventory/designs'} ? ' active'">
                <i class="bi bi-grid-3x3-gap me-2"></i><span th:text="#{nav.designs}">Designs</span>
            </a>
        </div>

        <a th:href="@{/labors}" sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'labors'} ? ' active'">
            <i class="bi bi-person-workspace me-2"></i><span th:text="#{nav.labour}">Labour Management</span>
        </a>

        <a th:href="@{/users/profile}" th:classappend="${activePage == 'profile'} ? ' active'">
            <i class="bi bi-person-circle me-2"></i><span th:text="#{nav.profile}">My Profile</span>
        </a>

        <a id="backup-toggle" href="#backup-submenu" data-bs-toggle="collapse" role="button"
           th:aria-expanded="${activePage != null and activePage.startsWith('backup')}"
           aria-controls="backup-submenu" sec:authorize="hasRole('ROLE_ADMIN')">
            <i class="bi bi-cloud-arrow-up me-2"></i><span th:text="#{nav.backup}">Backup</span>
            <i id="backup-toggle-arrow" class="backup-arrow bi bi-chevron-down float-end"></i>
        </a>

        <div id="backup-submenu" class="collapse"
             th:classappend="${activePage != null and activePage.startsWith('backup')} ? ' show'"
             sec:authorize="hasRole('ROLE_ADMIN')">

            <a th:href="@{/backup/settings}"
               th:classappend="${activePage == 'backup/settings'} ? ' active'">
                <i class="bi bi-gear me-2"></i><span th:text="#{nav.backupSettings}">Backup Settings</span>
            </a>

            <a th:href="@{/backup/history}"
               th:classappend="${activePage == 'backup/history'} ? ' active'">
                <i class="bi bi-clock-history me-2"></i><span th:text="#{nav.backupHistory}">Backup History</span>
            </a>
        </div>

        <a th:href="@{/logout}">
            <i class="bi bi-box-arrow-right me-2"></i><span th:text="#{nav.logout}">Logout</span>
        </a>
    </div>
</div>
</html>
