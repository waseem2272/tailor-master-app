<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="sidebar">
    <div class="sidebar" id="sidebar">
        <h4 class="text-center py-3">Ghazi Tailors</h4>
        <a th:href="@{/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>

        <a th:href="@{/users/profile}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'profile'} ? 'active'">
            <i class="bi bi-person-circle me-2"></i> My Profile
        </a>

        <a th:href="@{/products}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'products'} ? 'active'">
            <i class="bi bi-box-seam me-2"></i> Products
        </a>

        <a th:href="@{/customers}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'customers'} ? 'active'">
            <i class="bi bi-people me-2"></i> Customers
        </a>

        <a th:href="@{/orders}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders'} ? 'active'">
            <i class="bi bi-card-checklist me-2"></i> Orders
        </a>

        <a th:href="@{/logout}" class="text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>

    </div>

    <button class="hamburger-btn" id="toggleSidebarBtn">
        <i class="bi bi-list fs-3"></i>
    </button>
</div>
</html>
