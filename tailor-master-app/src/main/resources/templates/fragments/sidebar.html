<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="sidebar">
    <div class="sidebar" id="sidebar">
        <h4 class="text-center py-3">Ghazi Tailors</h4>
        <a th:href="@{/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>

        <!--<a th:href="@{/users/profile}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'profile'} ? 'active'">
            <i class="bi bi-person-circle me-2"></i> My Profile
        </a>-->

        <a th:href="@{/products}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'products'} ? 'active'">
            <i class="bi bi-box-seam me-2"></i> Products
        </a>

        <a th:href="@{/customers}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'customers'} ? 'active'">
            <i class="bi bi-people me-2"></i> Customers
        </a>

        <a th:href="@{/orders}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders'} ? 'active'">
            <i class="bi bi-bag-check me-2"></i> Orders
        </a>

        <a th:href="@{/orders/pending-payments}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders/pending-payments'} ? 'active'">
            <i class="bi bi-cash-coin me-2"></i> Pending Payments
        </a>

        <!--<a th:href="@{/logout}" class="text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>-->
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const ordersLink = document.getElementById("orders-toggle");
        const ordersSubmenu = document.getElementById("orders-submenu");
        const ordersToggleArrow = document.getElementById("orders-toggle-arrow");

        if (ordersLink && ordersSubmenu && ordersToggleArrow) {
            ordersLink.addEventListener("click", function (event) {
                event.preventDefault();
                const isExpanded = ordersSubmenu.classList.contains("show");

                // Toggle Bootstrap collapse
                ordersSubmenu.classList.toggle("show");

                // Change arrow direction
                if (isExpanded) {
                    ordersToggleArrow.classList.remove("bi-chevron-up");
                    ordersToggleArrow.classList.add("bi-chevron-down");
                } else {
                    ordersToggleArrow.classList.remove("bi-chevron-down");
                    ordersToggleArrow.classList.add("bi-chevron-up");
                }
            });
        }
    });

</script>

</html>
