<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="sidebar">
    <div class="sidebar" id="sidebar">
        <h4 class="text-center py-3">Ghazi Tailors</h4>
        <a th:href="@{/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>

        <a th:href="@{/users/profile}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'profile'} ? 'active'">
            <i class="bi bi-person-circle me-2"></i> My Profile
        </a>

        <a th:href="@{/products}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'products'} ? 'active'">
            <i class="bi bi-box-seam me-2"></i> Products
        </a>

        <a th:href="@{/customers}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'customers'} ? 'active'">
            <i class="bi bi-people me-2"></i> Customers
        </a>

        <!--<a th:href="@{/orders}"
           sec:authorize="hasRole('ROLE_ADMIN')"
           th:classappend="${activePage == 'orders'} ? 'active'">
            <i class="bi bi-card-checklist me-2"></i> Orders
        </a>-->

        <div class="nav-item" th:classappend="${activePage.startsWith('orders')} ? 'active show'">
            <a class="nav-link d-flex align-items-center" href="#" data-bs-toggle="collapse"
               data-bs-target="#orders-submenu"
               aria-expanded="${activePage.startsWith('orders')} ? 'true' : 'false'">
                <i class="bi bi-card-checklist me-2"></i> Orders
                <i class="bi bi-chevron-down ms-auto" id="orders-toggle-arrow"
                   th:classappend="${activePage.startsWith('orders')} ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
            </a>
            <div class="collapse" id="orders-submenu" th:classappend="${activePage.startsWith('orders')} ? 'show'">
                <ul class="nav flex-column sub-menu ps-4"> <!-- Added left padding -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/orders}"
                           th:classappend="${activePage == 'orders'} ? 'active'">
                            <i class="bi bi-list-ul me-2"></i> All Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/orders/pending-payments}"
                           th:classappend="${activePage == 'orders/pending-payments'} ? 'active'">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> Pending Payments
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <a th:href="@{/logout}" class="text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>
    </div>

    <button class="hamburger-btn" id="toggleSidebarBtn">
        <i class="bi bi-list fs-3"></i>
    </button>
</div>

<style>
    /*.sub-menu {*/
    /*    padding-left: 20px; !* Adjust left padding *!*/
    /*}*/

    .sub-menu .nav-link {
        padding-left: 25px; /* Align links properly */
    }

</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const ordersLink = document.querySelector('.sidebar a[href="#orders-submenu"]');
        const ordersSubmenu = document.getElementById('orders-submenu');
        const ordersToggleArrow = document.getElementById('orders-toggle-arrow');
        const ordersNavItem = ordersLink.parentNode;

        if (ordersLink && ordersSubmenu && ordersToggleArrow && ordersNavItem) {
            ordersLink.addEventListener('click', function(event) {
                event.preventDefault();
                ordersSubmenu.classList.toggle('show');
                ordersToggleArrow.classList.toggle('bi-chevron-down');
                ordersToggleArrow.classList.toggle('bi-chevron-right');
            });

            // Keep submenu open if an item inside is active on page load
            const activeSubmenuItem = ordersSubmenu.querySelector('.nav-link.active');
            if (activeSubmenuItem) {
                ordersSubmenu.classList.add('show');
                ordersToggleArrow.classList.remove('bi-chevron-down');
                ordersToggleArrow.classList.add('bi-chevron-right');
                ordersNavItem.classList.add('active');
                ordersNavItem.classList.add('show');
            }
        }
    });
</script>

</html>
