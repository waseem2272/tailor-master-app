<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Customer</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
    <style>
        .wizard-nav .nav-link.active {
            font-weight: 700;
        }

        .required::after {
            content: " *";
            color: #dc3545;
        }

        .is-invalid + .invalid-feedback {
            display: block;
        }

        .sticky-actions {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 12px 0;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <form th:action="${isEdit} ? @{/customers/{id}/edit(id=${customerId})} : @{/customers/create}"
                  th:object="${form}" method="post" id="customerWizardForm" novalidate>

                <h2 class="page-title d-flex align-items-center mb-4">
                    <i class="bi" th:classappend="${isEdit} ? 'bi-pencil-square' : 'bi-person-fill-add'"></i>
                    <span th:text="${isEdit} ? 'Edit Customer' : 'Create Customer'"></span>
                </h2>

                <ul class="nav nav-tabs wizard-nav mb-3" id="wizardTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#step1" type="button"
                                role="tab">Customer Info
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#step2" type="button" role="tab">
                            Product Selection
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#step3" type="button" role="tab">
                            Measurements
                        </button>
                    </li>
                </ul>

                <div class="tab-content">

                    <!-- STEP 1: Customer Info -->
                    <div class="tab-pane fade show active" id="step1" role="tabpanel">
                        <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                            <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                                <i class="bi bi-info-circle me-2"></i> Customer Information
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label required" for="fullName">Full Name</label>
                                        <input th:field="*{fullName}" id="fullName" class="form-control" required>
                                        <div class="invalid-feedback">Full name is required.</div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label required" for="phoneNumber">Phone Number</label>
                                        <input th:field="*{phoneNumber}" id="phoneNumber" class="form-control" required pattern="^03\d{9}$">
                                        <div class="invalid-feedback">
                                            Phone number must start with 03 and be 11 digits (e.g., 03001234567).
                                        </div>
                                    </div>
                                    <div class="col-md-6 form-check mt-2">
                                        <input class="form-check-input" type="checkbox" th:field="*{enabled}"
                                               id="enabled">
                                        <label class="form-check-label" for="enabled">Enabled</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/customers}" class="btn btn-secondary shadow rounded-pill px-4">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                            <button type="button" id="toStep2" class="btn btn-success">
                                Next <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- STEP 2: Product Selection -->
                    <div class="tab-pane fade" id="step2" role="tabpanel">
                        <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                            <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                                <i class="bi bi-bag-check me-2"></i> Select Products
                            </div>
                            <div class="card-body">
                                <div class="row" id="productsGrid">
                                    <div class="col-md-4 mb-2" th:each="p : ${products}">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input product-checkbox"
                                                   type="checkbox"
                                                   th:value="${p.id}"
                                                   th:data-name="${p.name}"
                                                   th:field="*{selectedProductIds}"
                                                   th:id="${'product_'+p.id}">
                                            <label class="form-check-label fw-bold" th:for="${'product_'+p.id}"
                                                   th:text="${p.name}"></label>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-danger small d-none" id="productError">Please select at least one
                                    product.
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/customers}" class="btn btn-secondary shadow rounded-pill px-4">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                            <button type="button" class="btn btn-secondary" id="backToStep1" data-bs-target="#step1"
                                    data-bs-toggle="tab">
                                <i class="bi bi-arrow-left"></i> Back
                            </button>
                            <button type="button" id="toStep3" class="btn btn-success">
                                Next <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- STEP 3: Measurements -->
                    <div class="tab-pane fade" id="step3" role="tabpanel">
                        <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                            <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                                <i class="bi bi-rulers me-2"></i> Measurements
                            </div>
                            <div class="card-body">
                                <div id="measurementsContainer">
                                    <!-- JS will inject per-product field groups here -->
                                </div>
                            </div>
                        </div>

                        <div class="sticky-actions d-flex justify-content-between">
                            <a th:href="@{/customers}" class="btn btn-secondary shadow rounded-pill px-4">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                            <button type="button" class="btn btn-secondary" id="backToStep2" data-bs-target="#step2"
                                    data-bs-toggle="tab">
                                <i class="bi bi-arrow-left"></i> Back
                            </button>
                            <button type="button" class="btn btn-success" id="openConfirmationModal">
                                <i class="bi bi-check-circle me-1"></i> Save Customer
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Confirm Modal -->
                <div class="modal fade" id="confirmationModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content rounded-4 shadow">
                            <div class="modal-header bg-success text-white rounded-top-4">
                                <h5 class="modal-title">Confirm Submission</h5>
                                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                            </div>
                            <div class="modal-body" th:text="${isEdit} ?
        'Are you sure you want to update this customer?' :
        'Are you sure you want to create this customer with the provided details?'">
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="bi bi-x-circle me-1"></i> Cancel
                                </button>
                                <button type="submit" class="btn btn-success" id="confirmSubmit"
                                        th:text="${isEdit} ? 'Yes, Update' : 'Yes, Submit'"></button>
                            </div>
                        </div>
                    </div>
                </div>

            </form>

        </div>
    </div>
</div>

<div th:replace="~{fragments/notification-modal :: notification}"></div>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<!--<script th:src="@{/js/create-customer.js}"></script>-->
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
    var formMeasurements = [[${form.measurements}]];
</script>
<script>

    document.addEventListener("DOMContentLoaded", function () {

        // --- Customer Info validation function ---
        function validateCustomerInfo() {
            const name = document.getElementById('fullName');
            const phone = document.getElementById('phoneNumber');

            let ok = true;

            // Full Name validation
            if (!name.value.trim()) {
                name.classList.add('is-invalid');
                ok = false;
            } else {
                name.classList.remove('is-invalid');
            }

            // Phone Number validation (must start with 03 and be 11 digits)
            const phoneRegex = /^03\d{9}$/;
            if (!phone.value.trim() || !phoneRegex.test(phone.value)) {
                phone.classList.add('is-invalid');
                phone.nextElementSibling.textContent = "Enter a valid phone number (e.g., 03001234567).";
                ok = false;
            } else {
                phone.classList.remove('is-invalid');
                phone.nextElementSibling.textContent = "Phone number is required."; // reset message
            }

            return ok;
        }

        // --- Step navigation validations ---
        document.getElementById('toStep2').addEventListener('click', function () {
            if (validateCustomerInfo()) {
                new bootstrap.Tab(document.querySelector('[data-bs-target="#step2"]')).show();
            }
        });

        // --- Back button (Step 2 -> Step 1) ---
        document.getElementById('backToStep1').addEventListener('click', function () {
            new bootstrap.Tab(document.querySelector('[data-bs-target="#step1"]')).show();
        });

        document.getElementById('toStep3').addEventListener('click', function () {
            // ✅ validate customer again here (in case tailor skipped step 1)
            if (!validateCustomerInfo()) {
                new bootstrap.Tab(document.querySelector('[data-bs-target="#step1"]')).show();
                return;
            }

            const anyChecked = Array.from(document.querySelectorAll('.product-checkbox')).some(cb => cb.checked);
            const err = document.getElementById('productError');
            if (!anyChecked) {
                err.classList.remove('d-none');
                return;
            }
            err.classList.add('d-none');
            buildMeasurementsUI().then(() => {
                new bootstrap.Tab(document.querySelector('[data-bs-target="#step3"]')).show();
            });
        });

        // --- Back button (Step 3 -> Step 2) ---
        document.getElementById('backToStep2').addEventListener('click', function () {
            new bootstrap.Tab(document.querySelector('[data-bs-target="#step2"]')).show();
        });

        // Confirmation (before save)
        document.getElementById('openConfirmationModal').addEventListener('click', function () {
            // ✅ Final guard: ensure customer info is valid before confirming
            if (!validateCustomerInfo()) {
                new bootstrap.Tab(document.querySelector('[data-bs-target="#step1"]')).show();
                return;
            }

            new bootstrap.Modal(document.getElementById('confirmationModal')).show();
        });

        // --- Build dynamic measurements for selected products ---
        async function fetchFields(productId) {
            const res = await fetch(`${contextPath}customers/${productId}/fields`);
            return await res.json();
        }

        async function buildMeasurementsUI() {
            const container = document.getElementById('measurementsContainer');
            container.innerHTML = '';

            const selected = Array.from(document.querySelectorAll('.product-checkbox'))
                .filter(cb => cb.checked)
                .map(cb => ({
                    id: parseInt(cb.value, 10),
                    name: cb.dataset.name
                }));

            for (const product of selected) {
                const fields = await fetchFields(product.id);

                // Card wrapper
                const card = document.createElement('div');
                card.className = 'card shadow-sm mb-4 border-0 rounded-3';

                // Card header (same as details)
                card.innerHTML = `
            <div class="card-header bg-success text-white fw-bold">
                <i class="bi bi-box-seam me-2"></i> ${product.name}
            </div>
        `;

                // Table for fields
                const table = document.createElement('table');
                table.className = 'table table-bordered table-hover mb-0 align-middle';
                table.innerHTML = `
            <thead class="table-success text-dark">
                <tr>
                    <th>Measurement Field</th>
                    <th class="text-center">Value</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;

                const tbody = table.querySelector('tbody');

                fields.forEach(f => {
                    const inputName = `measurements[${product.id}][${f.id}]`;

                    // ✅ Pre-fill if edit
                    const existing = (formMeasurements?.[product.id]?.[f.id]) || "";

                    let controlHtml = '';
                    if (f.fieldType === 'NUMBER') {
                        controlHtml = `<input type="number" step="0.01" class="form-control" name="${inputName}" value="${existing}" placeholder="${f.fieldName}">`;
                    } else if (f.fieldType === 'DROPDOWN') {
                        const opts = (f.options || '').split(',').map(s => s.trim()).filter(Boolean);
                        const optionsHtml = ['<option value="">Select</option>'].concat(
                            opts.map(o => `<option value="${o}" ${o === existing ? 'selected' : ''}>${o}</option>`)
                        ).join('');
                        controlHtml = `<select class="form-select" name="${inputName}">${optionsHtml}</select>`;
                    } else {
                        controlHtml = `<input type="text" class="form-control" name="${inputName}" value="${existing}" placeholder="${f.fieldName}">`;
                    }

                    // Build row
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                <td>${f.fieldName}</td>
                <td class="text-center">${controlHtml}</td>
            `;
                    tbody.appendChild(tr);
                });

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body p-0';
                cardBody.appendChild(table);

                card.appendChild(cardBody);
                container.appendChild(card);
            }
        }


    });


</script>

</body>
</html>
