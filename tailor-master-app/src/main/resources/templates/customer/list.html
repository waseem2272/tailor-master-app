<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Details</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/datatables.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .alert {
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>
<body>
<!-- Include Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="text-center">Customers</h2>

            <!-- Success Alert -->
            <div th:if="${successMessage}" class="row justify-content-center">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="row justify-content-center">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>

            <a th:href="@{/customers/create}" class="btn btn-success mb-3">Create New Customer</a>
            <table id="customersTable" class="table table-bordered">
                <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Customer Name</th>
                    <th>Phone Number</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="customer, iterStat : ${customers}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${customer.fullName}"></td>
                    <td th:text="${customer.phoneNumber}"></td>
                    <td>
                        <a th:href="@{'/orders/create/' + ${thymeleafUtil.encryptId(customer.id)}}" class="btn btn-sm btn-success">Create
                            Order</a>
                        <a th:href="@{'/customers/edit/' + ${thymeleafUtil.encryptId(customer.id)}}" class="btn btn-sm btn-warning">Edit</a>
                        <!--                <a th:href="@{'/customers/delete/' + ${customer.id}}" class="btn btn-sm btn-danger"-->
                        <!--                   onclick="return confirm('Are you sure you want to delete this customer?')">Delete</a>-->
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/datatables.min.js}"></script>
<script>
    $(document).ready(function () {
        $('#customersTable').DataTable();
    });
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
