<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Details</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
    <!-- Add this CSS somewhere (either page <style> or global) -->
    <style>
        .badge-completed {
            background-color: #6f42c1 !important;
        }
        .collapse-toggle-icon {
            transition: transform 0.3s ease;
        }

        .collapsed .collapse-toggle-icon {
            transform: rotate(0deg);
        }

        .collapse.show + .card-body .collapse-toggle-icon {
            transform: rotate(180deg);
        }

        .not-disabled-label {
            color: #212529 !important; /* Default Bootstrap text color */
            opacity: 1 !important; /* Remove any transparency */
        }
    </style>

</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <h2 class="page-title d-flex align-items-center mb-4">
                <i class="bi bi-person-fill me-2"></i> Customer Details
            </h2>

            <!-- Customer Information -->
            <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-info-circle me-2"></i> Customer Information
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <p><strong>Name:</strong> <span th:text="${customer.fullName}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Phone:</strong> <span th:text="${customer.phoneNumber}"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products & Measurements -->
            <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-rulers me-2"></i> Products & Measurements
                </div>
                <div class="card-body">

                    <div class="row" th:each="entry, iterStat : ${productMeasurementsMap}">
                        <div class="card shadow-sm mb-4 border-0 rounded-3">
                            <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center"
                                 data-bs-toggle="collapse"
                                 th:data-bs-target="'#collapse-' + ${iterStat.index}"
                                 aria-expanded="true"
                                 th:aria-controls="'collapse-' + ${iterStat.index}"
                                 style="cursor: pointer;">
                                <div>
                                    <i class="bi bi-box-seam me-2"></i>
                                    <span th:text="${entry.key.name}"></span>
                                </div>
                                <i class="bi bi-chevron-down toggle-icon"></i>
                            </div>
                            <div th:id="'collapse-' + ${iterStat.index}" class="collapse show">
                                <div class="card-body p-0">
                                    <table class="table table-bordered table-hover mb-0 align-middle">
                                        <thead class="table-success text-dark">
                                        <tr>
                                            <th>Measurement Field</th>
                                            <th class="text-center">Value</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="m : ${entry.value}">
                                            <td th:text="${m.field.fieldName}"></td>
                                            <td class="text-center">
                                                <span th:text="${m.value}"></span>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a th:href="@{'/customers/' + ${thymeleafUtil.encryptId(customer.id)} + '/edit'}"
                           class="btn btn-success shadow rounded-pill px-4">
                            <i class="bi bi-pencil-square"></i> Edit Customer
                        </a>

                        <a th:href="@{/customers}" class="btn btn-secondary shadow rounded-pill px-4">
                            <i class="bi bi-arrow-left-circle"></i> Back to Customers
                        </a>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-book me-2"></i> Customer Ledger
                </div>

                <div class="card-body">

                    <!-- Summary Bar -->
                    <!-- Total Orders - Centered -->
                    <div class="row justify-content-center text-center mb-4">
                        <div class="col-md-6">
                            <div class="p-4 border rounded bg-light">
                                <h5 class="text-muted mb-2">
                                    <i class="bi bi-bag-check me-1"></i> Total Orders
                                </h5>
                                <h3 class="fw-bold mb-0" th:text="${orderLedgerMap.size()}"></h3>
                            </div>
                        </div>
                    </div>

                    <!-- Credit & Debit -->
                    <div class="row text-center mb-4">
                        <div class="col-md-6 mb-3">
                            <div class="p-3 border rounded bg-success bg-opacity-10">
                                <h6 class="text-success mb-1">
                                    <i class="bi bi-arrow-down-square me-1"></i> Total Credit
                                </h6>
                                <h5 class="fw-bold text-success mb-0"
                                    th:text="${#numbers.formatDecimal(totalCredit, 1, 'COMMA', 2, 'POINT')}">
                                </h5>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <div class="p-3 border rounded bg-danger bg-opacity-10">
                                <h6 class="text-danger mb-1">
                                    <i class="bi bi-arrow-up-square me-1"></i> Total Debit
                                </h6>
                                <h5 class="fw-bold text-danger mb-0"
                                    th:text="${#numbers.formatDecimal(totalDebit, 1, 'COMMA', 2, 'POINT')}">
                                </h5>
                            </div>
                        </div>
                    </div>

                    <!-- Outstanding Balance - Centered -->
                    <div class="row justify-content-center text-center">
                        <div class="col-md-6 mb-2">
                            <div class="p-4 border rounded"
                                 th:classappend="${totalCredit.subtract(totalDebit) >= 0} ? ' bg-success bg-opacity-10' : ' bg-danger bg-opacity-10'">
                                <h5 th:classappend="${totalCredit.subtract(totalDebit) >= 0} ? ' text-success' : ' text-danger'" class="mb-2">
                                    <i class="bi bi-currency-exchange me-1"></i> Outstanding Balance
                                </h5>
                                <h3 th:classappend="${totalCredit.subtract(totalDebit) >= 0} ? ' text-success' : ' text-danger'"
                                    class="fw-bold mb-0"
                                    th:text="${#numbers.formatDecimal(totalCredit.subtract(totalDebit), 1, 'COMMA', 2, 'POINT')}">
                                </h3>
                            </div>
                        </div>
                    </div>

                    <div th:each="orderEntry : ${orderLedgerMap}" class="mb-3">
                        <div class="card shadow-sm rounded-3">
                            <div class="card-header d-flex justify-content-between align-items-center bg-success-subtle text-success-emphasis"
                                 style="cursor: pointer;"
                                 data-bs-toggle="collapse"
                                 th:data-bs-target="'#collapse__' + ${orderEntry.key}"
                                 th:aria-controls="'collapse__' + ${orderEntry.key}"
                                 aria-expanded="true">

                                <div>
                                    <h6 class="mb-0">
                                        Order: <span th:text="${orderEntry.key}"></span>

                                        <span th:classappend="${orderStatuses[orderEntry.key]?.name() == 'COMPLETED'
                       ? 'badge badge-completed'
                       : (orderStatuses[orderEntry.key]?.name() == 'DELIVERED'
                          ? 'badge bg-success'
                          : (orderStatuses[orderEntry.key]?.name() == 'CANCELLED'
                             ? 'badge bg-danger'
                                : (orderStatuses[orderEntry.key]?.name() == 'IN_PROGRESS'
                                   ? 'badge bg-primary'
                                   : 'badge bg-secondary')))}"
                                              th:text="${orderStatuses[orderEntry.key]?.name()}">
</span>
                                    </h6>

                                    <small>
                                        Remaining Balance:
                                        <span th:text="${#numbers.formatDecimal(
                            orderBalances[orderEntry.key],
                            1,
                            'COMMA',
                            2,
                            'POINT'
                        )}"
                                              th:classappend="${orderBalances[orderEntry.key] >= 0}
                              ? 'text-success'
                              : 'text-danger'">
        </span>
                                    </small>
                                </div>
                                <div>
                                    <i class="bi bi-chevron-down collapse-toggle-icon"
                                       th:id="'icon__' + ${orderEntry.key}"></i>
                                </div>
                            </div>

                            <div th:id="'collapse__' + ${orderEntry.key}" class="collapse show">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-striped mb-0">
                                            <thead class="table-light">
                                            <tr>
                                                <th>#</th>
                                                <th>Date</th>
                                                <th>Type</th>
                                                <th>Amount</th>
                                                <th>Description</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr th:each="entry, iterStat : ${orderEntry.value}">
                                                <td th:text="${iterStat.index + 1}"></td>
                                                <td th:text="${#temporals.format(entry.paymentDate, 'yyyy-MM-dd')}"></td>
                                                <td>
                                        <span th:text="${entry.paymentType}"
                                              th:classappend="${entry.paymentType == 'CREDIT'} ? 'text-success' : 'text-danger'">
                                        </span>
                                                </td>
                                                <td th:text="${#numbers.formatDecimal(entry.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                                                <td th:text="${entry.remarks}"></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div> <!-- card-body -->
            </div>

        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>
<!--<div th:replace="~{fragments/footer :: footer}"></div>-->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script>
    // Toggle arrow direction on collapse
    document.addEventListener("DOMContentLoaded", function () {
        const cards = document.querySelectorAll(".card-header");
        cards.forEach(header => {
            header.addEventListener("click", function () {
                const icon = this.querySelector(".toggle-icon");
                const collapseId = this.getAttribute("data-bs-target");
                const collapseElement = document.querySelector(collapseId);

                collapseElement.addEventListener("shown.bs.collapse", () => {
                    icon.classList.remove("bi-chevron-down");
                    icon.classList.add("bi-chevron-up");
                });

                collapseElement.addEventListener("hidden.bs.collapse", () => {
                    icon.classList.remove("bi-chevron-up");
                    icon.classList.add("bi-chevron-down");
                });
            });
        });
    });
</script>

</body>
</html>
