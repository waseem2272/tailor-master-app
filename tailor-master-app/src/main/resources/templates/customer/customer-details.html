<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Details</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
    <!-- Add this CSS somewhere (either page <style> or global) -->
    <style>
        .collapse-toggle-icon {
            transition: transform 0.3s ease;
        }
        .collapsed .collapse-toggle-icon {
            transform: rotate(0deg);
        }
        .collapse.show + .card-body .collapse-toggle-icon {
            transform: rotate(180deg);
        }
        .not-disabled-label {
            color: #212529 !important; /* Default Bootstrap text color */
            opacity: 1 !important;     /* Remove any transparency */
        }
    </style>

</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <h2 class="page-title d-flex align-items-center mb-4">
                <i class="bi bi-person-fill me-2"></i> Customer Details
            </h2>

            <!-- Customer Information -->
            <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-info-circle me-2"></i> Customer Information
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <p><strong>Name:</strong> <span th:text="${customer.fullName}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Phone:</strong> <span th:text="${customer.phoneNumber}"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products & Measurements -->
            <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-rulers me-2"></i>کسٹمرکی ناپ
                </div>
                <div class="card-body">
                    <div th:if="${measurement != null}">
                    <div class="row">
                        <div class="col-md-2">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="${measurement.frontPocket}" id="frontPocket">
                                <label class="form-check-label not-disabled-label" for="frontPocket">فرنٹ پاکٹ</label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.oneSidePocket}" id="oneSidePocket">
                                <label class="form-check-label not-disabled-label" for="oneSidePocket">1 سائیڈپاکیٹ</label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.twoSidePocket}" id="twoSidePocket">
                                <label class="form-check-label not-disabled-label" for="twoSidePocket">2 سائیڈپاکیٹ</label>
                            </div>
                        </div>

                        <div class="col-md-2">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.shalwarZipPocket}" id="shalwarZipPocket">
                                <label class="form-check-label not-disabled-label" for="shalwarZipPocket">شلوار زپ پاکٹ</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.shalwarSadaPocket}" id="shalwarSadaPocket">
                                <label class="form-check-label not-disabled-label" for="shalwarSadaPocket">شلوار سادہ پاکٹ</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.twoPajamaPocket}" id="twoPajamaPocket">
                                <label class="form-check-label not-disabled-label" for="twoPajamaPocket">2 پاجامہ پاکٹ</label>
                            </div>
                        </div>

                        <div class="col-md-2">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.singleSilai}" id="singleSilai">
                                <label class="form-check-label not-disabled-label" for="singleSilai">سنگل سلائی</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.doubleSilai}" id="doubleSilai">
                                <label class="form-check-label not-disabled-label" for="doubleSilai">ڈبل سلائی</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.chamakSilai}" id="chamakSilai">
                                <label class="form-check-label not-disabled-label" for="chamakSilai">چمک سلائی</label>
                            </div>
                        </div>

                        <div class="col-md-2">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.flopPocket}" id="flopPocket">
                                <label class="form-check-label not-disabled-label" for="flopPocket">فلاپ پاکیٹ</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.normalButton}" id="normalButton">
                                <label class="form-check-label not-disabled-label" for="normalButton">نارمل بٹن</label>
                            </div>
                        </div>

                        <div class="col-md-2">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.touchButton}" id="touchButton">
                                <label class="form-check-label not-disabled-label" for="touchButton">ٹچ بٹن</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" disabled
                                       th:checked="*{measurement.metalButton}" id="metalButton">
                                <label class="form-check-label not-disabled-label" for="metalButton">میٹل بٹن</label>
                            </div>
                        </div>
                    </div>
                    <hr/>

                    <div class="row mb-3">
                        <div class="col-md-6">

                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label for="qameezLength" class="form-label">قمیض لمبائی</label>
                                    <input type="text" id="qameezLength" name="qameezLength" th:field="*{measurement.qameezLength}" class="form-control" readonly>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label"></label>
                                    <p class="form-control-plaintext" th:text="${measurement.qameezType == 'gol_daman' ? 'گول دامن' : (measurement.qameezType == 'chakor_daman' ? 'چکور دامن' : '---')}">---</p>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label for="bazoo" class="form-label">بازو</label>
                                    <input type="text" id="bazoo" name="bazoo" th:field="*{measurement.bazoo}" class="form-control" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label for="kuhni" class="form-label"></label>
                                    <input type="text" id="kuhni" name="kuhni" th:field="*{measurement.kuhni}" class="form-control" placeholder="کہنی" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label for="aarmHole" class="form-label"></label>
                                    <input type="text" id="aarmHole" name="aarmHole" th:field="*{measurement.aarmHole}" class="form-control" placeholder="آرم ہول" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label for="kuff" class="form-label">کف</label>
                                    <input type="text" id="kuff" name="kuff" th:field="*{measurement.kuff}" class="form-control" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label for="golMoori" class="form-label">گول موری</label>
                                    <input type="text" id="golMoori" name="golMoori" th:field="*{measurement.golMoori}" class="form-control" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label for="galla" class="form-label">گلا</label>
                                    <input type="text" id="galla" name="galla" th:field="*{measurement.galla}" class="form-control" readonly>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label"></label>
                                    <p class="form-control-plaintext" th:text="${measurement.gallaType == 'shirt_collar' ? 'شرٹ کالر' : (measurement.gallaType == 'sherwani_been' ? 'شیروانی بین' : '---')}">---</p>

                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label for="tera" class="form-label">تیرا</label>
                                    <input type="text" id="tera" name="tera" th:field="*{measurement.tera}" class="form-control" readonly>
                                </div>
                                <div class="col-md-5">
                                    <label for="patiLambai" class="form-label">پٹی لمبائی</label>
                                    <input type="text" id="patiLambai" name="patiLambai" th:field="*{measurement.patiLambai}" class="form-control" readonly>
                                </div>
                            </div>

                        </div>

                        <div class="col-md-6">
                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label for="chati" class="form-label">چھاتی</label>
                                    <input type="text" id="chati" name="chati" th:field="*{measurement.chati}" class="form-control" readonly>
                                </div>
                                <div class="col-md-5">
                                    <label for="chati360" class="form-label"></label>
                                    <input type="text" id="chati360" name="chati360" th:field="*{measurement.chati360}" class="form-control" placeholder="360" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label for="kamar" class="form-label">کمر</label>
                                    <input type="text" id="kamar" name="kamar" th:field="*{measurement.kamar}" class="form-control" readonly>
                                </div>
                                <div class="col-md-5">
                                    <label for="kamar360" class="form-label"></label>
                                    <input type="text" id="kamar360" name="kamar360" th:field="*{measurement.kamar360}" class="form-control" placeholder="360" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label for="daman" class="form-label">دامن</label>
                                    <input type="text" id="daman" name="daman" th:field="*{measurement.daman}" class="form-control" readonly>
                                </div>
                                <div class="col-md-5">
                                    <label for="daman360" class="form-label"></label>
                                    <input type="text" id="daman360" name="daman360" th:field="*{measurement.daman360}" class="form-control" placeholder="360" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label for="shalwar" class="form-label">شلوار</label>
                                    <input type="text" id="shalwar" name="shalwar" th:field="*{measurement.shalwar}" class="form-control" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label for="shalwarGher" class="form-label"></label>
                                    <input type="text" id="shalwarGher" name="shalwarGher" th:field="*{measurement.shalwarGher}" class="form-control" placeholder="گھیر" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label for="shalwarPaincha" class="form-label"></label>
                                    <input type="text" id="shalwarPaincha" name="shalwarPaincha" th:field="*{measurement.shalwarPaincha}" class="form-control" placeholder="پائنچہ" readonly>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label for="pajama" class="form-label">پاجامہ</label>
                                    <input type="text" id="pajama" name="pajama" th:field="*{measurement.pajama}" class="form-control" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label for="pajamaWaist" class="form-label"></label>
                                    <input type="text" id="pajamaWaist" name="pajamaWaist" th:field="*{measurement.pajamaWaist}" class="form-control" placeholder="ویسٹ" readonly>
                                </div>
                                <div class="col-md-3">
                                    <label for="pajamaPaincha" class="form-label"></label>
                                    <input type="text" id="pajamaPaincha" name="pajamaPaincha" th:field="*{measurement.pajamaPaincha}" class="form-control" placeholder="پائنچہ" readonly>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label class="form-label"></label>
                                    <p class="form-control-plaintext" th:text="${measurement.lasticPlusDori == 'full_lastic_plus_dori' ? 'فل لاسٹک + ڈوری' : (measurement.lasticPlusDori == 'half_lastic_plus_dori' ? 'ہاف لاسٹک + ڈوری' : '---')}">---</p>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="deegar" class="form-label">دیگر</label>
                            <textarea id="deegar" th:field="*{measurement.deegar}" class="form-control" readonly
                                      rows="3"></textarea>
                        </div>
                    </div>
                    </div>

                    <div th:if="${measurement == null}">
                        <p class="text-muted">No measurements available for this customer.</p>
                    </div>

                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a th:href="@{'/customers/edit/' + ${thymeleafUtil.encryptId(customer.id)}}" class="btn btn-success shadow rounded-pill px-4">
                            <i class="bi bi-pencil-square"></i> Edit Customer
                        </a>

                        <a th:href="@{/customers}" class="btn btn-secondary shadow rounded-pill px-4">
                            <i class="bi bi-arrow-left-circle"></i> Back to Customers
                        </a>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                    <i class="bi bi-book me-2"></i> Customer Ledger
                </div>

                <div class="card-body">

                    <!-- Summary Bar -->
                    <!-- Total Orders - Centered -->
                    <div class="row justify-content-center text-center mb-4">
                        <div class="col-md-6">
                            <div class="p-4 border rounded bg-light">
                                <h5 class="text-muted mb-2">
                                    <i class="bi bi-bag-check me-1"></i> Total Orders
                                </h5>
                                <h3 class="fw-bold mb-0" th:text="${orderLedgerMap.size()}"></h3>
                            </div>
                        </div>
                    </div>

                    <!-- Credit & Debit -->
                    <div class="row text-center mb-4">
                        <div class="col-md-6 mb-3">
                            <div class="p-3 border rounded bg-success bg-opacity-10">
                                <h6 class="text-success mb-1">
                                    <i class="bi bi-arrow-down-square me-1"></i> Total Credit
                                </h6>
                                <h5 class="fw-bold text-success mb-0"
                                    th:text="${#numbers.formatDecimal(totalCredit, 1, 'COMMA', 2, 'POINT')}">
                                </h5>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <div class="p-3 border rounded bg-danger bg-opacity-10">
                                <h6 class="text-danger mb-1">
                                    <i class="bi bi-arrow-up-square me-1"></i> Total Debit
                                </h6>
                                <h5 class="fw-bold text-danger mb-0"
                                    th:text="${#numbers.formatDecimal(totalDebit, 1, 'COMMA', 2, 'POINT')}">
                                </h5>
                            </div>
                        </div>
                    </div>

                    <!-- Outstanding Balance - Centered -->
                    <div class="row justify-content-center text-center">
                        <div class="col-md-6 mb-2">
                            <div class="p-4 border rounded"
                                 th:classappend="${totalCredit.subtract(totalDebit) >= 0} ? ' bg-success bg-opacity-10' : ' bg-danger bg-opacity-10'">
                                <h5 th:classappend="${totalCredit.subtract(totalDebit) >= 0} ? ' text-success' : ' text-danger'" class="mb-2">
                                    <i class="bi bi-currency-exchange me-1"></i> Outstanding Balance
                                </h5>
                                <h3 th:classappend="${totalCredit.subtract(totalDebit) >= 0} ? ' text-success' : ' text-danger'"
                                    class="fw-bold mb-0"
                                    th:text="${#numbers.formatDecimal(totalCredit.subtract(totalDebit), 1, 'COMMA', 2, 'POINT')}">
                                </h3>
                            </div>
                        </div>
                    </div>

                    <div th:each="orderEntry : ${orderLedgerMap}" class="mb-3">
                        <div class="card shadow-sm rounded-3">
                            <div class="card-header d-flex justify-content-between align-items-center bg-success-subtle text-success-emphasis"
                                 style="cursor: pointer;"
                                 data-bs-toggle="collapse"
                                 th:data-bs-target="'#collapse__' + ${orderEntry.key}"
                                 th:aria-controls="'collapse__' + ${orderEntry.key}"
                                 aria-expanded="true">

                                <div>
                                    <h6 class="mb-0" th:text="'Order: ' + ${orderEntry.key}"></h6>
                                    <small>
                                        Remaining Balance:
                                        <span th:text="${#numbers.formatDecimal(orderBalances[orderEntry.key], 1, 'COMMA', 2, 'POINT')}"
                                              th:classappend="${orderBalances[orderEntry.key] >= 0} ? 'text-success' : 'text-danger'">
                            </span>
                                    </small>
                                </div>
                                <div>
                                    <i class="bi bi-chevron-down collapse-toggle-icon"
                                       th:id="'icon__' + ${orderEntry.key}"></i>
                                </div>
                            </div>

                            <div th:id="'collapse__' + ${orderEntry.key}" class="collapse show">
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-striped mb-0">
                                            <thead class="table-light">
                                            <tr>
                                                <th>#</th>
                                                <th>Date</th>
                                                <th>Type</th>
                                                <th>Amount</th>
                                                <th>Description</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr th:each="entry, iterStat : ${orderEntry.value}">
                                                <td th:text="${iterStat.index + 1}"></td>
                                                <td th:text="${#temporals.format(entry.paymentDate, 'yyyy-MM-dd')}"></td>
                                                <td>
                                        <span th:text="${entry.paymentType}"
                                              th:classappend="${entry.paymentType == 'CREDIT'} ? 'text-success' : 'text-danger'">
                                        </span>
                                                </td>
                                                <td th:text="${#numbers.formatDecimal(entry.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                                                <td th:text="${entry.remarks}"></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div> <!-- card-body -->
            </div>

        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>
<!--<div th:replace="~{fragments/footer :: footer}"></div>-->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script>
    document.querySelectorAll('[data-bs-toggle="collapse"]').forEach(function (header) {
        header.addEventListener('click', function () {
            const icon = header.querySelector('i');
            const targetId = header.getAttribute('data-bs-target');
            const target = document.querySelector(targetId);

            target.addEventListener('shown.bs.collapse', function () {
                icon.classList.remove('bi-chevron-down');
                icon.classList.add('bi-chevron-up');
            });

            target.addEventListener('hidden.bs.collapse', function () {
                icon.classList.remove('bi-chevron-up');
                icon.classList.add('bi-chevron-down');
            });
        });
    });
</script>


</body>
</html>
