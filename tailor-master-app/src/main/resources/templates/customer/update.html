<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Customer</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}">
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <h2 class="page-title d-flex align-items-center mb-4">
                <i class="bi bi-person-lines-fill me-2"></i> Update Customer
            </h2>

            <form th:action="@{/customers/update}" th:object="${registrationDTO}" method="post" onsubmit="return validateForm()">
                <input type="hidden" name="encryptedCustomerId"
                       th:if="${thymeleafUtil != null}"
                       th:value="${thymeleafUtil.encryptId(registrationDTO.customer.id)}">

                <!--<div th:if="${#fields.hasErrors('*')}">
                    <div class="alert alert-danger">Please correct the following errors:
                        <ul>
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                    </div>
                </div>-->
                <p class="text-danger fw-bold">Fields marked with * are required</p>

                <!-- Customer Information -->
                <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                    <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                        <i class="bi bi-info-circle me-2"></i> Customer Information
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="fullName" name="fullName" th:field="*{customer.fullName}" class="form-control"
                                       placeholder="Enter full name" required>
                                <!--<div th:if="${#fields.hasErrors('customer.fullName')}" class="text-danger">
                                    <span th:each="error : ${#fields.errors('customer.fullName')}" th:text="${error}"></span>
                                </div>-->
                            </div>
                            <div class="col-md-6">
                                <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                <input type="text" id="phoneNumber" name="phoneNumber" th:field="*{customer.phoneNumber}"
                                       class="form-control" placeholder="Enter phone number" required>
                                <!--<div th:if="${#fields.hasErrors('customer.phoneNumber')}" class="text-danger">
                                    <span th:each="error : ${#fields.errors('customer.phoneNumber')}" th:text="${error}"></span>
                                </div>-->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products and Measurements -->
                <div class="card shadow-sm border-success border-bottom border-3 mb-4">
                    <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                        <i class="bi bi-rulers me-2"></i> Products and Measurements
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-2" th:each="product : ${registrationDTO.products}">
                                <div class="form-check form-switch">
                                    <input class="form-check-input product-checkbox" type="checkbox"
                                           th:id="'product_' + ${product.id}"
                                           th:value="${product.id}" name="productIds[]"
                                           checked disabled>

                                    <!-- Hidden field to submit value -->
                                    <input type="hidden" name="productIds[]" th:value="${product.id}" />
                                    <label class="form-check-label fw-bold fs-5" th:for="'product_' + ${product.id}"
                                           th:text="${product.name}"></label>
                                </div>
                            </div>
                        </div>

                        <h5 class="mt-4 fw-bold">کسٹمرکی ناپ</h5>
                        <hr/>

                        <div class="row">
                            <div class="col-md-2">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{frontPocket}" id="frontPocket">
                                    <label class="form-check-label" for="frontPocket">فرنٹ پاکٹ</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{oneSidePocket}" id="oneSidePocket">
                                    <label class="form-check-label" for="oneSidePocket">1 سائیڈپاکیٹ</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{twoSidePocket}" id="twoSidePocket">
                                    <label class="form-check-label" for="twoSidePocket">2 سائیڈپاکیٹ</label>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{shalwarZipPocket}" id="shalwarZipPocket">
                                    <label class="form-check-label" for="shalwarZipPocket">شلوار زپ پاکٹ</label>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{shalwarSadaPocket}" id="shalwarSadaPocket">
                                    <label class="form-check-label" for="shalwarSadaPocket">شلوار سادہ پاکٹ</label>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{twoPajamaPocket}" id="twoPajamaPocket">
                                    <label class="form-check-label" for="twoPajamaPocket">2 پاجامہ پاکٹ</label>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{singleSilai}" id="singleSilai">
                                    <label class="form-check-label" for="singleSilai">سنگل سلائی</label>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{doubleSilai}" id="doubleSilai">
                                    <label class="form-check-label" for="doubleSilai">ڈبل سلائی</label>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{chamakSilai}" id="chamakSilai">
                                    <label class="form-check-label" for="chamakSilai">چمک سلائی</label>
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{flopPocket}" id="flopPocket">
                                    <label class="form-check-label" for="flopPocket">فلاپ پاکیٹ</label>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{normalButton}" id="normalButton">
                                    <label class="form-check-label" for="normalButton">نارمل بٹن</label>
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{touchButton}" id="touchButton">
                                    <label class="form-check-label" for="touchButton">ٹچ بٹن</label>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{metalButton}" id="metalButton">
                                    <label class="form-check-label" for="metalButton">میٹل بٹن</label>
                                </div>
                            </div>
                        </div>
                        <hr/>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="row mb-3">
                                    <div class="col-md-5">
                                        <label for="qameezLength" class="form-label">قمیض لمبائی</label>
                                        <input type="text" id="qameezLength" name="qameezLength" th:field="*{qameezLength}" class="form-control">
                                    </div>
                                    <div class="col-md-5">
                                        <label for="qameezType" class="form-label"></label>
                                        <select id="qameezType" name="qameezType" th:field="*{qameezType}" class="form-select rounded-pill">
                                            <option value="" selected>Select</option>
                                            <option th:value="gol_daman">گول دامن</option>
                                            <option th:value="chakor_daman">چکور دامن</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="bazoo" class="form-label">بازو</label>
                                        <input type="text" id="bazoo" name="bazoo" th:field="*{bazoo}" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="kuhni" class="form-label"></label>
                                        <input type="text" id="kuhni" name="kuhni" th:field="*{kuhni}" class="form-control" placeholder="کہنی">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="aarmHole" class="form-label"></label>
                                        <input type="text" id="aarmHole" name="aarmHole" th:field="*{aarmHole}" class="form-control" placeholder="آرم ہول">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="kuff" class="form-label">کف</label>
                                        <input type="text" id="kuff" name="kuff" th:field="*{kuff}" class="form-control">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="golMoori" class="form-label">گول موری</label>
                                        <input type="text" id="golMoori" name="golMoori" th:field="*{golMoori}" class="form-control">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-5">
                                        <label for="galla" class="form-label">گلا</label>
                                        <input type="text" id="galla" name="galla" th:field="*{galla}" class="form-control">
                                    </div>
                                    <div class="col-md-5">
                                        <label for="gallaType" class="form-label"></label>
                                        <select id="gallaType" name="gallaType" th:field="*{gallaType}" class="form-select rounded-pill">
                                            <option value="" selected>Select</option>
                                            <option th:value="shirt_collar">شرٹ کالر</option>
                                            <option th:value="sherwani_been">شیروانی بین</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-5">
                                        <label for="tera" class="form-label">تیرا</label>
                                        <input type="text" id="tera" name="tera" th:field="*{tera}" class="form-control">
                                    </div>
                                    <div class="col-md-5">
                                        <label for="patiLambai" class="form-label">پٹی لمبائی</label>
                                        <input type="text" id="patiLambai" name="patiLambai" th:field="*{patiLambai}" class="form-control">
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="row mb-3">
                                    <div class="col-md-5">
                                        <label for="chati" class="form-label">چھاتی</label>
                                        <input type="text" id="chati" name="chati" th:field="*{chati}" class="form-control">
                                    </div>
                                    <div class="col-md-5">
                                        <label for="chati360" class="form-label"></label>
                                        <input type="text" id="chati360" name="chati360" th:field="*{chati360}" class="form-control" placeholder="360">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-5">
                                        <label for="kamar" class="form-label">کمر</label>
                                        <input type="text" id="kamar" name="kamar" th:field="*{kamar}" class="form-control">
                                    </div>
                                    <div class="col-md-5">
                                        <label for="kamar360" class="form-label"></label>
                                        <input type="text" id="kamar360" name="kamar360" th:field="*{kamar360}" class="form-control" placeholder="360">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-5">
                                        <label for="daman" class="form-label">دامن</label>
                                        <input type="text" id="daman" name="daman" th:field="*{daman}" class="form-control">
                                    </div>
                                    <div class="col-md-5">
                                        <label for="daman360" class="form-label"></label>
                                        <input type="text" id="daman360" name="daman360" th:field="*{daman360}" class="form-control" placeholder="360">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="shalwar" class="form-label">شلوار</label>
                                        <input type="text" id="shalwar" name="shalwar" th:field="*{shalwar}" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="shalwarGher" class="form-label"></label>
                                        <input type="text" id="shalwarGher" name="shalwarGher" th:field="*{shalwarGher}" class="form-control" placeholder="گھیر">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="shalwarPaincha" class="form-label"></label>
                                        <input type="text" id="shalwarPaincha" name="shalwarPaincha" th:field="*{shalwarPaincha}" class="form-control" placeholder="پائنچہ">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="pajama" class="form-label">پاجامہ</label>
                                        <input type="text" id="pajama" name="pajama" th:field="*{pajama}" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="pajamaWaist" class="form-label"></label>
                                        <input type="text" id="pajamaWaist" name="pajamaWaist" th:field="*{pajamaWaist}" class="form-control" placeholder="ویسٹ">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="pajamaPaincha" class="form-label"></label>
                                        <input type="text" id="pajamaPaincha" name="pajamaPaincha" th:field="*{pajamaPaincha}" class="form-control" placeholder="پائنچہ">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-5">
                                        <label for="lasticPlusDori" class="form-label">لاسٹک + ڈوری</label>
                                        <select id="lasticPlusDori" name="lasticPlusDori" th:field="*{lasticPlusDori}" class="form-select rounded-pill">
                                            <option value="" selected>Select</option>
                                            <option th:value="full_lastic_plus_dori">فل لاسٹک + ڈوری</option>
                                            <option th:value="half_lastic_plus_dori">ہاف لاسٹک + ڈوری</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label for="deegar" class="form-label">دیگر</label>
                                <textarea id="deegar" th:field="*{deegar}" class="form-control"
                                          rows="3"></textarea>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="text-center mt-4">
                    <button type="button" id="openConfirmationModal" class="btn btn-success shadow rounded-pill px-4">
                        <i class="bi bi-check-circle"></i> Update
                    </button>
                    <a th:href="@{/customers}" class="btn btn-secondary shadow rounded-pill px-4">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow pickup-modal">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmationModalLabel">Confirm Update</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to update this customer with the provided details?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                <button type="button" class="btn btn-success" id="confirmSubmit"><i class="bi bi-check-circle me-1"></i>Yes, Update</button>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/create-customer.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">

        event.preventDefault(); // Prevent default action

        if (!validateForm()) {
            return; // Stop execution if validation fails
        }

        // Show the Bootstrap modal
        let confirmationModal = new bootstrap.Modal(document.getElementById("confirmationModal"));
        confirmationModal.show();
    });

    let confirmSubmitButton = document.getElementById("confirmSubmit");
    let form = document.querySelector("form");

    // When "Yes, Submit" is clicked in the modal, submit the form

        form.submit();
    });

</body>
</html>
