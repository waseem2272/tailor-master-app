<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Customer</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .card {
            margin: 50px auto;
            max-width: 500px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
        }

        .btn {
            width: 48%;
        }
    </style>
</head>
<body>
<!-- Include Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"/>
<div class="container">
    <div class="card">
        <h3 class="text-center">Update Customer</h3>
        <form th:action="@{'/customers/update/' + ${customer.id}}" th:object="${customer}" method="post">
            <div class="form-group">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" id="fullName" name="fullName" th:field="*{fullName}" class="form-control" required>
                <div th:if="${#fields.hasErrors('fullName')}" class="text-danger">
                    <div th:each="error : ${#fields.errors('fullName')}" th:text="${error}"></div>
                </div>
            </div>
<!--            <div class="form-group">-->
<!--                <label for="fatherName" class="form-label">Father's Name</label>-->
<!--                <input type="text" id="fatherName" name="fatherName" th:field="*{fatherName}" class="form-control">-->
<!--            </div>-->
<!--            <div class="form-group">-->
<!--                <label for="surname" class="form-label">Surname</label>-->
<!--                <input type="text" id="surname" name="surname" th:field="*{surname}" class="form-control">-->
<!--            </div>-->
            <div class="form-group">
                <label for="phoneNumber" class="form-label">Phone Number</label>
                <input type="text" id="phoneNumber" name="phoneNumber" th:field="*{phoneNumber}" class="form-control"
                       required>
                <div th:if="${#fields.hasErrors('phoneNumber')}" class="text-danger">
                    <div th:each="error : ${#fields.errors('phoneNumber')}" th:text="${error}"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="chest" class="form-label">Chest</label>
                <input type="text" id="chest" name="chest" th:field="*{chest}" class="form-control" required>
                <div th:if="${#fields.hasErrors('chest')}" class="text-danger">
                    <div th:each="error : ${#fields.errors('chest')}" th:text="${error}"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="waist" class="form-label">Waist</label>
                <input type="text" id="waist" name="waist" th:field="*{waist}" class="form-control" required>
                <div th:if="${#fields.hasErrors('waist')}" class="text-danger">
                    <div th:each="error : ${#fields.errors('waist')}" th:text="${error}"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="hips" class="form-label">Hips</label>
                <input type="text" id="hips" name="hips" th:field="*{hips}" class="form-control" required>
                <div th:if="${#fields.hasErrors('hips')}" class="text-danger">
                    <div th:each="error : ${#fields.errors('hips')}" th:text="${error}"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="sleeveLength" class="form-label">Sleeve Length</label>
                <input type="text" id="sleeveLength" name="sleeveLength" th:field="*{sleeveLength}"
                       class="form-control" required>
                <div th:if="${#fields.hasErrors('sleeveLength')}" class="text-danger">
                    <div th:each="error : ${#fields.errors('sleeveLength')}" th:text="${error}"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="shoulder" class="form-label">Shoulder</label>
                <input type="text" id="shoulder" name="shoulder" th:field="*{shoulder}" class="form-control" required>
                <div th:if="${#fields.hasErrors('shoulder')}" class="text-danger">
                    <div th:each="error : ${#fields.errors('shoulder')}" th:text="${error}"></div>
                </div>
            </div>
            <div class="btn-container text-center">
                <button type="submit" class="btn btn-warning">Update</button>
                <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"/>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
