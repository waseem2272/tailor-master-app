<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Preview</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .card {
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .card-body {
            padding: 15px;
        }
        .measurement-field {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="container mt-4">
    <h1 class="text-center text-primary mb-4">Customer Details Preview</h1>

    <!-- Alert for Errors -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Customer Information -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">Customer Information</div>
        <div class="card-body">
            <p><strong>Name:</strong> <span th:text="${registrationDTO.customer.fullName}"></span></p>
            <p><strong>Phone:</strong> <span th:text="${registrationDTO.customer.phoneNumber}"></span></p>
        </div>
    </div>

    <!-- Selected Products and Measurements -->
    <h3 class="text-center mb-3">Selected Products and Measurements</h3>
    <div class="row">
        <div class="col-md-12">
            <div class="row">
                <div th:each="entry : ${registrationDTO.customerMeasurements}" class="col-md-6 mb-4">
                    <div class="card shadow-sm">
                        <div class="card-header bg-secondary text-white">
                            <h5 th:text="${entry.value.product.name}"></h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6" th:if="${entry.value.chest != null}">
                                    <p><strong>Chest:</strong> <span th:text="${entry.value.chest}"></span></p>
                                </div>
                                <div class="col-6" th:if="${entry.value.sleeveLength != null}">
                                    <p><strong>Sleeve Length:</strong> <span th:text="${entry.value.sleeveLength}"></span></p>
                                </div>
                                <div class="col-6" th:if="${entry.value.shoulder != null}">
                                    <p><strong>Shoulder:</strong> <span th:text="${entry.value.shoulder}"></span></p>
                                </div>
                                <div class="col-6" th:if="${entry.value.hips != null}">
                                    <p><strong>Hips:</strong> <span th:text="${entry.value.hips}"></span></p>
                                </div>
                                <div class="col-6" th:if="${entry.value.waist != null}">
                                    <p><strong>Waist:</strong> <span th:text="${entry.value.waist}"></span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div> <!-- End product iteration -->
            </div>
        </div>
    </div>

    <!-- Submit/Action Buttons -->
    <div class="text-center mt-4">
        <button type="button" class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#confirmationModal">
            Confirm & Submit
        </button>
        <a th:href="@{/customers/create}" class="btn btn-secondary">Edit</a>
    </div>
</div>

<!-- Bootstrap Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Confirm Submission</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to submit this customer registration?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <form th:action="@{/customers/save}" method="post">
<!--                    <input type="hidden" th:name="registrationDTO" th:value="${registrationDTO}" />-->
                    <button type="submit" class="btn btn-primary">Yes, Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Auto Dismiss Alert -->
<script>
    setTimeout(function() {
        let alertBox = document.querySelector('.alert');
        if (alertBox) {
            alertBox.classList.remove('show');
            alertBox.classList.add('fade');
        }
    }, 5000); // Auto-dismiss after 5 seconds
</script>

</body>
</html>
