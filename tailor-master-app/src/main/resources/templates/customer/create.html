<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Customer</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <form th:action="@{/customers/create}" th:object="${registrationDTO}" method="post" id="------">
                <h2 class="page-title d-flex align-items-center mb-4">
                    <i class="bi bi-person-fill-add me-2"></i> نیا کسٹمر شامل کریں
                </h2>

                <!-- وزرڈ پروگریس -->
                <div class="progress mb-4">
                    <div class="progress-bar bg-success" role="progressbar" style="width: 33%">مرحلہ 1</div>
                </div>

                <!-- مرحلہ 1: کسٹمر معلومات -->
                <div class="wizard-step" id="step-1">
                    <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                        <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                            <i class="bi bi-info-circle me-2"></i> کسٹمر کی معلومات
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fullName" class="form-label">مکمل نام <span class="text-danger">*</span></label>
                                    <input type="text" id="fullName" th:field="*{customer.fullName}" class="form-control" placeholder="نام درج کریں" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phoneNumber" class="form-label">فون نمبر <span class="text-danger">*</span></label>
                                    <input type="text" id="phoneNumber" th:field="*{customer.phoneNumber}" class="form-control" placeholder="فون نمبر درج کریں" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-primary next-step">اگلا</button>
                    </div>
                </div>

                <!-- مرحلہ 2: پراڈکٹس -->
                <div class="wizard-step d-none" id="step-2">
                    <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                        <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                            <i class="bi bi-rulers me-2"></i> کپڑوں کی تفصیل
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 mb-2" th:each="product : ${registrationDTO.products}">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox"
                                               th:id="'product_' + ${product.id}"
                                               th:value="${product.id}" name="productIds[]">
                                        <label class="form-check-label fw-bold fs-5"
                                               th:for="'product_' + ${product.id}"
                                               th:text="${product.name}"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-secondary prev-step">پیچھے</button>
                        <button type="button" class="btn btn-primary next-step">اگلا</button>
                    </div>
                </div>

                <!-- مرحلہ 3: ناپ -->
                <div class="wizard-step d-none" id="step-3">
                    <div class="card border-success border-bottom border-3 shadow-sm mb-4">
                        <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                            <i class="bi bi-rulers me-2"></i> کسٹمر کی ناپ
                        </div>
                        <div class="card-body">
                            <!-- آپ کا موجودہ Measurements والا حصہ یہاں رہے گا -->
                            <div class="row mb-3">
                                <div class="col-md-5">
                                    <label for="qameezLength" class="form-label">قمیض لمبائی</label>
                                    <input type="text" id="qameezLength" th:field="*{qameezLength}" class="form-control">
                                </div>
                                <div class="col-md-5">
                                    <label for="chati" class="form-label">چھاتی</label>
                                    <input type="text" id="chati" th:field="*{chati}" class="form-control">
                                </div>
                            </div>
                            <!-- باقی ساری ناپ اسی طرح شامل کریں -->
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-secondary prev-step">پیچھے</button>
                        <button type="button" class="btn btn-success" id="openConfirmationModal">مکمل کریں</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow pickup-modal">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmationModalLabel">Confirm Submission</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to create this customer with the provided details?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                <button type="button" class="btn btn-success" id="confirmSubmit"><i class="bi bi-check-circle me-1"></i>Yes, Submit</button>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>

<!--<div th:replace="~{fragments/footer :: footer}"></div>-->
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/create-customer.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
<script>

    let currentStep = 1;
    function showStep(step) {
        document.querySelectorAll(".wizard-step").forEach(el => el.classList.add("d-none"));
        document.getElementById("step-" + step).classList.remove("d-none");

        // progress bar
        document.querySelector(".progress-bar").style.width = (step * 33) + "%";
        document.querySelector(".progress-bar").textContent = "مرحلہ " + step;
    }

    document.querySelectorAll(".next-step").forEach(btn => {
        btn.addEventListener("click", () => {
            currentStep++;
            showStep(currentStep);
        });
    });

    document.querySelectorAll(".prev-step").forEach(btn => {
        btn.addEventListener("click", () => {
            currentStep--;
            showStep(currentStep);
        });
    });

    document.getElementById("openConfirmationModal").addEventListener("click", function (event) {
        event.preventDefault(); // Prevent default action

        if (!validateForm()) {
            return; // Stop execution if validation fails
        }

        // Show the Bootstrap modal
        let confirmationModal = new bootstrap.Modal(document.getElementById("confirmationModal"));
        confirmationModal.show();
    });

    let confirmSubmitButton = document.getElementById("confirmSubmit");
    let form = document.querySelector("form");

    // When "Yes, Submit" is clicked in the modal, submit the form
    confirmSubmitButton.addEventListener("click", function () {
        form.submit();
    });

    function closeMeasurement(productId) {
        let measurementDiv = document.querySelector(`.measurement-fields[data-product-id="${productId}"]`);
        if (measurementDiv) {
            measurementDiv.style.display = "none";
            resetFields(productId);
        }
        // Uncheck the associated product checkbox
        let checkbox = document.querySelector(`.product-checkbox[value="${productId}"]`);
        if (checkbox) {
            checkbox.checked = false;
        }
    }

    function toggleMeasurements(checkbox) {
        let productId = checkbox.value;
        let measurementDiv = document.querySelector(`.measurement-fields[data-product-id="${productId}"]`);

        if (checkbox.checked) {
            if (measurementDiv) {
                measurementDiv.style.display = "block";
            }
        } else {
            resetFields(productId);
            if (measurementDiv) {
                measurementDiv.style.display = "none";
            }
        }
    }

    function resetFields(productId) {
        const measurementFields = document.querySelectorAll(`.measurement-fields[data-product-id="${productId}"] input`);
        measurementFields.forEach(field => {
            field.value = ""; // Clear input field value
        });
    }

    document.querySelectorAll('.product-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function () {
            const productErrorContainer = document.getElementById("productError");
            const isProductSelected = [...document.querySelectorAll('.product-checkbox')].some(cb => cb.checked);

            if (isProductSelected) {
                productErrorContainer.innerText = ""; // Remove error message when a product is selected
            }
        });
    });


</script>

</body>
</html>
