<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Customer</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <form th:action="@{/customers/create}" th:object="${registrationDTO}" method="post" onsubmit="return validateForm()">
                <h2 class="page-title d-flex align-items-center mb-4">
                    <i class="bi bi-person-fill-add me-2"></i> Create Customer
                </h2>
                <div th:if="${#fields.hasErrors('*')}">
                    <div class="alert alert-danger">Please correct the following errors:
                        <ul>
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                    </div>
                </div>
                <p class="text-danger fw-bold">Fields marked as * are required</p>

                <div class="card shadow-sm border-success mb-4">
                    <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                        <i class="bi bi-info-circle me-2"></i> Customer Information
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="fullName" name="fullName" th:field="*{customer.fullName}" class="form-control" placeholder="Enter full name" required>
                                <div th:if="${#fields.hasErrors('customer.fullName')}" class="text-danger small">
                                    <span th:each="error : ${#fields.errors('customer.fullName')}" th:text="${error}"></span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                <input type="text" id="phoneNumber" name="phoneNumber" th:field="*{customer.phoneNumber}" class="form-control" placeholder="Enter phone number" required>
                                <div th:if="${#fields.hasErrors('customer.phoneNumber')}" class="text-danger small">
                                    <span th:each="error : ${#fields.errors('customer.phoneNumber')}" th:text="${error}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-success mb-4">
                    <div class="card-header bg-success text-white fw-bold d-flex align-items-center rounded-top-4">
                        <i class="bi bi-rulers me-2"></i> Products and Measurements
                    </div>
                    <div class="card-body">
                        <h5 class="fw-bold">Select Products <span class="text-danger">*</span></h5>
                        <hr/>
                        <div class="row">
                            <div class="col-md-4 mb-2" th:each="product : ${registrationDTO.products}">
                                <div class="form-check form-switch">
                                    <input class="form-check-input product-checkbox" type="checkbox"
                                           th:id="'product_' + ${product.id}"
                                           th:value="${product.id}" name="productIds[]"
                                           th:checked="${registrationDTO.selectedProductIds != null and #lists.contains(registrationDTO.selectedProductIds, product.id)}"
                                           onchange="toggleMeasurements(this)">
                                    <label class="form-check-label fw-bold fs-5" th:for="'product_' + ${product.id}"
                                           th:text="${product.name}"></label>
                                </div>
                            </div>
                        </div>
                        <p id="productError" class="text-danger fw-bold"></p>

                        <h5 class="mt-4 fw-bold">Product Measurements</h5>
                        <hr/>
                        <div th:each="product : ${registrationDTO.products}" class="measurement-fields"
                             th:data-product-id="${product.id}"
                             th:style="${registrationDTO.selectedProductIds.contains(product.id) ? 'display:block;' : 'display:none;'}">
                            <div class="card shadow-sm border-success mb-4">
                                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center rounded-top-4">
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-check-circle me-2"></i>
                                        <span class="fw-bold" th:text="${product.name}"></span>
                                    </div>
                                    <!-- Optional close button (if you want hide measurement card feature)
                                    <button type="button" class="btn-close btn-close-white" aria-label="Close"
                                            onclick="closeMeasurement([[${product.id}]])"></button>
                                    -->
                                </div>
                                <div class="card-body">
                                    <div th:if="${product.type.name() == 'QAMEEZ'}">
                                        <div class="row g-3">
                                            <div class="col-md-4">
                                                <label th:for="'chest_'+ ${product.id}" class="form-label">سینہ <span class="text-danger">*</span></label>
                                                <input type="text" th:id="'chest_'+ ${product.id}" th:name="'customerMeasurements[' + ${product.id} + '].chest'"
                                                       th:value="${registrationDTO.customerMeasurements.get(product.id)?.chest}" class="form-control" placeholder="Enter chest size">
                                                <div th:if="${#fields.hasErrors('customerMeasurements[' + product.id + '].chest')}" class="text-danger">
                                                    <span th:each="error : ${#fields.errors('customerMeasurements[' + product.id + '].chest')}" th:text="${error}"></span>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <label th:for="'shoulder_'+ ${product.id}" class="form-label">کندھا <span class="text-danger">*</span></label>
                                                <input type="text" th:id="'shoulder_'+ ${product.id}" th:name="'customerMeasurements[' + ${product.id} + '].shoulder'"
                                                       th:value="${registrationDTO.customerMeasurements.get(product.id)?.shoulder}" class="form-control" placeholder="Enter shoulder length">
                                                <div th:if="${#fields.hasErrors('customerMeasurements[' + product.id + '].shoulder')}" class="text-danger">
                                                    <span th:each="error : ${#fields.errors('customerMeasurements[' + product.id + '].shoulder')}" th:text="${error}"></span>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <label th:for="'sleeveLength_'+ ${product.id}" class="form-label">آستینیں <span class="text-danger">*</span></label>
                                                <input type="text" th:id="'sleeveLength_'+ ${product.id}" th:name="'customerMeasurements[' + ${product.id} + '].sleeveLength'"
                                                       th:value="${registrationDTO.customerMeasurements.get(product.id)?.sleeveLength}" class="form-control" placeholder="Enter sleeves length">
                                                <div th:if="${#fields.hasErrors('customerMeasurements[' + product.id + '].sleeveLength')}" class="text-danger">
                                                    <span th:each="error : ${#fields.errors('customerMeasurements[' + product.id + '].sleeveLength')}" th:text="${error}"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div th:if="${product.type.name() == 'SHALWAR'}">
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <label th:for="'hips_'+ ${product.id}" class="form-label">Hips <span class="text-danger">*</span></label>
                                                <input type="text" th:id="'hips_'+ ${product.id}" th:name="'customerMeasurements[' + ${product.id} + '].hips'"
                                                       th:value="${registrationDTO.customerMeasurements.get(product.id)?.hips}" class="form-control" placeholder="Enter hips size">
                                                <div th:if="${#fields.hasErrors('customerMeasurements[' + product.id + '].hips')}" class="text-danger">
                                                    <span th:each="error : ${#fields.errors('customerMeasurements[' + product.id + '].hips')}" th:text="${error}"></span>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <label th:for="'waist_'+ ${product.id}" class="form-label">Waist <span class="text-danger">*</span></label>
                                                <input type="text" th:id="'waist_'+ ${product.id}" th:name="'customerMeasurements[' + ${product.id} + '].waist'"
                                                       th:value="${registrationDTO.customerMeasurements.get(product.id)?.waist}" class="form-control" placeholder="Enter waist size">
                                                <div th:if="${#fields.hasErrors('customerMeasurements[' + product.id + '].waist')}" class="text-danger">
                                                    <span th:each="error : ${#fields.errors('customerMeasurements[' + product.id + '].waist')}" th:text="${error}"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>


                <div class="text-center mt-4">
                    <button type="button" class="btn btn-success" id="openConfirmationModal"><i class="bi bi-check-circle me-1"></i> Create</button>
                    <a th:href="@{/customers}" class="btn btn-secondary"><i class="bi bi-x-circle me-1"></i> Cancel</a>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title" id="confirmationModalLabel">Confirm Submission</h5>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to create this customer with the provided details?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Cancel</button>
                <button type="button" class="btn btn-success" id="confirmSubmit"><i class="bi bi-check-circle me-1"></i>Yes, Submit</button>
            </div>
        </div>
    </div>
</div>


<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/create-customer.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>

<script>

    document.getElementById("openConfirmationModal").addEventListener("click", function (event) {
        event.preventDefault(); // Prevent default action

        if (!validateForm()) {
            return; // Stop execution if validation fails
        }

        // Show the Bootstrap modal
        let confirmationModal = new bootstrap.Modal(document.getElementById("confirmationModal"));
        confirmationModal.show();
    });

    let confirmSubmitButton = document.getElementById("confirmSubmit");
    let form = document.querySelector("form");

    // When "Yes, Submit" is clicked in the modal, submit the form
    confirmSubmitButton.addEventListener("click", function () {
        form.submit();
    });

    function closeMeasurement(productId) {
        let measurementDiv = document.querySelector(`.measurement-fields[data-product-id="${productId}"]`);
        if (measurementDiv) {
            measurementDiv.style.display = "none";
            resetFields(productId);
        }
        // Uncheck the associated product checkbox
        let checkbox = document.querySelector(`.product-checkbox[value="${productId}"]`);
        if (checkbox) {
            checkbox.checked = false;
        }
    }

    function toggleMeasurements(checkbox) {
        let productId = checkbox.value;
        let measurementDiv = document.querySelector(`.measurement-fields[data-product-id="${productId}"]`);

        if (checkbox.checked) {
            if (measurementDiv) {
                measurementDiv.style.display = "block";
            }
        } else {
            resetFields(productId);
            if (measurementDiv) {
                measurementDiv.style.display = "none";
            }
        }
    }

    function resetFields(productId) {
        const measurementFields = document.querySelectorAll(`.measurement-fields[data-product-id="${productId}"] input`);
        measurementFields.forEach(field => {
            field.value = ""; // Clear input field value
        });
    }

    document.querySelectorAll('.product-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function () {
            const productErrorContainer = document.getElementById("productError");
            const isProductSelected = [...document.querySelectorAll('.product-checkbox')].some(cb => cb.checked);

            if (isProductSelected) {
                productErrorContainer.innerText = ""; // Remove error message when a product is selected
            }
        });
    });


</script>

</body>
</html>
