<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"/>
<div class="container mt-5">
    <h2>Admin Dashboard</h2>
    <p>Welcome, Admin!</p>
    <!-- Notification Dropdown -->
    <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="notificationDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            Notifications <span class="badge badge-light" th:text="${notifications.size()}">0</span>
        </button>
        <div class="dropdown-menu" aria-labelledby="notificationDropdown">
            <div th:if="${notifications.isEmpty()}">
                <span class="dropdown-item">No new notifications</span>
            </div>
            <div th:each="order : ${notifications}">
                <a href="#" class="dropdown-item">
                    Order <span th:text="${order.id}"></span>: <span th:text="${order.orderType}"></span>
                </a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"/>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
