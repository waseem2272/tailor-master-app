<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Category</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <style>
        .card {
            margin: 50px auto;
            max-width: 500px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
        }

        .btn {
            width: 48%;
        }
    </style>
</head>
<script th:src="@{/js/language-direction.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<body>
<!-- Include Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h2 class="text-center">Update Category</h2>
        <form th:action="@{'/categories/update/' + ${category.id}}" th:object="${category}" method="post">
            <div class="form-group">
                <label for="name">Category Name</label>
                <input type="text" id="name" name="name" th:field="*{name}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" th:field="*{description}" class="form-control"></textarea>
            </div>
            <button type="submit" class="btn btn-warning">Update</button>
            <a th:href="@{/categories}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
