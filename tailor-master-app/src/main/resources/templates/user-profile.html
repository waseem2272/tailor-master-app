<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/custom-style.css}"/>
    <link rel="stylesheet" th:href="@{/font/bootstrap-icons.css}"/>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="content">
    <div class="main-content">
        <div class="container-fluid">

            <h2 class="page-title d-flex align-items-center mb-4">
                <i class="bi bi-person-fill me-2"></i> User Profile
            </h2>

            <!-- Success Alert -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-3" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-2 fs-4"></i>
                    <span th:text="${success}"></span>
                </div>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
                    <span th:text="${error}"></span>
                </div>
                <button type="button" class="btn-close bg-light" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card border-success border-bottom border-3 shadow-sm animate__animated animate__fadeIn rounded-4">
                <div class="card-header bg-success text-white fw-bold rounded-top-4">
                    <i class="bi bi-person-circle me-2"></i> User Information
                </div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <tr>
                            <th>Logo:</th>
                            <td>
                                <div th:if="${user.logo != null}">
                                    <img th:src="@{'/users/logo/' + ${user.username}}" alt="Shop Logo" style="max-height: 120px; max-width: 120px;">
                                </div>

                                <div th:if="${user.logo == null}">
                                    <span>No logo uploaded</span>
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <th>Full Name:</th>
                            <td th:text="${user.fullName}"></td>
                        </tr>
                        <tr>
                            <th>Father's Name:</th>
                            <td th:text="${user.fathersName}"></td>
                        </tr>
                        <tr>
                            <th>Phone Number 1:</th>
                            <td th:text="${user.phone1}"></td>
                        </tr>
                        <tr>
                            <th>Phone Number 2:</th>
                            <td th:text="${user.phone2}"></td>
                        </tr>
                        <tr>
                            <th>Date of Birth:</th>
                            <td th:text="${user.dateOfBirth}"></td>
                        </tr>
                        <tr>
                            <th>Shop Name:</th>
                            <td th:text="${user.shopName}"></td>
                        </tr>
                        <tr>
                            <th>Proprietor Name:</th>
                            <td th:text="${user.proprietorName}"></td>
                        </tr>
                        <tr>
                            <th>Shop Address:</th>
                            <td th:text="${user.shopAddress}"></td>
                        </tr>
                        <tr>
                            <th>Short Code:</th>
                            <td th:text="${user.shortCode}"></td>
                        </tr>
                    </table>

                    <div class="d-flex justify-content-center mt-4 gap-2">
                        <a th:href="@{/users/profile/edit}" class="btn btn-success shadow rounded-pill px-4">
                            <i class="bi bi-pencil-square"></i> Edit Profile
                        </a>
                        <a th:href="@{/dashboard}" class="btn btn-secondary shadow rounded-pill px-4">
                            <i class="bi bi-arrow-left-circle"></i> Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/notification-modal :: notification}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebar-toggle.js}"></script>
<script th:src="@{/js/dashboard-notifications.js}"></script>
<script th:inline="javascript">
    var contextPath = [[@{/}]];
</script>
</body>
</html>
